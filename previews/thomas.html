<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shy // thomas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #08120a; }
  body { font-family: 'Cormorant Garamond', serif; color: #f4ead4; cursor: grab; }
  body.dragging { cursor: grabbing; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }

  .meta-l, .meta-r {
    position: fixed; top: 1.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.28em; text-transform: uppercase;
    z-index: 10; color: rgba(244, 234, 212, 0.7);
    pointer-events: none; mix-blend-mode: screen;
    text-shadow: 0 1px 5px rgba(0,0,0,0.8);
  }
  .meta-l { left: 1.8rem; }
  .meta-r { right: 1.8rem; }

  .name {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-style: italic; font-size: clamp(3.5rem, 7vw, 5.5rem);
    letter-spacing: -0.01em; color: #f8efd9;
    z-index: 10; pointer-events: none;
    text-shadow: 0 0 28px rgba(0, 0, 0, 0.8), 0 0 60px rgba(98, 220, 130, 0.25);
    mix-blend-mode: screen;
  }
  .tag {
    position: fixed; bottom: 22%; left: 50%;
    transform: translateX(-50%);
    font-style: italic; font-size: 1rem;
    color: rgba(244, 234, 212, 0.7);
    z-index: 10; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    mix-blend-mode: screen; letter-spacing: 0.05em;
  }
  .links {
    position: fixed; bottom: 1.6rem; left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(244, 234, 212, 0.6);
    z-index: 10; mix-blend-mode: screen;
    text-shadow: 0 1px 5px rgba(0,0,0,0.8);
  }
  .links a {
    color: #76e08c; text-decoration: none;
    border-bottom: 1px dotted rgba(118, 224, 140, 0.4);
    padding-bottom: 2px; margin: 0 0.5em;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div class="meta-l">— thomas · b=0.208186 · cyclically symmetric</div>
<div class="meta-r">drag to orbit · slow knot</div>

<h1 class="name">shy.</h1>
<div class="tag">— a knot that keeps tying itself</div>

<div class="links">
  <a href="https://github.com/iCalculated">github</a> · <a href="mailto:sasha@hydrie.xyz">mail</a>
</div>

<script>
  // Thomas uses 3 sin() per particle per substep, which is the slow path.
  // Smaller N + 1 substep keeps it 60fps.
  const N = 35000;
  const B = 0.208186;
  const DT = 0.045;
  const SUBSTEPS = 1;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x08120a, 0.04);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.05, 200);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x08120a, 1);
  document.body.appendChild(renderer.domElement);

  const positions = new Float32Array(N * 3);
  // initialize particles spread across the attractor's natural extent (~±5)
  // so they're on the manifold from frame one rather than trickling out from a point
  for (let i = 0; i < N; i++) {
    positions[3*i]   = (Math.random() - 0.5) * 8;
    positions[3*i+1] = (Math.random() - 0.5) * 8;
    positions[3*i+2] = (Math.random() - 0.5) * 8;
  }
  // warm up: run a few hundred unrendered steps so transients settle onto the attractor
  (function warmup() {
    const sin = Math.sin;
    const arr = positions;
    for (let step = 0; step < 240; step++) {
      for (let i = 0; i < N; i++) {
        const ix = 3*i;
        const x = arr[ix], y = arr[ix+1], z = arr[ix+2];
        arr[ix]   = x + (sin(y) - B * x) * DT;
        arr[ix+1] = y + (sin(z) - B * y) * DT;
        arr[ix+2] = z + (sin(x) - B * z) * DT;
      }
    }
  })();

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

  const material = new THREE.ShaderMaterial({
    uniforms: { uPixelRatio: { value: renderer.getPixelRatio() } },
    vertexShader: `
      varying float vT;
      varying float vR;
      uniform float uPixelRatio;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // mix of axial position and distance — picks out the knot's depth
        vT = clamp((position.x + position.y + position.z) / 12.0 + 0.5, 0.0, 1.0);
        vR = clamp(length(position) / 6.0, 0.0, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uPixelRatio * (1.6 + 16.0 / max(0.7, -mv.z));
      }
    `,
    fragmentShader: `
      varying float vT;
      varying float vR;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float r = length(p);
        if (r > 0.5) discard;
        float a = pow(1.0 - r * 2.0, 1.6);

        // dim → green → magenta → cream peak
        vec3 cDark    = vec3(0.05, 0.12, 0.07);
        vec3 cGreen   = vec3(0.30, 0.86, 0.46);
        vec3 cMagenta = vec3(1.000, 0.494, 0.714);
        vec3 cCream   = vec3(0.96, 0.95, 0.85);

        float t = vT;
        vec3 col;
        if      (t < 0.35) col = mix(cDark,    cGreen,   smoothstep(0.0,  0.35, t));
        else if (t < 0.75) col = mix(cGreen,   cMagenta, smoothstep(0.35, 0.75, t));
        else                col = mix(cMagenta, cCream,   smoothstep(0.75, 1.0,  t));

        col = mix(col * 0.5, col, smoothstep(0.0, 0.3, vR));

        gl_FragColor = vec4(col * a, a * 0.5);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const cloud = new THREE.Points(geometry, material);
  scene.add(cloud);

  const target = new THREE.Vector3(0, 0, 0);
  let yaw = 0.4, pitch = 0.3, radius = 14;
  let yawTarget = yaw, pitchTarget = pitch, radiusTarget = radius;
  let dragging = false, lastX = 0, lastY = 0;
  let lastInteraction = performance.now();

  function place() {
    camera.position.set(
      Math.sin(yaw) * Math.cos(pitch) * radius,
      Math.sin(pitch) * radius,
      Math.cos(yaw) * Math.cos(pitch) * radius
    );
    camera.lookAt(target);
  }
  place();

  addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    document.body.classList.add('dragging');
    lastInteraction = performance.now();
  });
  addEventListener('pointerup',   () => { dragging = false; document.body.classList.remove('dragging'); });
  addEventListener('pointerleave',() => { dragging = false; document.body.classList.remove('dragging'); });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    yawTarget   += dx * 0.005;
    pitchTarget -= dy * 0.005;
    pitchTarget = Math.max(-1.3, Math.min(1.3, pitchTarget));
    lastX = e.clientX; lastY = e.clientY;
    lastInteraction = performance.now();
  });
  addEventListener('wheel', e => {
    radiusTarget *= 1 + e.deltaY * 0.0008;
    radiusTarget = Math.max(5, Math.min(40, radiusTarget));
    lastInteraction = performance.now();
  }, { passive: true });
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  const sin = Math.sin;
  function loop() {
    const now = performance.now();
    const idle = (now - lastInteraction) > 2000;
    if (idle) yawTarget += 0.0009;

    yaw   += (yawTarget   - yaw)   * 0.08;
    pitch += (pitchTarget - pitch) * 0.08;
    radius += (radiusTarget - radius) * 0.08;
    place();

    const arr = positions;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (let i = 0; i < N; i++) {
        const ix = 3*i;
        const x = arr[ix], y = arr[ix+1], z = arr[ix+2];
        const dx = sin(y) - B * x;
        const dy = sin(z) - B * y;
        const dz = sin(x) - B * z;
        arr[ix]   = x + dx * DT;
        arr[ix+1] = y + dy * DT;
        arr[ix+2] = z + dz * DT;
      }
    }
    geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
