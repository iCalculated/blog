<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>shy // lorenz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0a0612; }
  body { font-family: 'Cormorant Garamond', serif; color: #f4ead4; cursor: grab; }
  body.dragging { cursor: grabbing; }
  canvas { display: block; position: fixed; inset: 0; z-index: 1; }

  .meta-l, .meta-r {
    position: fixed; top: 1.6rem;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.28em; text-transform: uppercase;
    z-index: 10; color: rgba(244, 234, 212, 0.7);
    pointer-events: none; mix-blend-mode: screen;
    text-shadow: 0 1px 5px rgba(0,0,0,0.8);
  }
  .meta-l { left: 1.8rem; }
  .meta-r { right: 1.8rem; }

  .name {
    position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-style: italic; font-size: clamp(3.5rem, 7vw, 5.5rem);
    letter-spacing: -0.01em; color: #f8efd9;
    z-index: 10; pointer-events: none;
    text-shadow: 0 0 28px rgba(0, 0, 0, 0.8), 0 0 60px rgba(190, 149, 255, 0.25);
    mix-blend-mode: screen;
  }
  .tag {
    position: fixed; bottom: 22%; left: 50%;
    transform: translateX(-50%);
    font-style: italic; font-size: 1rem;
    color: rgba(244, 234, 212, 0.7);
    z-index: 10; pointer-events: none;
    text-shadow: 0 1px 12px rgba(0,0,0,0.8);
    mix-blend-mode: screen; letter-spacing: 0.05em;
  }
  .links {
    position: fixed; bottom: 1.6rem; left: 50%;
    transform: translateX(-50%);
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.66rem; letter-spacing: 0.3em; text-transform: uppercase;
    color: rgba(244, 234, 212, 0.6);
    z-index: 10; mix-blend-mode: screen;
    text-shadow: 0 1px 5px rgba(0,0,0,0.8);
  }
  .links a {
    color: #be95ff; text-decoration: none;
    border-bottom: 1px dotted rgba(190, 149, 255, 0.4);
    padding-bottom: 2px; margin: 0 0.5em;
    pointer-events: auto;
  }
</style>
</head>
<body>

<div class="meta-l">— lorenz · σ=10 ρ=28 β=8/3</div>
<div class="meta-r">drag to orbit · butterfly</div>

<h1 class="name">shy.</h1>
<div class="tag">— two wings, one path</div>

<div class="links">
  <a href="https://github.com/iCalculated">github</a> · <a href="mailto:sasha@hydrie.xyz">mail</a>
</div>

<script>
  const N = 60000;
  const SIGMA = 10.0, RHO = 28.0, BETA = 8.0 / 3.0;
  const DT = 0.0045;
  const SUBSTEPS = 2;

  const scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(0x0a0612, 0.012);
  const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 400);
  camera.position.set(0, 0, 90);
  camera.lookAt(0, 0, 25);

  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
  renderer.setSize(innerWidth, innerHeight);
  renderer.setClearColor(0x0a0612, 1);
  document.body.appendChild(renderer.domElement);

  // particle cloud — one trajectory point per particle, all integrated each frame.
  const positions = new Float32Array(N * 3);
  const ages = new Float32Array(N);
  for (let i = 0; i < N; i++) {
    // random initial conditions in a small ball — they'll be drawn onto the attractor
    positions[3*i]   = (Math.random() - 0.5) * 6;
    positions[3*i+1] = (Math.random() - 0.5) * 6;
    positions[3*i+2] = 25 + (Math.random() - 0.5) * 6;
    ages[i] = Math.random();
  }

  const geometry = new THREE.BufferGeometry();
  geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geometry.setAttribute('aAge', new THREE.BufferAttribute(ages, 1));

  // custom shader: color by z, size by view distance, soft circular point
  const material = new THREE.ShaderMaterial({
    uniforms: {
      uTime: { value: 0 },
      uPixelRatio: { value: renderer.getPixelRatio() },
    },
    vertexShader: `
      attribute float aAge;
      varying float vT;
      varying float vSpeed;
      uniform float uPixelRatio;
      void main() {
        vec4 mv = modelViewMatrix * vec4(position, 1.0);
        // z normalized for color: lorenz z roughly 0..50
        vT = clamp(position.z / 50.0, 0.0, 1.0);
        // approximate speed — distance from origin grows with arms
        vSpeed = clamp(length(position.xy) / 20.0, 0.0, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = uPixelRatio * (1.5 + 30.0 / max(1.0, -mv.z));
      }
    `,
    fragmentShader: `
      varying float vT;
      varying float vSpeed;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float r = length(p);
        if (r > 0.5) discard;
        float a = pow(1.0 - r * 2.0, 1.6);

        // oxocarbon ramp by z: deep purple → magenta → cyan → cream
        vec3 cDark    = vec3(0.16, 0.10, 0.30);
        vec3 cPurple  = vec3(0.745, 0.584, 1.000);
        vec3 cMagenta = vec3(1.000, 0.494, 0.714);
        vec3 cCyan    = vec3(0.239, 0.859, 0.851);
        vec3 cCream   = vec3(0.96, 0.92, 0.78);
        vec3 col;
        if      (vT < 0.30) col = mix(cDark,    cPurple,  smoothstep(0.0,  0.30, vT));
        else if (vT < 0.60) col = mix(cPurple,  cMagenta, smoothstep(0.30, 0.60, vT));
        else if (vT < 0.85) col = mix(cMagenta, cCyan,    smoothstep(0.60, 0.85, vT));
        else                col = mix(cCyan,    cCream,   smoothstep(0.85, 1.0,  vT));

        // hot core lift on fast-moving outer arm particles
        col = mix(col, cCream, vSpeed * 0.15);

        gl_FragColor = vec4(col * a, a * 0.55);
      }
    `,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending,
  });

  const cloud = new THREE.Points(geometry, material);
  cloud.position.set(0, 0, -25); // recenter the attractor at origin (it lives near z=25)
  scene.add(cloud);

  // ----- camera orbit driven by cursor -----
  const target = new THREE.Vector3(0, 0, 0);
  let yaw = 0, pitch = -0.15;
  let yawTarget = 0, pitchTarget = -0.15;
  let radius = 90, radiusTarget = 90;
  let dragging = false, lastX = 0, lastY = 0;
  let lastInteraction = performance.now();

  function place() {
    const p = pitch;
    const y = yaw;
    camera.position.set(
      Math.sin(y) * Math.cos(p) * radius,
      Math.sin(p) * radius,
      Math.cos(y) * Math.cos(p) * radius
    );
    camera.lookAt(target);
  }
  place();

  addEventListener('pointerdown', e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    document.body.classList.add('dragging');
    lastInteraction = performance.now();
  });
  addEventListener('pointerup',   () => { dragging = false; document.body.classList.remove('dragging'); });
  addEventListener('pointerleave',() => { dragging = false; document.body.classList.remove('dragging'); });
  addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY;
    yawTarget   += dx * 0.005;
    pitchTarget -= dy * 0.005;
    pitchTarget = Math.max(-1.3, Math.min(1.3, pitchTarget));
    lastX = e.clientX; lastY = e.clientY;
    lastInteraction = performance.now();
  });
  addEventListener('wheel', e => {
    radiusTarget *= 1 + e.deltaY * 0.0008;
    radiusTarget = Math.max(35, Math.min(200, radiusTarget));
    lastInteraction = performance.now();
  }, { passive: true });
  addEventListener('resize', () => {
    camera.aspect = innerWidth / innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });

  // ----- animate -----
  const t0 = performance.now();
  function loop() {
    const now = performance.now();
    const t = (now - t0) / 1000;
    material.uniforms.uTime.value = t;

    // idle auto-rotate when no interaction for >2s
    const idle = (now - lastInteraction) > 2000;
    if (idle) yawTarget += 0.0014;

    // smooth follow
    yaw   += (yawTarget   - yaw)   * 0.08;
    pitch += (pitchTarget - pitch) * 0.08;
    radius += (radiusTarget - radius) * 0.08;
    place();

    // integrate the lorenz ODE for every particle (Euler with substeps; system is dissipative and stable at this dt)
    const arr = positions;
    for (let s = 0; s < SUBSTEPS; s++) {
      for (let i = 0; i < N; i++) {
        const ix = 3*i;
        const x = arr[ix], y = arr[ix+1], z = arr[ix+2];
        const dx = SIGMA * (y - x);
        const dy = x * (RHO - z) - y;
        const dz = x * y - BETA * z;
        arr[ix]   = x + dx * DT;
        arr[ix+1] = y + dy * DT;
        arr[ix+2] = z + dz * DT;
      }
    }
    geometry.attributes.position.needsUpdate = true;

    renderer.render(scene, camera);
    requestAnimationFrame(loop);
  }
  loop();
</script>
</body>
</html>
