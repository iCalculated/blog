<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>card</title>
<meta name="description" content="make a contact card anyone can scan">
<meta name="theme-color" content="#161616">
<meta property="og:title" content="card">
<meta property="og:description" content="a contact card anyone can scan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #161616; --panel: #1e1e1e; --line: #2e2e2e;
    --ink: #dcd8cf; --dim: #8a867e; --accent: #9fd6c2; --paper: #f4f1ea;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "IBM Plex Mono", ui-monospace, Menlo, monospace;
    min-height: 100dvh;
  }
  main {
    max-width: 440px; margin: 0 auto;
    padding: max(28px, env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom));
  }
  h1 { font-size: 15px; font-weight: 500; margin: 0 0 20px; letter-spacing: .02em; }
  h1 a { color: var(--dim); text-decoration: none; }
  h1 span { color: var(--dim); font-weight: 400; }
  [hidden] { display: none !important; }

  .row { display: flex; gap: 8px; flex-wrap: wrap; }
  button, .btn {
    font: inherit; color: var(--ink); background: var(--panel);
    border: 1px solid var(--line); border-radius: 8px;
    padding: 10px 14px; cursor: pointer; flex: 1 1 auto; text-align: center;
    text-decoration: none; -webkit-tap-highlight-color: transparent;
  }
  button:hover, .btn:hover { border-color: var(--dim); }
  button:active, .btn:active { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); color: #10201b; border-color: var(--accent); font-weight: 500; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, .btn:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 1px;
  }

  .fields { margin: 18px 0; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
  .fields label { display: flex; align-items: baseline; border-top: 1px solid var(--line); }
  .fields label:first-child { border-top: 0; }
  .fields span { flex: 0 0 76px; padding: 11px 0 11px 14px; color: var(--dim); font-size: 13px; }
  .fields input, .fields textarea {
    flex: 1; min-width: 0; font: inherit; font-size: 16px; color: var(--ink);
    background: transparent; border: 0; padding: 11px 14px 11px 6px; resize: none;
  }
  .fields input::placeholder, .fields textarea::placeholder { color: #55524c; }
  .fields input:focus, .fields textarea:focus { outline: none; background: #232323; }

  .qr {
    background: var(--paper); border-radius: 14px; padding: 14px;
    display: grid; place-items: center; margin: 18px 0 10px;
  }
  .qr canvas { width: 100%; height: auto; max-width: 340px; image-rendering: pixelated; display: block; }
  .qr p { color: #6b675f; margin: 40px 0; font-size: 13px; }
  .hint { color: var(--dim); font-size: 12.5px; margin: 8px 2px 16px; }
  .hint a { color: var(--ink); }

  #toast {
    position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom)); transform: translateX(-50%);
    background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: 8px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>
<main>
  <!-- make a card -->
  <section id="edit">
    <div class="row">
      <button id="pick" hidden>pick contact</button>
    </div>

    <form class="fields" id="form" autocomplete="on" onsubmit="return false">
      <label><span>name</span><input name="fn" autocomplete="name" placeholder="ada lovelace" enterkeyhint="next"></label>
      <label><span>phone</span><input name="tel" type="tel" autocomplete="tel" inputmode="tel" placeholder="+44 20 7946 0199" enterkeyhint="next"></label>
      <label><span>email</span><input name="email" type="email" autocomplete="email" inputmode="email" placeholder="ada@ada.example" autocapitalize="off" enterkeyhint="next"></label>
      <label><span>org</span><input name="org" autocomplete="organization" placeholder="analytical engines" enterkeyhint="next"></label>
      <label><span>site</span><input name="url" type="url" autocomplete="url" inputmode="url" placeholder="ada.example" autocapitalize="off" enterkeyhint="next"></label>
      <label><span>note</span><textarea name="note" rows="1" placeholder="wrote the first program"></textarea></label>
    </form>

    <div class="qr"><canvas id="qrEdit" hidden></canvas><p id="qrEmpty">add a name</p></div>

    <div class="row">
      <button class="primary" id="saveEdit">save qr</button>
    </div>
  </section>

</main>
<div id="toast" role="status"></div>

<script src="qrcode.js"></script>
<script>
(() => {
  const FIELDS = ['fn', 'tel', 'email', 'org', 'url', 'note'];
  const STORE = 'card.draft';
  const $ = id => document.getElementById(id);
  const form = $('form');
  qrcode.stringToBytes = qrcode.stringToBytesFuncs['UTF-8'];

  // ---------- data ----------
  const clean = d => {
    const o = {};
    for (const k of FIELDS) { const v = (d[k] || '').trim(); if (v) o[k] = v; }
    return o;
  };
  const list = s => (s || '').split(/[,\n]/).map(x => x.trim()).filter(Boolean);
  const href = u => /^[a-z][a-z0-9+.-]*:/i.test(u) ? u : 'https://' + u;

  // ---------- vcard ----------
  const esc = s => s.replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/([,;])/g, '\\$1');
  function toVCard(d, nl = '\n') {
    d = clean(d);
    const parts = (d.fn || '').split(/\s+/);
    const family = parts.length > 1 ? parts.pop() : '';
    const L = ['BEGIN:VCARD', 'VERSION:3.0',
      `N:${esc(family)};${esc(parts.join(' '))};;;`, `FN:${esc(d.fn || '')}`];
    if (d.org) L.push('ORG:' + esc(d.org));
    list(d.tel).forEach(t => L.push('TEL;TYPE=CELL:' + t));
    list(d.email).forEach(e => L.push('EMAIL:' + e));
    if (d.url) L.push('URL:' + href(d.url));
    if (d.note) L.push('NOTE:' + esc(d.note));
    L.push('END:VCARD');
    return L.join(nl);
  }

  // ---------- qr ----------
  function drawQR(canvas, text) {
    let qr;
    for (const level of ['M', 'L']) {
      try { qr = qrcode(0, level); qr.addData(text, 'Byte'); qr.make(); break; } catch { qr = null; }
    }
    if (!qr) return false;
    const n = qr.getModuleCount(), quiet = 3, total = n + quiet * 2;
    const px = Math.max(4, Math.ceil(1024 / total));
    canvas.width = canvas.height = total * px;
    const g = canvas.getContext('2d');
    g.fillStyle = '#f4f1ea'; g.fillRect(0, 0, canvas.width, canvas.height);
    g.fillStyle = '#161616';
    for (let r = 0; r < n; r++) for (let c = 0; c < n; c++)
      if (qr.isDark(r, c)) g.fillRect((c + quiet) * px, (r + quiet) * px, px, px);
    return true;
  }

  // ---------- small helpers ----------
  let toastT;
  function toast(msg) {
    const t = $('toast'); t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 1800);
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  const slug = d => (d.fn || 'contact').toLowerCase().replace(/[^\p{L}\p{N}]+/gu, '-').replace(/^-|-$/g, '') || 'contact';

  function download(blob, name) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 30000);
  }
  function saveQR(canvas, d) {
    canvas.toBlob(async blob => {
      const file = new File([blob], slug(d) + '-qr.png', { type: 'image/png' });
      if (matchMedia('(pointer: coarse)').matches && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
      }
      download(blob, file.name);
    }, 'image/png');
  }
  // ---------- editor ----------
  const read = () => clean(Object.fromEntries(FIELDS.map(k => [k, form.elements[k].value])));
  function fill(d) {
    for (const k of FIELDS) form.elements[k].value = d[k] || '';
    grow(); refresh();
  }
  function grow() {
    const t = form.elements.note; t.style.height = 'auto'; t.style.height = t.scrollHeight + 'px';
  }
  function refresh() {
    const d = read(), ok = !!d.fn;
    store.set(STORE, JSON.stringify(d));
    const drawn = ok && drawQR($('qrEdit'), toVCard(d));
    $('qrEdit').hidden = !drawn; $('qrEmpty').hidden = drawn;
    $('qrEmpty').textContent = ok ? 'too much text for a qr' : 'add a name';
    $('saveEdit').disabled = !ok;
  }
  let draft = {};
  try { draft = JSON.parse(store.get(STORE) || '{}') || {}; } catch {}

  form.addEventListener('input', () => { grow(); refresh(); });
  $('saveEdit').onclick = () => saveQR($('qrEdit'), read());

  // contact picker (android chrome; ios safari behind a flag)
  if (navigator.contacts && navigator.contacts.select) {
    $('pick').hidden = false;
    $('pick').onclick = async () => {
      try {
        const want = ['name', 'tel', 'email'];
        const props = (await navigator.contacts.getProperties()).filter(p => want.includes(p));
        const [c] = await navigator.contacts.select(props, { multiple: false });
        if (!c) return;
        fill({ fn: (c.name || [])[0] || '', tel: (c.tel || []).join(', '), email: (c.email || []).join(', ') });
      } catch {}
    };
  }
  fill(draft);
})();
</script>
</body>
</html>
