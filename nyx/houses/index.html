<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nyx · House Search</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222c; --line:#2a2f3a;
    --txt:#e7eaf0; --muted:#9aa3b2; --accent:#7c9cff; --accent2:#5ad1a8;
    --good:#3ecf8e; --mid:#e7b94f; --bad:#e0666b;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  a{color:var(--accent);text-decoration:none}
  header{position:sticky;top:0;z-index:30;background:rgba(15,17,21,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:14px 18px}
  .hwrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.3px}
  h1 .moon{opacity:.8}
  .sub{color:var(--muted);font-size:12.5px}
  .controls{display:flex;gap:8px;flex-wrap:wrap;margin-left:auto}
  select,input[type=search]{background:var(--panel2);color:var(--txt);border:1px solid var(--line);border-radius:9px;padding:7px 10px;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px;padding:18px;max-width:1500px;margin:0 auto}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;cursor:pointer;transition:.15s transform,.15s border-color;display:flex;flex-direction:column}
  .card:hover{transform:translateY(-3px);border-color:var(--accent)}
  .photo{position:relative;aspect-ratio:4/3;background:linear-gradient(135deg,#222838,#171a21);overflow:hidden;touch-action:pan-y}
  .photo img{width:100%;height:100%;object-fit:cover;display:block;user-select:none;-webkit-user-drag:none}
  .photo .nophoto{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px}
  .cardnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.45);color:#fff;border:none;width:30px;height:30px;border-radius:50%;font-size:16px;line-height:1;cursor:pointer;opacity:0;transition:.15s;z-index:4;display:flex;align-items:center;justify-content:center}
  .card:hover .cardnav{opacity:.85}
  .cardnav:hover{opacity:1!important;background:rgba(0,0,0,.7)}
  .cardnav.prev{left:8px}.cardnav.next{right:8px}
  .dots{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);display:flex;gap:4px;z-index:4}
  .dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,255,255,.45);transition:.15s}
  .dots i.on{background:#fff;width:14px;border-radius:3px}
  .pcount{position:absolute;bottom:8px;right:10px;background:rgba(0,0,0,.55);color:#fff;font-size:10.5px;padding:2px 7px;border-radius:10px;z-index:4}
  .badge{position:absolute;top:10px;left:10px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:16px;color:#0c0e12;box-shadow:0 2px 10px rgba(0,0,0,.4)}
  .badge.fail{width:auto;height:auto;border-radius:9px;padding:5px 9px;font-size:12px;letter-spacing:.5px;background:#e0666b;color:#1a0707}
  .badge.longshot{width:auto;height:auto;border-radius:9px;padding:5px 9px;font-size:11px;letter-spacing:.4px;background:#5b6172;color:#e7eaf0}
  .card.dq{opacity:.62}
  .card.dq:hover{opacity:1}
  .card.dq .photo::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(135deg,rgba(224,102,107,.05)0,rgba(224,102,107,.05)10px,rgba(0,0,0,0)10px,rgba(0,0,0,0)20px);pointer-events:none}
  .lsnote{margin-top:auto;padding-top:8px;font-size:11.5px;color:#9aa3b2;font-style:italic}
  .pillrow{position:absolute;top:10px;right:10px;display:flex;gap:6px;flex-direction:column;align-items:flex-end}
  .pill{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:20px;background:rgba(0,0,0,.55);color:#fff;text-transform:uppercase;letter-spacing:.4px}
  .pill.shortlist{background:var(--good);color:#06140d}
  .pill.rejected{background:var(--bad);color:#1a0707}
  .body{padding:12px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
  .addr{font-weight:700;font-size:15px}
  .hood{color:var(--muted);font-size:12.5px}
  .stats{display:flex;gap:12px;flex-wrap:wrap;color:var(--txt);font-size:13px;margin-top:2px}
  .stats b{font-weight:700}
  .price{font-size:16px;font-weight:800;color:#fff}
  .price .permo{font-size:11px;font-weight:600;color:var(--muted);margin-left:1px}
  .subprice{font-size:11.5px;color:var(--muted);margin-top:-2px}
  .cat{display:inline-block;font-size:10.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .actions{display:flex;gap:6px;margin-top:auto;padding-top:8px}
  .btn{flex:1;border:1px solid var(--line);background:var(--panel2);color:var(--txt);border-radius:8px;padding:7px;font-size:12px;font-weight:600;cursor:pointer;transition:.12s}
  .btn:hover{border-color:var(--accent)}
  .btn.short.on{background:var(--good);color:#06140d;border-color:var(--good)}
  .btn.rej.on{background:var(--bad);color:#1a0707;border-color:var(--bad)}
  /* modal */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(5,7,10,.82);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px}
  .modal.open{display:flex}
  .sheet{background:var(--panel);border:1px solid var(--line);border-radius:18px;max-width:920px;width:100%;overflow:hidden}
  .carousel{position:relative;background:#0a0c10;aspect-ratio:16/10}
  .carousel img{width:100%;height:100%;object-fit:contain;display:block}
  .cnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:20px;cursor:pointer}
  .cnav.prev{left:10px}.cnav.next{right:10px}
  .cidx{position:absolute;bottom:10px;right:14px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:3px 9px;border-radius:20px}
  .ccat{position:absolute;bottom:10px;left:14px;display:flex;gap:5px;flex-wrap:wrap}
  .ccat span{background:rgba(0,0,0,.6);color:#cfe;font-size:10.5px;padding:2px 7px;border-radius:10px}
  .catfilter{display:flex;gap:6px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--line)}
  .catfilter button{background:var(--panel2);border:1px solid var(--line);color:var(--muted);font-size:11.5px;padding:4px 9px;border-radius:14px;cursor:pointer}
  .catfilter button.on{background:var(--accent);color:#0a0e1a;border-color:var(--accent);font-weight:700}
  .detail{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:20px}
  .detail h2{margin:0 0 2px;font-size:21px}
  .dmeta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .barrow{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:12.5px}
  .barlbl{width:120px;color:var(--muted);flex-shrink:0}
  .bartrack{flex:1;height:9px;background:var(--panel2);border-radius:6px;overflow:hidden}
  .barfill{height:100%;border-radius:6px}
  .barval{width:34px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums}
  .fin{background:var(--panel2);border-radius:12px;padding:12px 14px;font-size:13px}
  .fin div{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed var(--line)}
  .fin div:last-child{border:none}
  .verdict{font-size:12.5px;padding:9px 12px;border-radius:10px;margin-top:10px}
  .verdict.feasible{background:rgba(62,207,142,.13);border:1px solid var(--good)}
  .verdict.not-feasible{background:rgba(224,102,107,.12);border:1px solid var(--bad)}
  .verdict.unknown,.verdict.conditional{background:rgba(231,185,79,.12);border:1px solid var(--mid)}
  .close{position:absolute;top:14px;right:16px;z-index:5;background:rgba(0,0,0,.55);color:#fff;border:none;width:34px;height:34px;border-radius:50%;font-size:18px;cursor:pointer}
  .dactions{grid-column:1/-1;display:flex;gap:10px}
  .dactions .btn{flex:1;padding:11px;font-size:13.5px}
  .dqnote{margin-top:auto;padding-top:8px;font-size:12px;color:var(--bad);line-height:1.35}
  .empty{color:var(--muted);text-align:center;padding:60px 20px}
  @media(max-width:680px){.detail{grid-template-columns:1fr}.grid{padding:12px;gap:12px}}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--txt);padding:10px 16px;border-radius:10px;font-size:13px;z-index:90;opacity:0;transition:.2s;pointer-events:none}
  .toast.show{opacity:1}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div>
      <h1><span class="moon">🌙</span> House Search <span class="sub" id="count"></span></h1>
      <div class="sub" id="gen"></div>
    </div>
    <div class="controls">
      <input type="search" id="q" placeholder="Search address / hood…">
      <select id="fcat"><option value="">All categories</option></select>
      <select id="fpipe">
        <option value="candidates">Candidates (hide fails)</option>
        <option value="scored">Scored only</option>
        <option value="longshot">Long shots</option>
        <option value="">Everything</option>
        <option value="active">Active</option>
        <option value="shortlist">Shortlisted</option>
        <option value="rejected">Rejected</option>
        <option value="disqualified">Disqualified (fails)</option>
      </select>
      <select id="sort">
        <option value="score">Sort: Score ↓</option>
        <option value="price_asc">Price ↑</option>
        <option value="price_desc">Price ↓</option>
      </select>
    </div>
  </div>
</header>

<div class="grid" id="grid"></div>
<div class="empty" id="empty" style="display:none">No matches.</div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
const PIPE_ENDPOINT = ""; // set when erebus ships the write-back endpoint; until then, localStorage only
let DATA=null, FILTERED=[], CUR=null, CIDX=0, CFILTER=null;

const $=s=>document.querySelector(s);
const money=v=> v==null?"—":"$"+Number(v).toLocaleString();
function rentOf(p){ const pr=p.projected_rent||{}; const v=pr.monthly??p.est_rent; return v==null?null:{v,proj:pr.monthly!=null}; }
function scoreColor(t){ if(t==null) return "#5b6172"; if(t>=70) return "#3ecf8e"; if(t>=55) return "#a9d65a"; if(t>=40) return "#e7b94f"; return "#e0666b"; }
function localPipe(){ try{return JSON.parse(localStorage.getItem("nyx_pipe")||"{}")}catch{return {}} }
function setLocalPipe(id,v){ const p=localPipe(); if(v) p[id]=v; else delete p[id]; localStorage.setItem("nyx_pipe",JSON.stringify(p)); }
function pipeOf(p){ const l=localPipe(); return l[p.id]||p.pipeline||"active"; }

function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); }

async function load(){
  const r=await fetch("viewer-data.json?_="+Date.now());
  DATA=await r.json();
  const nDq=DATA.properties.filter(p=>p.disqualified).length;
  const nLs=DATA.properties.filter(p=>p.longshot).length;
  const nScored=DATA.count-nDq-nLs;
  $("#count").textContent="· "+nScored+" scored · "+nLs+" long shots · "+nDq+" fails";
  $("#gen").textContent="updated "+(DATA.generated_at||"").replace("T"," ");
  const cats=[...new Set(DATA.properties.map(p=>p.category).filter(Boolean))].sort();
  for(const c of cats){ const o=document.createElement("option"); o.value=c;o.textContent=c; $("#fcat").appendChild(o); }
  ["q","fcat","fpipe","sort"].forEach(id=>$("#"+id).addEventListener("input",render));
  render();
}

function render(){
  const q=$("#q").value.toLowerCase().trim(), fc=$("#fcat").value, fp=$("#fpipe").value, sort=$("#sort").value;
  let arr=DATA.properties.filter(p=>{
    if(fc && p.category!==fc) return false;
    if(fp==="candidates"){ if(p.disqualified) return false; }
    else if(fp==="scored"){ if(p.disqualified||p.longshot) return false; }
    else if(fp==="longshot"){ if(!p.longshot) return false; }
    else if(fp==="disqualified"){ if(!p.disqualified) return false; }
    else if(fp){ if(p.disqualified) return false; if(pipeOf(p)!==fp) return false; }
    if(q && !((p.address||"").toLowerCase().includes(q)||(p.neighborhood||"").toLowerCase().includes(q))) return false;
    return true;
  });
  if(sort==="price_asc") arr.sort((a,b)=>(a.price??1e15)-(b.price??1e15));
  else if(sort==="price_desc") arr.sort((a,b)=>(b.price??-1)-(a.price??-1));
  else arr.sort((a,b)=>((b.score_total??-1)-(a.score_total??-1)));
  FILTERED=arr;
  const g=$("#grid"); g.innerHTML="";
  $("#empty").style.display=arr.length?"none":"block";
  for(const p of arr) g.appendChild(card(p));
}

function card(p){
  const el=document.createElement("div"); el.className="card"+(p.disqualified?" dq":"");
  const pipe=pipeOf(p);
  const t=p.score_total;
  const badge = p.disqualified
    ? `<div class="badge fail" title="${(p.fail_reason||'Objectively non-viable').replace(/"/g,'&quot;')}">✕ FAIL</div>`
    : p.longshot
    ? `<div class="badge longshot" title="${(p.longshot_reason||'Long shot').replace(/"/g,'&quot;')}">★ long shot</div>`
    : `<div class="badge" style="background:${scoreColor(t)}" title="score out of 80">${t==null?"—":t+'<span style="font-size:9px;opacity:.7">/80</span>'}</div>`;
  const photos=p.photos||[];
  const np=photos.length;
  el.innerHTML=`
    <div class="photo">
      ${np?`<img class="cphoto" loading="lazy" src="${photos[0].url}" onerror="this.style.visibility='hidden'">`:""}
      <div class="nophoto" style="display:${np?'none':'flex'}">📷 photos syncing…</div>
      ${np>1?`<button class="cardnav prev" data-d="-1">‹</button><button class="cardnav next" data-d="1">›</button>
        <div class="dots">${photos.map((_,i)=>`<i class="${i===0?'on':''}"></i>`).join("")}</div>
        <div class="pcount">1/${np}</div>`:""}
      ${badge}
      <div class="pillrow">
        ${!p.disqualified&&pipe==="shortlist"?'<span class="pill shortlist">★ shortlist</span>':""}
        ${!p.disqualified&&pipe==="rejected"?'<span class="pill rejected">✕ rejected</span>':""}
        ${p.red_flags?`<span class="pill" style="background:#a33">⚑ ${p.red_flags}</span>`:""}
      </div>
    </div>
    <div class="body">
      <div class="addr">${p.address||"—"}</div>
      <div class="hood">${p.neighborhood||""} ${p.category?`· <span class="cat">${p.category}</span>`:""}</div>
      <div class="stats">
        ${(()=>{const r=rentOf(p);return r?`<span class="price">${money(r.v)}<span class="permo">/mo${r.proj?"":" est"}</span></span>`:`<span class="price">${money(p.price)}</span>`;})()}
        ${p.beds?`<span><b>${p.beds}</b> bd</span>`:""}
        ${p.baths?`<span><b>${p.baths}</b> ba</span>`:""}
        ${p.sqft?`<span><b>${Number(p.sqft).toLocaleString()}</b> sf</span>`:""}
      </div>
      ${rentOf(p)?`<div class="subprice">list ${money(p.price)}</div>`:""}
      ${p.disqualified
        ? `<div class="dqnote">✕ ${(p.fail_reason||'Objectively non-viable')}</div>`
        : `${p.longshot?`<div class="lsnote">★ ${p.longshot_reason||'Long shot'}</div>`:""}
          <div class="actions">
            <button class="btn short ${pipe==='shortlist'?'on':''}" data-act="shortlist">★ Shortlist</button>
            <button class="btn rej ${pipe==='rejected'?'on':''}" data-act="rejected">✕ Reject</button>
          </div>`}
    </div>`;
  // --- card photo carousel (arrows + swipe + dots) ---
  const photoEl=el.querySelector(".photo");
  let ci=0;
  const imgEl=photoEl.querySelector(".cphoto");
  const dotEls=photoEl.querySelectorAll(".dots i");
  const countEl=photoEl.querySelector(".pcount");
  function show(i){
    if(np<2) return;
    ci=(i+np)%np;
    imgEl.style.visibility="visible";
    imgEl.src=photos[ci].url;
    dotEls.forEach((d,k)=>d.classList.toggle("on",k===ci));
    if(countEl) countEl.textContent=(ci+1)+"/"+np;
  }
  photoEl.querySelectorAll(".cardnav").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); show(ci+Number(b.dataset.d));
  }));
  // touch + mouse swipe
  let sx=null, sy=null, swiped=false;
  const down=x=>{ sx=x; swiped=false; };
  const move=(x,y,dy)=>{ if(sx==null) return; if(Math.abs(x-sx)>10) swiped=true; };
  const up=x=>{ if(sx==null) return; const dx=x-sx; if(Math.abs(dx)>35){ show(ci+(dx<0?1:-1)); } sx=null; };
  photoEl.addEventListener("touchstart",e=>down(e.touches[0].clientX),{passive:true});
  photoEl.addEventListener("touchmove",e=>{ if(sx!=null&&Math.abs(e.touches[0].clientX-sx)>10) swiped=true; },{passive:true});
  photoEl.addEventListener("touchend",e=>up((e.changedTouches[0]||{}).clientX??sx));
  photoEl.addEventListener("mousedown",e=>down(e.clientX));
  photoEl.addEventListener("mouseup",e=>up(e.clientX));
  photoEl.addEventListener("mouseleave",()=>{ sx=null; });
  photoEl.addEventListener("click",e=>{ if(!swiped) openDetail(p, ci); });
  el.querySelector(".body .addr").addEventListener("click",()=>openDetail(p, ci));
  el.querySelectorAll(".actions .btn").forEach(b=>b.addEventListener("click",e=>{
    e.stopPropagation(); togglePipe(p, b.dataset.act);
  }));
  return el;
}

async function togglePipe(p, act){
  const cur=pipeOf(p);
  const next = cur===act ? "active" : act;
  setLocalPipe(p.id, next==="active"?null:next);
  toast(next==="active"?`${p.address}: cleared`:`${p.address}: ${next}`);
  render();
  if(CUR && CUR.id===p.id) openDetail(p, CIDX); // refresh modal buttons, keep photo position
  // write-back (best-effort; no-op until endpoint configured)
  if(PIPE_ENDPOINT){
    try{ await fetch(PIPE_ENDPOINT,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({listing_id:p.id,action:next})}); }catch(e){}
  }
}

function openDetail(p, startIdx){
  CUR=p; CIDX=startIdx||0; CFILTER=null;
  const photos=p.photos||[];
  const allCats=[...new Set(photos.flatMap(ph=>ph.categories||[]))].sort();
  const pipe=pipeOf(p);
  const bars=(p.score_breakdown||[]).map(b=>{
    const pct=Math.max(2,Math.round(100*b.value/b.max));
    const col=scoreColor(Math.round(100*b.value/b.max*0.7+15));
    return `<div class="barrow"><div class="barlbl">${b.label}</div><div class="bartrack"><div class="barfill" style="width:${pct}%;background:${col}"></div></div><div class="barval">${b.value}/${b.max}</div></div>`;
  }).join("");
  const pr=p.projected_rent||{}, fe=p.feasibility||{};
  const sheet=$("#sheet");
  sheet.innerHTML=`
    <button class="close" onclick="closeModal()">✕</button>
    <div class="carousel" id="carousel">
      ${photos.length?`<img id="cimg" src="${photos[0].url}">
        <button class="cnav prev" onclick="cmove(-1)">‹</button>
        <button class="cnav next" onclick="cmove(1)">›</button>
        <div class="cidx" id="cidx"></div>
        <div class="ccat" id="ccat"></div>`
      :`<div class="nophoto" style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#9aa3b2">📷 photos syncing — check back shortly</div>`}
    </div>
    ${allCats.length?`<div class="catfilter" id="catfilter">
      <button class="on" data-c="">All (${photos.length})</button>
      ${allCats.map(c=>`<button data-c="${c}">${c.replace(/_/g,' ')}</button>`).join("")}
    </div>`:""}
    <div class="detail">
      <div>
        <h2>${p.address||"—"}</h2>
        <div class="dmeta">${p.neighborhood||""} ${p.category?"· "+p.category:""} ${p.zpid?`· <a href="https://www.zillow.com/homedetails/${p.zpid}_zpid/" target="_blank">Zillow ↗</a>`:""}</div>
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:8px">
          ${p.disqualified
            ? `<div class="badge fail" style="position:static">✕ FAIL</div>`
            : p.longshot
            ? `<div class="badge longshot" style="position:static">★ long shot</div>`
            : `<div class="badge" style="position:static;background:${scoreColor(p.score_total)}">${p.score_total==null?"—":p.score_total+'<span style="font-size:9px;opacity:.7">/80</span>'}</div>`}
          <div style="font-size:13px;color:#9aa3b2">${p.disqualified?"objectively non-viable":p.longshot?"long shot · not yet scored":"overall score"+(p.score_confidence?` · confidence ${p.score_confidence}/5`:"")}</div>
        </div>
        ${p.disqualified?`<div class="verdict not-feasible"><b>Why FAIL:</b> ${p.fail_reason||'Objectively non-viable.'}</div>`
          :p.longshot?`<div class="verdict conditional"><b>★ Long shot:</b> ${p.longshot_reason||'Big but worth a look.'}</div>`
          :(bars||'<div class="sub">No score breakdown.</div>')}
        ${p.notes?`<div class="dmeta" style="margin-top:10px">📝 ${p.notes}</div>`:""}
      </div>
      <div>
        <div class="fin">
          <div><span>List price</span><b>${money(p.price)}</b></div>
          ${pr.monthly?`<div><span>Projected rent/mo</span><b>${money(pr.monthly)}</b></div>`:(p.est_rent?`<div><span>Est rent/mo</span><b>${money(p.est_rent)}</b></div>`:"")}
          ${pr.per_person?`<div><span>Per person/mo</span><b>${money(pr.per_person)}</b></div>`:(p.rent_per_person?`<div><span>Per person/mo</span><b>${money(p.rent_per_person)}</b></div>`:"")}
          ${pr.dollars_per_sqft?`<div><span>$/sqft</span><b>$${pr.dollars_per_sqft}</b></div>`:""}
          ${pr.headcount?`<div><span>Headcount</span><b>${pr.headcount}</b></div>`:""}
          ${p.sqft?`<div><span>Sqft</span><b>${Number(p.sqft).toLocaleString()}</b></div>`:""}
        </div>
        ${fe.verdict?`<div class="verdict ${fe.verdict}"><b>Move-in: ${fe.verdict}</b><br>${(fe.rationale||"").slice(0,420)}${(fe.rationale||"").length>420?"…":""}</div>`:""}
      </div>
      ${p.disqualified?"":`<div class="dactions">
        <button class="btn short ${pipe==='shortlist'?'on':''}" onclick="togglePipe(CUR,'shortlist')">★ Shortlist</button>
        <button class="btn rej ${pipe==='rejected'?'on':''}" onclick="togglePipe(CUR,'rejected')">✕ Reject</button>
      </div>`}
    </div>`;
  $("#modal").classList.add("open");
  if(photos.length) updateCarousel();
  // modal carousel touch-swipe
  const car=$("#carousel");
  if(car){
    let mx=null;
    car.addEventListener("touchstart",e=>{ mx=e.touches[0].clientX; },{passive:true});
    car.addEventListener("touchend",e=>{ if(mx==null)return; const dx=(e.changedTouches[0]||{}).clientX-mx; if(Math.abs(dx)>35) cmove(dx<0?1:-1); mx=null; });
  }
  const cf=$("#catfilter");
  if(cf) cf.querySelectorAll("button").forEach(b=>b.addEventListener("click",()=>{
    cf.querySelectorAll("button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    CFILTER=b.dataset.c||null; CIDX=0; updateCarousel();
  }));
}
function curPhotos(){ const ph=(CUR.photos||[]); return CFILTER?ph.filter(x=>(x.categories||[]).includes(CFILTER)):ph; }
function updateCarousel(){
  const ph=curPhotos(); if(!ph.length) return;
  CIDX=(CIDX+ph.length)%ph.length;
  $("#cimg").src=ph[CIDX].url;
  $("#cidx").textContent=`${CIDX+1} / ${ph.length}`;
  $("#ccat").innerHTML=(ph[CIDX].categories||[]).map(c=>`<span>${c.replace(/_/g,' ')}</span>`).join("");
}
function cmove(d){ CIDX+=d; updateCarousel(); }
function closeModal(){ $("#modal").classList.remove("open"); CUR=null; }
$("#modal").addEventListener("click",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown",e=>{ if(!CUR)return; if(e.key==="Escape")closeModal(); if(e.key==="ArrowLeft")cmove(-1); if(e.key==="ArrowRight")cmove(1); });

load();
</script>
</body>
</html>
