<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinue — Tak puzzles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='2' y='2' width='12' height='12' rx='2' fill='%23b58863'/><circle cx='8' cy='8' r='3.5' fill='%23f4efe6'/></svg>">
<link rel="stylesheet" href="style.css?v=1794090060">
<meta name="googlebot" content="noindex"><meta name="bingbot" content="noindex">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">tinue<span>.</span></a>
  <nav>
    <a href="#/" data-nav>Puzzles</a>
    <a href="#/glossary" data-nav>Glossary</a>
    <a href="#/me" data-nav>History</a>
    <a href="#/leaderboard" data-nav>Leaderboard</a>
  </nav>
  <div id="userbox" class="userbox"></div>
</header>

<main id="view-puzzle" class="puzzle-page">
  <section class="board-col">
    <div class="board-wrap" id="board-wrap">
      <div class="skeleton-board" aria-hidden="true"><div class="sk-sq"></div><div class="sk-tray"></div></div>
      <iframe id="ninja" class="ninja" title="Tak board" allow="clipboard-write"></iframe>
    </div>
  </section>

  <aside class="side">
    <div class="panel feedback" id="feedback"><div class="sk-circle"></div><div class="body"><span class="sk w40"></span><span class="sk w60"></span></div><div class="actions"><span class="sk btn"></span><span class="sk btn"></span></div></div>
    <div class="panel session" id="session"><span class="sk w40"></span><span class="sk w60"></span></div>
    <div class="panel moves" id="moves"><span class="sk w80"></span><span class="sk w60"></span></div>
    <div class="panel puzzle-info hidden" id="info"></div>
    <div class="panel controls">
      <label class="field"><span>Theme <a href="#/glossary" class="help" title="What do the themes mean?" aria-label="What do the themes mean?">?</a></span>
        <select id="theme"><option value="">Mix (everything)</option></select>
      </label>
      <p class="theme-desc" id="theme-desc">A mix of everything.</p>
      <div class="row">
        <label class="field"><span>Difficulty</span>
          <select id="difficulty">
            <option value="easiest">Easiest</option><option value="easier">Easier</option>
            <option value="normal" selected>Normal</option>
            <option value="harder">Harder</option><option value="hardest">Hardest</option>
          </select>
        </label>
        <label class="field"><span>Board</span>
          <select id="size"><option value="5">5×5</option></select>
        </label>
      </div>
    </div>
  </aside>
</main>

<main id="view-glossary" class="page hidden"></main>
<main id="view-me" class="page hidden"></main>
<main id="view-leaderboard" class="page hidden"></main>

<script src="config.js?v=1794090060"></script>
<script type="module" src="app.js?v=1794090060"></script>
</body>
</html>
