<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tinue — Tak puzzles</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><rect x='3' y='15' width='18' height='6' rx='2' fill='%23b58863'/><rect x='3' y='10.5' width='18' height='6' rx='2' fill='%232f2c29' stroke='%239a948c'/><circle cx='12' cy='6.5' r='4.5' fill='%23f6f1e7' stroke='%238f8473'/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="board.css?v=1794092723">
<link rel="stylesheet" href="style.css?v=1794092723">
<meta name="googlebot" content="noindex"><meta name="bingbot" content="noindex">
</head>
<body>
<header class="top">
  <a class="brand" href="#/" aria-label="tinue home"><svg class="logo" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="15" width="18" height="6" rx="2" fill="#b58863"/><rect x="3" y="10.5" width="18" height="6" rx="2" fill="#2f2c29" stroke="#9a948c" stroke-width="1"/><circle cx="12" cy="6.5" r="4.5" fill="#f6f1e7" stroke="#8f8473" stroke-width="1"/></svg><span>tinue</span></a>
  <nav>
    <a href="#/" data-nav>Puzzles</a>
    <a href="#/glossary" data-nav>Glossary</a>
    <a href="#/me" data-nav>History</a>
    <a href="#/leaderboard" data-nav>Leaderboard</a>
  </nav>
  <div id="userbox" class="userbox"></div>
</header>

<main id="view-puzzle" class="puzzle-page">
  <section class="board-col">
    <div class="board-wrap" id="board-wrap"><div id="ninja" class="board-host"></div></div>
  </section>

  <aside class="side">
    <div class="panel feedback" id="feedback"><div class="sk-circle"></div><div class="body"><span class="sk w40"></span><span class="sk w60"></span></div><div class="actions"><span class="sk btn"></span><span class="sk btn"></span></div></div>
    <div class="panel session" id="session"><span class="sk w40"></span><span class="sk w60"></span></div>
    <div class="panel moves" id="moves"><span class="sk w80"></span><span class="sk w60"></span></div>
    <div class="panel puzzle-info hidden" id="info"></div>
    <div class="panel controls">
      <label class="field"><span>Theme <a href="#/glossary" class="help" title="What do the themes mean?" aria-label="What do the themes mean?">?</a></span>
        <select id="theme"><option value="">Mix (everything)</option></select>
      </label>
      <p class="theme-desc" id="theme-desc">A mix of everything.</p>
      <div class="row">
        <label class="field"><span>Difficulty</span>
          <select id="difficulty">
            <option value="easiest">Easiest (−600)</option><option value="easier">Easier (−300)</option>
            <option value="normal" selected>Normal</option>
            <option value="harder">Harder (+300)</option><option value="hardest">Hardest (+600)</option>
          </select>
        </label>
        <label class="field"><span>Board</span>
          <select id="size"><option value="5">5×5</option></select>
        </label>
      </div>
    </div>
  </aside>
</main>

<main id="view-glossary" class="page hidden"></main>
<main id="view-me" class="page hidden"></main>
<main id="view-leaderboard" class="page hidden"></main>

<script src="config.js?v=1794092723"></script>
<script type="module" src="app.js?v=1794092723"></script>
</body>
</html>
