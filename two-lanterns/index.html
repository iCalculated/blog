    if (A.net) { pn.hidden = false; const st = A.netStatus; pn.textContent = st === 'open' ? 'connected' : st === 'reconnecting' ? 'reconnecting…' : st === 'connecting' ? 'connecting…' : st; pn.className = 'pill net ' + (st === 'open' ? 'open' : st === 'connecting' || st === 'idle' ? '' : 'bad'); }
    else if (A.solo) { pn.hidden = false; pn.textContent = 'practice'; pn.className = 'pill net'; } else pn.hidden = true;
  }
  function renderLeft() {
    const s = A.state, k = myKeeper(); const L = $('#left'); L.innerHTML = '';
    const head = h('div', 'keeper-head ' + A.role); head.innerHTML = `<div class="portrait">${sprite(A.role + (k.frosted ? '_frosted' : ''))}</div><div><div class="name">${esc(A.names[A.role] || KNAME[A.role])}</div><div class="sub">${KNAME[A.role]} · ${KSUB[A.role]} · you</div></div>`;
    L.appendChild(head);
    const acting = s.phase === 'act';
    const st = h('div', 'stat-row');
    st.innerHTML = `<span class="chip ${!k.moved && acting ? 'on' : ''}">move ${k.moved ? 'used' : 'ready · ' + TL.keeperSpeed(s, k)}</span><span class="chip ${k.played < s.config.cardsPerHour && acting ? 'on' : ''}">cards ${s.config.cardsPerHour - k.played} left</span>${k.done ? '<span class="chip done">done ✓</span>' : ''}${k.frosted ? '<span class="chip frosted">frosted</span>' : ''}`;
    L.appendChild(st);
    const act = h('div', 'actions');
    const bMove = h('button', 'btn ghost move' + (A.ui.sel && A.ui.sel.kind === 'move' ? ' on' : ''), 'Move'); bMove.disabled = !canAct() || k.moved; bMove.onclick = selectMove; bMove.title = 'M';
    const bDone = h('button', 'btn done', A.ui.pendingSeq ? '…' : 'Done'); bDone.id = 'btnDone'; bDone.disabled = !canAct(); bDone.title = 'D';
    const nothingLeft = k.moved && k.played >= s.config.cardsPerHour;
    const nothingUseful = k.played >= s.config.cardsPerHour || k.hand.every(cid => !TL.cardTargets(s, k, cid).length);
    if (canAct() && (nothingLeft || (k.moved && nothingUseful))) bDone.classList.add('pulse');
    bDone.onclick = () => { if (!canAct()) return; cancelSel(); propose({ k: 'done', keeper: A.role }); };
    act.append(bMove, bDone); L.appendChild(act);
    L.appendChild(h('div', 'section-title', 'hand'));
    const hand = h('div', 'hand');
    k.hand.forEach((cid, i) => {
      const c = TL.CARDS[cid]; const ok = acting && k.played < s.config.cardsPerHour && TL.cardTargets(s, k, cid).length > 0;
      const el = h('div', 'card ' + c.keeper + (ok && canAct() ? '' : ' disabled') + (A.ui.sel && A.ui.sel.kind === 'card' && A.ui.sel.hand === i ? ' selected' : ''));
      el.innerHTML = `<div class="title"><span>${esc(c.name)}</span><span class="tag">${c.exhaust ? 'exhaust · ' : ''}${i + 1}</span></div><div class="text">${esc(c.text)}</div>`;
      el.onclick = () => selectCard(i); hand.appendChild(el);
    });
    if (!k.hand.length) hand.appendChild(h('div', 'hint', 'No cards in hand.'));
    L.appendChild(hand);
    L.appendChild(h('div', 'deckline', `<span>draw ${k.deck.length}</span><span>discard ${k.discard.length}</span><span>exhausted ${k.exhausted.length}</span>`));
    if (s.charms.length) {
      L.appendChild(h('div', 'section-title', 'charms'));
      const ch = h('div', 'charms'); for (const c of s.charms) ch.appendChild(h('div', 'charm', `<b>${TL.CHARMS[c].name}</b> · ${esc(TL.CHARMS[c].text)}`)); L.appendChild(ch);
    }
  }
  function renderRight() {
    const s = A.state, them = otherRole(A.role), k = s.keepers[them]; const R = $('#right'); R.innerHTML = '';
    const head = h('div', 'keeper-head ' + them); head.innerHTML = `<div class="portrait">${sprite(them + (k.frosted ? '_frosted' : ''))}</div><div><div class="name">${esc(A.names[them] || KNAME[them])}</div><div class="sub">${KNAME[them]} · ${KSUB[them]} · partner</div></div>`;
    R.appendChild(head);
    const st = h('div', 'stat-row');
    st.innerHTML = `<span class="chip ${!k.moved ? 'on' : ''}">move ${k.moved ? 'used' : 'ready'}</span><span class="chip ${k.played < s.config.cardsPerHour ? 'on' : ''}">cards ${s.config.cardsPerHour - k.played} left</span>${k.done ? '<span class="chip done">done ✓</span>' : (s.phase === 'act' ? '<span class="chip">thinking…</span>' : '')}${k.frosted ? '<span class="chip frosted">frosted</span>' : ''}`;
    R.appendChild(st);
    R.appendChild(h('div', 'section-title', 'hand'));
    R.appendChild(h('div', 'talk', `<b>${k.hand.length} card${k.hand.length === 1 ? '' : 's'}</b> you can't see. Ask what they can do; tell them what you can.`));
    if (s.spawns.length && s.phase === 'act') {
      R.appendChild(h('div', 'section-title', 'arriving at dusk'));
      const sl = h('div', 'spawnlist');
      for (const sp of s.spawns) sl.appendChild(h('div', 'sp', `${sprite(sp.type)} ${TL.WISP_TYPES[sp.type].name} at <b>${TL.coordName(sp.x, sp.y)}</b>`));
      R.appendChild(sl);
    }
    R.appendChild(h('div', 'section-title', 'the night so far'));
    const lg = h('div', 'log');
    const entries = s.log.slice(-60).reverse();
    for (const e of entries) lg.appendChild(h('div', e.cls || '', `<span style="color:var(--muted)">${e.night ? 'n' + e.night + 'h' + e.hour : ''}</span> ${esc(e.text)}`));
    R.appendChild(lg);
  }
  function renderHint() {
    const s = A.state; if (!s) return;
    if (A.ui.busy) return hint('');
    if (s.phase !== 'act') return hint('');
    if (A.ui.pendingSeq) return hint('Sending…');
    const k = myKeeper(), o = s.keepers[otherRole(A.role)];
    if (A.ui.sel) { if (A.ui.sel.kind === 'move') return hint(`Click a tile to move <b>${KNAME[A.role]}</b>. Esc to cancel.`); return hint(targetHint(TL.CARDS[A.ui.sel.card]) + ' Esc to cancel.'); }
    if (k.done && !o.done) return hint(`Waiting for <b>${esc(A.names[otherRole(A.role)] || KNAME[otherRole(A.role)])}</b> to finish the hour.`);
    if (k.done) return hint('');
    const parts = [];
    if (!k.moved) parts.push('move'); if (k.played < s.config.cardsPerHour) parts.push(`play ${s.config.cardsPerHour - k.played} card${s.config.cardsPerHour - k.played > 1 ? 's' : ''}`);
    hint(parts.length ? `You can ${parts.join(' and ')}. Shift-click a tile to point at it.` : 'Nothing left this hour. Press <b>Done</b> when you are happy.');
  }
  function maybeShowHourBanner() {
    const s = A.state; if (!s) return;
    if (s.phase === 'act') {
      const key = s.night + ':' + s.hour;
      if (A.ui.lastHourShown !== key) { A.ui.lastHourShown = key; if (s.hour === 1) banner(`Night ${s.night}<small>${s.night === 1 ? 'The Chills come from the hedge. Keep the blooms alive until dawn.' : s.night === s.config.nights ? 'The last night. Hold on.' : 'Six hours until dawn.'}</small>`, 2000); else banner(`Hour ${s.hour}<small>${s.config.hours - s.hour} more until dawn</small>`, 900); }
    }
  }

  // ---------- modals ----------
  function renderModal() {
    const s = A.state; const M = $('#modal'), C = $('#modalCard');
    if (A.ui.helpOpen) { M.hidden = false; C.innerHTML = helpHtml(); const b = h('button', 'btn', 'Got it'); b.onclick = () => { A.ui.helpOpen = false; renderModal(); }; const act = h('div', 'modal-actions'); act.appendChild(b); C.appendChild(act); return; }
    if (!s) { M.hidden = true; return; }
    if (s.phase === 'draft') { M.hidden = false; renderDraft(C); return; }
    if (s.phase === 'won' || s.phase === 'lost') { M.hidden = false; renderEnd(C); return; }
    M.hidden = true;
  }
  function renderDraft(C) {
    const s = A.state, d = s.draft; C.innerHTML = '';
    C.appendChild(h('h2', '', `Dawn after night ${s.night}`));
    C.appendChild(h('p', 'sub', `${s.lastBlooms} bloom${s.lastBlooms === 1 ? '' : 's'} lit the garden. Glow ${s.glow}, Warmth ${s.warmth}. ${d.carry ? `${d.carry} seed${d.carry > 1 ? 's' : ''} carry to the next garden.` : 'No seeds carry over.'} Each keeper may learn one card, or skip to keep the deck lean. Offers are public: plan together.`));
    const grid = h('div', 'draft');
    for (const id of TL.KEEPER_IDS) {
      const col = h('div', 'col ' + id); col.appendChild(h('h3', '', `${esc(A.names[id] || KNAME[id])} · ${KNAME[id]}${id === A.role ? ' (you)' : ''}`));
      const offers = h('div', 'offers');
      const mine = id === A.role; const pick = d.picks[id];
      d.offers[id].forEach((cid, i) => {
        const c = TL.CARDS[cid]; const el = h('div', 'card ' + id + (pick === i ? ' picked' : pick !== null && pick !== i ? ' dim' : '') + (mine && pick === null ? '' : ' partner'));
        el.innerHTML = `<div class="title"><span>${esc(c.name)}</span><span class="tag">${c.exhaust ? 'exhaust' : ''}</span></div><div class="text">${esc(c.text)}</div>`;
        if (mine && pick === null) el.onclick = () => propose({ k: 'pick', keeper: id, index: i });
        offers.appendChild(el);
      });
      const skip = h('button', 'btn small ghost', pick === -1 ? 'Skipped' : 'Skip');
      if (mine && pick === null) skip.onclick = () => propose({ k: 'pick', keeper: id, index: -1 }); else skip.disabled = true;
      if (pick === null && !mine) offers.appendChild(h('div', 'hint', 'choosing…'));
      offers.appendChild(skip);
      col.appendChild(offers); grid.appendChild(col);
    }
    C.appendChild(grid);
    if (d.charmOffers) {
      C.appendChild(h('h3', '', 'A charm for the pair').style && h('div', 'section-title', ''));
      C.appendChild(h('p', 'sub', `${s.config.charmThreshold}+ blooms survived, so the keepers found a charm. Either of you can choose.`));
      const co = h('div', 'charm-offers');
      d.charmOffers.forEach((cid, i) => {
        const c = TL.CHARMS[cid]; const el = h('div', 'charm-offer' + (d.charmPick === i ? ' picked' : ''));
        el.innerHTML = `<b>${esc(c.name)}</b><span>${esc(c.text)}</span>`;
        if (d.charmPick === null) el.onclick = () => propose({ k: 'charm', keeper: A.role, index: i });
        co.appendChild(el);
      });
      C.appendChild(co);
    }
    const waiting = [];
    for (const id of TL.KEEPER_IDS) if (d.picks[id] === null) waiting.push(A.names[id] || KNAME[id]);
    if (d.charmOffers && d.charmPick === null) waiting.push('the charm');
    C.appendChild(h('p', 'hint', waiting.length ? 'Waiting for: ' + esc(waiting.join(', ')) : 'Night falls again…'));
  }
  function renderEnd(C) {
    const s = A.state; C.innerHTML = '';
    C.appendChild(h('h2', '', s.phase === 'won' ? 'Dawn of the last night' : 'The garden sleeps'));
    C.appendChild(h('p', 'sub', s.phase === 'won' ? 'You kept the garden alive through five nights. The blooms you saved are your Glow.' : `The last warmth went out on night ${s.night}, hour ${s.hour}. The blooms you saved before then still count.`));
    const sum = h('div', 'summary');
    sum.innerHTML = `<div class="stat"><b>${s.glow}</b><span>glow</span></div><div class="stat"><b>${s.glowByNight.join(' · ') || '0'}</b><span>by night</span></div><div class="stat"><b>${s.warmth}</b><span>warmth left</span></div><div class="stat"><b>${s.charms.length}</b><span>charms</span></div>`;
    C.appendChild(sum);
    const decks = h('div', 'draft');
    for (const id of TL.KEEPER_IDS) { const col = h('div', 'col ' + id); col.appendChild(h('h3', '', `${esc(A.names[id] || KNAME[id])}'s deck`)); col.appendChild(h('p', 'hint', esc(s.keepers[id].collection.map(c => TL.CARDS[c].name).join(', ')))); decks.appendChild(col); }
    C.appendChild(decks);
    const act = h('div', 'modal-actions');
    if (A.isHost || A.solo) { const b = h('button', 'btn big', 'Play again'); b.onclick = () => { const seed = (Math.random() * 0xffffffff) >>> 0; resetGame(seed, baseConfig()); if (A.net) A.net.send({ t: 'reset', seed, config: A.config }); propose({ k: 'start' }); }; act.appendChild(b); }
    else act.appendChild(h('span', 'hint', 'The host can start a new run.'));
    const l = h('button', 'btn ghost', 'Back to lobby'); l.onclick = leaveAll; act.appendChild(l);
    C.appendChild(act);
  }
  function helpHtml() {
    return `<h2>How to play</h2><p class="sub">Two keepers, one garden, six hours a night for five nights. You win by keeping <b>Warmth</b> above zero until the fifth dawn. Your score is <b>Glow</b>: blooms alive at each dawn.</p>
    <div class="help">
      <div><h3>The hour</h3><p>Each hour both keepers act in <b>any order</b>, interleaved however you like: one <b>move</b> and up to <b>two cards</b> each. Press Done when you're finished. Then every Chill does exactly what its intent shows, then dusk: plants beside puddles grow, and marked Chills arrive.</p></div>
      <div><h3>Chills ${sprite('chill')}</h3><p>They come from the hedge and <b>breathe</b> on plants. A frozen bloom costs 1 Warmth; frozen seeds and sprouts cost nothing but time. Every Chill has 1 hp (Hoar has 2). Push one into stone, a plant, a keeper, another Chill, or the edge and it takes 1 and melts. Push it into a puddle and it's <b>soaked</b>: stuck until pushed out, though it still breathes on anything beside it.</p></div>
      <div><h3>Intents and lanterns ${sprite('lantern')}</h3><p>Chills decide at the start of the hour and stick to it. ${sprite('intent_move')} moves that many tiles that way; ${sprite('intent_breathe')} breathes on that side. Push a Chill and it still breathes the same direction from its new tile. You see intents only within <b>your</b> lantern (2 tiles). ${sprite('intent_partner')} means your partner can see it: ask. ${sprite('intent_unknown')} is dark: nobody knows. Chills in the dark are a little fickle.</p></div>
      <div><h3>Growing ${sprite('bloom')}</h3><p>Seed → sprout → bloom. At dusk every plant next to a <b>puddle</b> grows one stage. Gale plants seeds; Rill makes puddles and can hurry growth. Chills walk toward the nearest plant, so a far-off seed is also bait.</p></div>
      <div><h3>Gale ${sprite('gale')}</h3><p>Moves 3. Pushes, sweeps whole lines, scatters seeds, and can calm a Chill for an hour. Plans the angles: a push only kills if something is behind the Chill.</p></div>
      <div><h3>Rill ${sprite('rill')}</h3><p>Moves 2, and stepping into a puddle is free. Makes puddles (growth and traps), sprinkles plants, drains puddles to shiver whoever is soaking, and hops between puddles.</p></div>
      <div><h3>Dusk and dawn</h3><p>Spawn marks ${sprite('spawn_mark')} show where Chills appear at dusk. Standing there only gets you frosted (no move next hour); the Chill squeezes in beside you. At dawn the hearth needs light: <b>night 1 needs 2 blooms, night 2 needs 3, and so on up to 6 on night 5</b>, or Warmth drops by 1. Then each keeper drafts a card or skips; four or more surviving blooms also earn a shared charm, and up to three blooms carry over as seeds.</p></div>
      <div><h3>Talking</h3><p>Talk as much as you like. The one house rule that keeps it interesting: describe what you <b>can</b> do, not your exact cards. Shift-click any tile to point at it on both screens. Keys: 1–3 cards, M move, D done, Esc cancel.</p></div>
    </div>`;
  }
  $('#btnHelp').onclick = () => { A.ui.helpOpen = !A.ui.helpOpen; if (A.mode === 'game') renderModal(); else { $('#modal').hidden = !A.ui.helpOpen; if (A.ui.helpOpen) { $('#modalCard').innerHTML = helpHtml(); const b = h('button', 'btn', 'Got it'); b.onclick = () => { A.ui.helpOpen = false; $('#modal').hidden = true; }; const act = h('div', 'modal-actions'); act.appendChild(b); $('#modalCard').appendChild(act); } } };
  $('#modal').onclick = (e) => { if (e.target === $('#modal') && A.ui.helpOpen) { A.ui.helpOpen = false; if (A.mode === 'game') renderModal(); else $('#modal').hidden = true; } };
  $('#btnLeave').onclick = () => { if (confirm('Leave this game?')) leaveAll(); };

  // ---------- event playback ----------
  function flashEvents(events) {
    for (const e of events) {
      if (e.type === 'die') { const f = fx('float good', e.x, e.y, 'melt'); setTimeout(() => f.remove(), 1000); }
      if (e.type === 'hit' && !events.some(d => d.type === 'die' && d.id === e.id)) { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
      if (e.type === 'bump') { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
      if (e.type === 'calm') { const f = fx('label', e.x, e.y, 'calm'); setTimeout(() => f.remove(), 900); }
      if (e.type === 'freeze') { tileEl(e.x, e.y).classList.add('flash'); setTimeout(() => tileEl(e.x, e.y).classList.remove('flash'), 700); }
      if (e.type === 'puddle' || e.type === 'plant' || e.type === 'grow' || e.type === 'thaw' || e.type === 'drain') { const t = tileEl(e.x, e.y); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
    }
  }
  // Step through the end-of-hour events with a display state so the wisp phase reads as a sequence.
  function playEvents(before, events, done) {
    A.ui.busy = true; clearPreview(); A.ui.sel = null;
    const d = TL.cloneState(before);
    const steps = [];
    const dur = { walk: 260, slide: 220, breathe: 520, die: 380, freeze: 320, grow: 180, plant: 160, spawn: 260, wispPhase: 350, dawn: 900, night: 600, hour: 10, thaw: 150, frostKeeper: 300, soak: 120, warmth: 200 };
    for (const e of events) {
      const ms = dur[e.type] !== undefined ? dur[e.type] : 60;
      steps.push({ e, ms });
    }
    let i = 0;
    const wispOf = (id) => d.wisps.find(w => w.id === id);
    const tick = () => {
      if (i >= steps.length) { A.ui.busy = false; done(); return; }
      const { e, ms } = steps[i++];
      switch (e.type) {
        case 'wispPhase': banner('The Chills stir…', 700); break;
        case 'walk': case 'slide': { const w = wispOf(e.id); if (w) { w.x = e.to[0]; w.y = e.to[1]; } break; }
        case 'soak': { const w = wispOf(e.id); if (w) w.soaked = true; break; }
        case 'breathe': { const x = e.x + TL.DIRS[e.dir][0], y = e.y + TL.DIRS[e.dir][1]; const f = fx('puff', x, y, sprite('intent_breathe')); f.style.transform += ` rotate(${{ N: -90, E: 0, S: 90, W: 180 }[e.dir]}deg)`; setTimeout(() => f.remove(), 700); break; }
        case 'freeze': { const t = d.tiles[e.y * 7 + e.x]; t.plant = 0; if (t.terrain === 'soil') t.terrain = 'frost'; const f = fx('float', e.x, e.y, e.stage === 3 ? 'bloom lost' : 'frozen'); setTimeout(() => f.remove(), 1000); break; }
        case 'wither': { const t = d.tiles[e.y * 7 + e.x]; t.plant = e.to; break; }
        case 'warmth': { const p = $('#pillWarmth'); p.classList.remove('shake'); void p.offsetWidth; p.style.animation = 'shake .4s ease'; setTimeout(() => p.style.animation = '', 450); d.warmth = e.warmth; break; }
        case 'frostKeeper': { d.keepers[e.keeper].frosted = true; const k = d.keepers[e.keeper]; const f = fx('float', k.x, k.y, 'frosted'); setTimeout(() => f.remove(), 1000); break; }
        case 'hit': { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } const w = wispOf(e.id); if (w) w.hp -= e.n; break; }
        case 'die': { d.wisps = d.wisps.filter(w => w.id !== e.id); const f = fx('float good', e.x, e.y, 'melt'); setTimeout(() => f.remove(), 1000); break; }
        case 'frost': { d.tiles[e.y * 7 + e.x].terrain = 'frost'; break; }
        case 'grow': case 'plant': { d.tiles[e.y * 7 + e.x].plant = e.stage; break; }
        case 'thaw': { d.tiles[e.y * 7 + e.x].terrain = 'soil'; break; }
        case 'spawn': { d.wisps.push({ id: e.id, type: e.wtype, hp: TL.WISP_TYPES[e.wtype].hp, x: e.x, y: e.y, soaked: false, intent: { kind: 'none' } }); d.spawns = d.spawns.filter(s => !(s.x === e.x && s.y === e.y)); break; }
        case 'dawn': { const need = TL.dawnNeed(before); banner(`Dawn<small>${e.blooms} bloom${e.blooms === 1 ? '' : 's'} lit the garden${e.blooms < need ? ` · the hearth needed ${need}, Warmth −1` : ''}</small>`, 1600); break; }
        case 'lost': banner('The last warmth is gone', 1200); break;
        case 'won': banner('You made it to dawn', 1400); break;
        case 'hour': { // new hour: snap everything to the real state (intents, hands, spawns) and finish
          A.ui.busy = false; done(); return; }
        case 'night': { A.ui.busy = false; done(); return; }
      }
      renderBoard(d); renderTop();
      setTimeout(tick, ms);
    };
    tick();
  }

  // ---------- boot ----------
  function boot() {
    $('#brandLantern').innerHTML = sprite('lantern');
    $('#heroArt').innerHTML = sprite('gale') + sprite('bloom', 'bloomy') + sprite('rill');
    const u = new URL(location.href);
    const room = u.searchParams.get('room');
    renderLobby();
    if (room) {
      const saved = LS.get('host.' + room.toUpperCase(), null);
      if (saved) { resumeHost(room.toUpperCase()); return; }
      A.lobby.joinCode = room.toUpperCase(); A.lobby.view = 'join'; renderLobby();
      if (A.myName) joinRoom(room);
    }
  }
  boot();
})();
