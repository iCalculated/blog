<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Two Lanterns</title>
<meta name="description" content="A cooperative tactics game for two keepers on two laptops. Keep the glowblooms alive through the longest night.">
<meta name="googlebot" content="noindex"><meta name="bingbot" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root {
  --night: #1b1a33; --night-2: #232247; --night-3: #2b2a52; --ink: #2b2a4a;
  --cream: #f6efdc; --cream-dim: #c9c2b4; --muted: #8f8aa8;
  --amber: #ffb347; --amber-deep: #e58a2a; --gale: #ff9a4a; --rill: #7fd39a; --wisp: #bfe6ff;
  --puddle: #4f8fd6; --frost: #dff3ff; --bad: #ff7a7a; --good: #9be49b;
  --soil: #2f2c52; --soil-2: #34315b; --tile: 72px; --radius: 16px;
  --font-title: 'Fredoka', 'Nunito', system-ui, sans-serif; --font-body: 'Nunito', system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--night); color: var(--cream); font-family: var(--font-body); font-size: 15px; }
body { min-height: 100vh; background:
  radial-gradient(1px 1px at 12% 18%, rgba(255,255,255,.35) 50%, transparent 51%),
  radial-gradient(1px 1px at 80% 12%, rgba(255,255,255,.3) 50%, transparent 51%),
  radial-gradient(1.5px 1.5px at 62% 78%, rgba(255,255,255,.25) 50%, transparent 51%),
  radial-gradient(1px 1px at 35% 92%, rgba(255,255,255,.3) 50%, transparent 51%),
  radial-gradient(1px 1px at 92% 55%, rgba(255,255,255,.3) 50%, transparent 51%),
  radial-gradient(1200px 500px at 50% -10%, #2a2955 0%, var(--night) 65%); }
button { font-family: inherit; }
h1, h2, h3 { font-family: var(--font-title); font-weight: 600; margin: 0; letter-spacing: .2px; }
.sprite { display: block; width: 100%; height: 100%; }
[hidden] { display: none !important; }

/* ---------- top bar ---------- */
#topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 18px; }
.brand { display: flex; align-items: center; gap: 8px; font-family: var(--font-title); font-size: 20px; font-weight: 600; }
.brand-lantern { width: 28px; height: 28px; display: inline-block; }
.status { display: flex; gap: 8px; align-items: center; }
.right { display: flex; gap: 8px; align-items: center; }
.pill { background: var(--night-2); border: 1px solid rgba(255,255,255,.08); border-radius: 999px; padding: 5px 12px; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.pill .ico { width: 16px; height: 16px; display: inline-block; }
.pill.warmth .flames { display: inline-flex; gap: 2px; }
.pill.warmth .flame { width: 14px; height: 14px; opacity: .25; }
.pill.warmth .flame.on { opacity: 1; }
.pill.room { font-family: var(--font-title); letter-spacing: 1px; cursor: pointer; }
.pill.net.open { border-color: rgba(155,228,155,.5); color: var(--good); }
.pill.net.bad { border-color: rgba(255,122,122,.5); color: var(--bad); }
.pill.glow { color: var(--amber); }

.btn { border: 0; border-radius: 12px; padding: 9px 16px; font-weight: 700; font-size: 14px; cursor: pointer; background: var(--amber); color: #2a1a05; transition: transform .08s ease, filter .12s ease, opacity .12s; }
.btn:hover { filter: brightness(1.06); }
.btn:active { transform: translateY(1px) scale(.99); }
.btn:disabled { opacity: .45; cursor: default; filter: none; transform: none; }
.btn.ghost { background: rgba(255,255,255,.06); color: var(--cream); border: 1px solid rgba(255,255,255,.1); }
.btn.ghost:hover { background: rgba(255,255,255,.1); }
.btn.small { padding: 6px 11px; font-size: 13px; }
.btn.big { font-size: 16px; padding: 12px 20px; border-radius: 14px; }
.btn.rill { background: var(--rill); color: #082b16; }
.btn.gale { background: var(--gale); color: #2a1305; }
.btn.danger { background: var(--bad); color: #2a0505; }

/* ---------- lobby ---------- */
#lobby { display: flex; justify-content: center; padding: 20px 16px 60px; }
.lobby-card { width: min(760px, 100%); background: var(--night-2); border: 1px solid rgba(255,255,255,.07); border-radius: 24px; box-shadow: 0 30px 80px rgba(0,0,0,.35); overflow: hidden; }
.lobby-hero { text-align: center; padding: 28px 24px 8px; }
.hero-art { display: flex; justify-content: center; gap: 12px; align-items: flex-end; height: 120px; }
.hero-art .sprite { width: 96px; height: 96px; }
.hero-art .bloomy { width: 72px; height: 72px; margin-bottom: 8px; }
.lobby-hero h1 { font-size: 40px; margin-top: 4px; }
.tagline { color: var(--cream-dim); margin: 6px 0 0; }
.lobby-body { padding: 18px 24px 26px; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.field label { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }
input[type=text] { background: var(--night); border: 1px solid rgba(255,255,255,.12); color: var(--cream); border-radius: 12px; padding: 10px 12px; font-size: 16px; font-family: inherit; outline: none; }
input[type=text]:focus { border-color: var(--amber); }
input.code { font-family: var(--font-title); letter-spacing: 6px; text-transform: uppercase; font-size: 22px; text-align: center; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.row.split { justify-content: space-between; }
.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.choice { background: var(--night); border: 2px solid rgba(255,255,255,.08); border-radius: 18px; padding: 14px; cursor: pointer; text-align: left; color: var(--cream); display: flex; gap: 12px; align-items: center; transition: border-color .12s, transform .08s; }
.choice:hover { transform: translateY(-1px); }
.choice .sprite { width: 64px; height: 64px; flex: 0 0 64px; }
.choice.gale.on { border-color: var(--gale); box-shadow: 0 0 0 3px rgba(255,154,74,.18); }
.choice.rill.on { border-color: var(--rill); box-shadow: 0 0 0 3px rgba(127,211,154,.18); }
.choice.taken { opacity: .55; cursor: default; }
.choice h3 { font-size: 18px; }
.choice p { margin: 2px 0 0; color: var(--cream-dim); font-size: 13px; }
.divider { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 1px; margin: 18px 0; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: rgba(255,255,255,.08); }
.share { display: flex; gap: 8px; align-items: center; background: var(--night); border-radius: 12px; padding: 10px 12px; font-size: 13px; }
.share code { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--cream-dim); }
.code-big { font-family: var(--font-title); font-size: 44px; letter-spacing: 10px; text-align: center; color: var(--amber); margin: 4px 0; }
.lobby-people { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 12px 0; }
.person { background: var(--night); border-radius: 16px; padding: 12px; display: flex; gap: 10px; align-items: center; }
.person .sprite { width: 48px; height: 48px; flex: 0 0 48px; }
.person .who { flex: 1; }
.person .who b { display: block; font-family: var(--font-title); font-weight: 500; font-size: 16px; }
.person .who span { color: var(--muted); font-size: 12px; }
.ready-dot { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.15); }
.ready-dot.on { background: var(--good); box-shadow: 0 0 10px var(--good); }
.hint { color: var(--muted); font-size: 13px; }
.settings { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0 14px; }
.seg { display: inline-flex; background: var(--night); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; color: var(--cream-dim); padding: 6px 12px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: 13px; }
.seg button.on { background: rgba(255,255,255,.1); color: var(--cream); }
.check { display: inline-flex; gap: 8px; align-items: center; font-size: 13px; color: var(--cream-dim); cursor: pointer; }

/* ---------- game layout ---------- */
#game { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; gap: 14px; padding: 0 14px 20px; align-items: start; }
.panel { background: var(--night-2); border: 1px solid rgba(255,255,255,.06); border-radius: var(--radius); padding: 12px; display: flex; flex-direction: column; gap: 10px; min-height: 420px; }
#boardwrap { position: relative; display: flex; flex-direction: column; align-items: center; gap: 8px; }
.boardhint { min-height: 24px; font-size: 14px; color: var(--cream-dim); text-align: center; }
.boardhint b { color: var(--amber); }

#board { position: relative; display: grid; grid-template-columns: 26px repeat(7, var(--tile)); grid-template-rows: 22px repeat(6, var(--tile)); gap: 0; background: var(--night-3); border-radius: 18px; padding: 6px 10px 10px 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.05), 0 30px 60px rgba(0,0,0,.35); user-select: none; }
.coord { display: flex; align-items: center; justify-content: center; font-family: var(--font-title); font-size: 12px; color: var(--muted); }
.tile { position: relative; width: var(--tile); height: var(--tile); border-radius: 12px; background: var(--soil); box-shadow: inset 0 0 0 2px var(--night-3); cursor: default; }
.tile.alt { background: var(--soil-2); }
.tile.edge::after { content: ''; position: absolute; inset: 0; border-radius: 12px; box-shadow: inset 0 0 14px rgba(0,0,0,.35); pointer-events: none; }
.tile .terrain { position: absolute; inset: 0; pointer-events: none; }
.tile.puddle .terrain, .tile.stone .terrain, .tile.frost .terrain { display: block; }
.tile .plant { position: absolute; inset: 8px; pointer-events: none; transition: transform .25s ease; }
.tile .plant.pop { animation: pop .35s ease; }
.tile .spawn { position: absolute; inset: 10px; pointer-events: none; opacity: .9; animation: breathe 2s ease-in-out infinite; }
.tile.lit-mine { box-shadow: inset 0 0 0 2px var(--night-3), inset 0 0 26px rgba(255,179,71,.34); }
.tile.lit-partner { box-shadow: inset 0 0 0 2px var(--night-3), inset 0 0 26px rgba(127,211,154,.28); }
.tile.lit-mine.lit-partner { box-shadow: inset 0 0 0 2px var(--night-3), inset 0 0 22px rgba(255,179,71,.2), inset 0 0 10px rgba(127,211,154,.2); }
.tile.target { cursor: pointer; box-shadow: inset 0 0 0 3px var(--amber); }
.tile.target:hover { box-shadow: inset 0 0 0 3px #fff, 0 0 18px rgba(255,179,71,.6); }
.tile.target.move { box-shadow: inset 0 0 0 3px rgba(255,255,255,.55); }
.tile.target.move:hover { box-shadow: inset 0 0 0 3px #fff, 0 0 18px rgba(255,255,255,.5); }
.tile.threat { box-shadow: inset 0 0 0 3px rgba(191,230,255,.7); }
.tile.threat.lit-mine { box-shadow: inset 0 0 0 3px rgba(191,230,255,.8), inset 0 0 22px rgba(255,179,71,.22); }
.tile.pinged { animation: pingflash 1.6s ease; }
.tile.flash { animation: tileflash .6s ease; }
.tile .dew-tag { position: absolute; right: 4px; bottom: 3px; font-size: 10px; color: #cfe8ff; background: rgba(0,0,0,.35); border-radius: 6px; padding: 0 4px; pointer-events: none; }

#pieces { position: absolute; left: 30px; top: 28px; width: calc(7 * var(--tile)); height: calc(6 * var(--tile)); pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; width: var(--tile); height: var(--tile); transition: transform .28s cubic-bezier(.3,.9,.4,1.1), opacity .3s; pointer-events: none; }
.piece .body { position: absolute; inset: 6px; }
.piece.keeper .body { inset: 4px; }
.piece.wisp.target, .piece.wisp.clickable { pointer-events: auto; cursor: pointer; }
.piece.wisp.target .body { filter: drop-shadow(0 0 6px var(--amber)) drop-shadow(0 0 2px var(--amber)); }
.piece.wisp.target:hover .body { filter: drop-shadow(0 0 8px #fff) drop-shadow(0 0 3px #fff); }
.piece.keeper.clickable { pointer-events: auto; cursor: pointer; }
.piece.keeper.mine .body { filter: drop-shadow(0 0 8px rgba(255,179,71,.55)); }
.piece.keeper.selected .body { filter: drop-shadow(0 0 10px #fff); }
.piece.ghost { opacity: .5; }
.piece.ghost .body { filter: grayscale(.3); }
.piece .hp { position: absolute; right: 4px; top: 2px; display: flex; gap: 2px; }
.piece .hp i { width: 8px; height: 8px; border-radius: 50%; background: var(--wisp); box-shadow: 0 0 4px var(--wisp); display: block; }
.piece .soak { position: absolute; inset: 6px; pointer-events: none; }
.piece .intent { position: absolute; width: 30px; height: 30px; left: 50%; top: 50%; margin: -15px 0 0 -15px; pointer-events: none; filter: drop-shadow(0 1px 2px rgba(0,0,0,.6)); }
.piece .intent.N { transform: translateY(-34px) rotate(-90deg); }
.piece .intent.E { transform: translateX(34px); }
.piece .intent.S { transform: translateY(34px) rotate(90deg); }
.piece .intent.W { transform: translateX(-34px) rotate(180deg); }
.piece .intent.center { transform: translateY(-30px); width: 24px; height: 24px; margin: -12px 0 0 -12px; }
.piece .steps { position: absolute; left: 50%; top: 50%; margin: 18px 0 0 -10px; width: 20px; height: 16px; border-radius: 8px; background: rgba(0,0,0,.55); color: var(--wisp); font-size: 11px; font-weight: 700; text-align: center; line-height: 16px; }
.piece.poof { animation: poof .45s ease forwards; }
.piece.shake { animation: shake .35s ease; }
.piece.spawnin { animation: spawnin .45s ease; }
.arrows { position: absolute; width: var(--tile); height: var(--tile); pointer-events: none; }
.arrow { position: absolute; width: 30px; height: 30px; border-radius: 50%; background: var(--amber); color: #2a1a05; border: 0; cursor: pointer; pointer-events: auto; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 15px; box-shadow: 0 4px 12px rgba(0,0,0,.4); transition: transform .08s; }
.arrow:hover { transform: scale(1.12); background: #fff; }
.arrow:disabled { opacity: .3; cursor: default; transform: none; }
.arrow.N { left: 50%; top: 0; margin: -18px 0 0 -15px; }
.arrow.S { left: 50%; bottom: 0; margin: 0 0 -18px -15px; }
.arrow.W { top: 50%; left: 0; margin: -15px 0 0 -18px; }
.arrow.E { top: 50%; right: 0; margin: -15px -18px 0 0; }
.fx { position: absolute; width: var(--tile); height: var(--tile); pointer-events: none; }
.fx.puff { animation: puff .7s ease forwards; }
.fx.puff .sprite { width: 100%; height: 100%; }
.fx.ping { animation: pingring 1.4s ease-out forwards; }
.fx.melt { font-family: var(--font-title); color: var(--wisp); font-size: 13px; text-align: center; line-height: var(--tile); text-shadow: 0 0 6px #000; }
.fx.label { font-family: var(--font-title); color: #fff; font-size: 12px; text-align: center; line-height: 18px; background: rgba(0,0,0,.6); border-radius: 8px; height: 18px; width: auto; padding: 0 6px; transform: translate(6px, -6px); }
.fx.float { animation: floatup 1s ease forwards; font-family: var(--font-title); font-weight: 700; color: var(--bad); text-align: center; line-height: var(--tile); font-size: 18px; text-shadow: 0 0 8px #000; }
.fx.float.good { color: var(--good); }

.banner { position: absolute; z-index: 5; top: 40%; left: 50%; transform: translate(-50%, -50%); background: rgba(27,26,51,.92); border: 1px solid rgba(255,255,255,.1); border-radius: 18px; padding: 14px 28px; font-family: var(--font-title); font-size: 26px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); pointer-events: none; animation: bannerin .4s ease; }
.banner small { display: block; font-family: var(--font-body); font-size: 14px; color: var(--cream-dim); margin-top: 4px; }

/* ---------- side panels ---------- */
.keeper-head { display: flex; gap: 10px; align-items: center; }
.keeper-head .portrait { width: 56px; height: 56px; flex: 0 0 56px; }
.keeper-head .name { font-family: var(--font-title); font-size: 18px; }
.keeper-head .sub { color: var(--muted); font-size: 12px; }
.keeper-head.gale .name { color: var(--gale); }
.keeper-head.rill .name { color: var(--rill); }
.stat-row { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { background: var(--night); border-radius: 999px; padding: 4px 10px; font-size: 12px; color: var(--cream-dim); }
.chip.on { color: var(--cream); border: 1px solid rgba(255,255,255,.14); }
.chip.done { color: var(--good); }
.chip.frosted { color: var(--wisp); }
.actions { display: flex; gap: 8px; }
.actions .btn { flex: 1; }
.btn.move.on { background: #fff; color: #2a1a05; }
.btn.done.pulse { animation: pulse 1.4s ease-in-out infinite; }
.hand { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--cream); color: #2a2340; border-radius: 14px; padding: 9px 11px 10px; cursor: pointer; border: 3px solid transparent; transition: transform .1s ease, box-shadow .12s, border-color .12s; position: relative; }
.card:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(0,0,0,.35); }
.card.selected { border-color: var(--amber); box-shadow: 0 0 0 3px rgba(255,179,71,.35); transform: translateY(-2px); }
.card.disabled { opacity: .5; cursor: default; transform: none; box-shadow: none; }
.card .title { font-family: var(--font-title); font-weight: 600; font-size: 15px; display: flex; justify-content: space-between; align-items: center; }
.card .title .tag { font-family: var(--font-body); font-size: 10px; text-transform: uppercase; letter-spacing: .8px; color: #7a7195; }
.card .text { font-size: 12.5px; line-height: 1.35; color: #4b4468; margin-top: 3px; }
.card.gale .title { color: #b4560f; }
.card.rill .title { color: #1e7a3f; }
.card.partner { cursor: default; }
.card.small { padding: 7px 10px; }
.card.small .text { font-size: 12px; }
.deckline { display: flex; justify-content: space-between; color: var(--muted); font-size: 12px; }
.section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--muted); margin-top: 2px; }
.charms { display: flex; flex-direction: column; gap: 6px; }
.charm { background: var(--night); border-radius: 12px; padding: 7px 10px; font-size: 12.5px; }
.charm b { color: var(--amber); font-family: var(--font-title); font-weight: 500; }
.spawnlist { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.spawnlist .sp { display: flex; align-items: center; gap: 6px; color: var(--cream-dim); }
.spawnlist .sp .sprite { width: 22px; height: 22px; }
.log { flex: 1; overflow: auto; font-size: 12.5px; line-height: 1.4; max-height: 320px; display: flex; flex-direction: column-reverse; gap: 2px; scrollbar-width: thin; }
.log div { color: var(--cream-dim); }
.log .gale { color: var(--gale); }
.log .rill { color: var(--rill); }
.log .bad { color: var(--bad); }
.log .good { color: var(--good); }
.log .warn { color: var(--wisp); }
.log .title { color: var(--amber); font-family: var(--font-title); margin-top: 6px; }
.partner-status { display: flex; flex-direction: column; gap: 6px; }
.lastplays { display: flex; flex-direction: column; gap: 4px; font-size: 12.5px; color: var(--cream-dim); }
.talk { background: var(--night); border-radius: 12px; padding: 8px 10px; font-size: 12.5px; color: var(--cream-dim); }
.talk b { color: var(--cream); }

/* ---------- modal ---------- */
.modal { position: fixed; inset: 0; background: rgba(10,10,25,.72); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; backdrop-filter: blur(4px); }
.modal-card { background: var(--night-2); border: 1px solid rgba(255,255,255,.08); border-radius: 22px; padding: 22px 24px; width: min(880px, 100%); max-height: 92vh; overflow: auto; box-shadow: 0 40px 100px rgba(0,0,0,.5); animation: bannerin .3s ease; }
.modal-card h2 { font-size: 26px; }
.modal-card .sub { color: var(--cream-dim); margin: 6px 0 14px; }
.draft { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.draft .col h3 { font-size: 16px; margin-bottom: 8px; }
.draft .col.gale h3 { color: var(--gale); } .draft .col.rill h3 { color: var(--rill); }
.draft .offers { display: flex; flex-direction: column; gap: 8px; }
.draft .card.picked { border-color: var(--good); }
.draft .card.dim { opacity: .45; }
.charm-offers { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 8px; }
.charm-offer { background: var(--night); border: 2px solid rgba(255,255,255,.08); border-radius: 14px; padding: 12px; cursor: pointer; }
.charm-offer:hover { border-color: var(--amber); }
.charm-offer.picked { border-color: var(--good); }
.charm-offer b { font-family: var(--font-title); font-weight: 500; color: var(--amber); font-size: 16px; display: block; }
.charm-offer span { font-size: 13px; color: var(--cream-dim); }
.help { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 22px; font-size: 14px; line-height: 1.45; }
.help h3 { font-size: 15px; color: var(--amber); margin-bottom: 4px; }
.help p { margin: 0 0 6px; color: var(--cream-dim); }
.help b { color: var(--cream); }
.help .sprite { width: 30px; height: 30px; vertical-align: middle; display: inline-block; }
.help ul { margin: 4px 0 0 16px; padding: 0; color: var(--cream-dim); }
.help li { margin-bottom: 3px; }
.summary { display: flex; gap: 10px; flex-wrap: wrap; margin: 12px 0; }
.summary .stat { background: var(--night); border-radius: 14px; padding: 10px 14px; min-width: 90px; }
.summary .stat b { display: block; font-family: var(--font-title); font-size: 26px; color: var(--amber); }
.summary .stat span { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 16px; flex-wrap: wrap; }

#toasts { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 6px; z-index: 30; pointer-events: none; }
.toast { background: rgba(27,26,51,.95); border: 1px solid rgba(255,255,255,.12); border-radius: 12px; padding: 8px 14px; font-size: 13px; animation: bannerin .25s ease; }
.toast.bad { border-color: rgba(255,122,122,.5); }

/* ---------- animations ---------- */
@keyframes pop { 0% { transform: scale(.6); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
@keyframes breathe { 0%, 100% { opacity: .7; transform: scale(.96); } 50% { opacity: 1; transform: scale(1.02); } }
@keyframes poof { 0% { transform: scale(1); opacity: 1; } 100% { transform: scale(1.5); opacity: 0; } }
@keyframes shake { 0%, 100% { margin-left: 0; } 25% { margin-left: -5px; } 75% { margin-left: 5px; } }
@keyframes spawnin { 0% { opacity: 0; transform: translateY(-10px) scale(.7); } 100% { opacity: 1; } }
@keyframes puff { 0% { opacity: 0; transform: scale(.5); } 30% { opacity: 1; } 100% { opacity: 0; transform: scale(1.3); } }
@keyframes pingring { 0% { opacity: 1; transform: scale(.4); } 100% { opacity: 0; transform: scale(1.4); } }
@keyframes pingflash { 0%, 100% { box-shadow: inset 0 0 0 2px var(--night-3); } 30% { box-shadow: inset 0 0 0 4px #fff, 0 0 20px #fff; } }
@keyframes tileflash { 0% { filter: brightness(2.2); } 100% { filter: brightness(1); } }
@keyframes floatup { 0% { opacity: 1; transform: translateY(0); } 100% { opacity: 0; transform: translateY(-28px); } }
@keyframes bannerin { 0% { opacity: 0; transform: translate(-50%, -50%) scale(.9); } 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
.modal-card { animation: modalin .3s ease; }
@keyframes modalin { 0% { opacity: 0; transform: scale(.94); } 100% { opacity: 1; transform: scale(1); } }
@keyframes pulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(255,179,71,.5); } 50% { box-shadow: 0 0 0 8px rgba(255,179,71,0); } }

@media (max-width: 1100px) { :root { --tile: 60px; } #game { grid-template-columns: 220px minmax(0,1fr) 240px; } }
@media (max-width: 900px) { #game { grid-template-columns: 1fr; } .panel { min-height: 0; } #boardwrap { order: -1; } :root { --tile: 52px; } }

</style>
</head>
<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="brand-lantern" id="brandLantern"></span><span class="brand-name">Two Lanterns</span></div>
    <div class="status" id="statusBar" hidden>
      <span class="pill" id="pillNight"></span>
      <span class="pill warmth" id="pillWarmth" title="Warmth: the shared life of the garden. Each bloom that freezes costs one."></span>
      <span class="pill glow" id="pillGlow" title="Glow: blooms that survived to dawn, summed over the run."></span>
    </div>
    <div class="right">
      <span class="pill room" id="pillRoom" hidden></span>
      <span class="pill net" id="pillNet" hidden></span>
      <button class="btn ghost small" id="btnHelp">how to play</button>
      <button class="btn ghost small" id="btnLeave" hidden>leave</button>
    </div>
  </header>

  <section id="lobby">
    <div class="lobby-card">
      <div class="lobby-hero">
        <div class="hero-art" id="heroArt"></div>
        <h1>Two Lanterns</h1>
        <p class="tagline">A walled garden on the longest night. Two keepers, two laptops, one hour at a time.</p>
      </div>
      <div class="lobby-body" id="lobbyBody"></div>
    </div>
  </section>

  <main id="game" hidden>
    <aside id="left" class="panel"></aside>
    <section id="boardwrap">
      <div id="banner" class="banner" hidden></div>
      <div id="board"></div>
      <div id="boardhint" class="boardhint"></div>
    </section>
    <aside id="right" class="panel"></aside>
  </main>

  <div id="modal" class="modal" hidden><div class="modal-card" id="modalCard"></div></div>
  <div id="toasts"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.5/peerjs.min.js"></script>
<script>
/* ---- engine.js ---- */
/* Two Lanterns — pure rules engine. Deterministic given seed + ordered actions.
   Browser global `TL` and CommonJS export. No DOM, no timers. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.TL = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';

  // ---------- constants ----------
  const DIRS = { N: [0, -1], E: [1, 0], S: [0, 1], W: [-1, 0] };
  const DIR_LIST = ['N', 'E', 'S', 'W'];
  const OPP = { N: 'S', S: 'N', E: 'W', W: 'E' };
  const KEEPER_IDS = ['gale', 'rill'];
  const STAGE_NAME = ['', 'seed', 'sprout', 'bloom'];

  const WISP_TYPES = {
    chill: { name: 'Chill', hp: 1, moves: 2, fickle: 0.25, area: false, sleet: false },
    flurry: { name: 'Flurry', hp: 1, moves: 3, fickle: 0.25, area: false, sleet: false },
    hoar: { name: 'Hoar', hp: 2, moves: 1, fickle: 0, area: true, sleet: false },
    sleet: { name: 'Sleet', hp: 1, moves: 2, fickle: 0, area: false, sleet: true },
  };

  const DEFAULT_CONFIG = {
    W: 7, H: 6, nights: 5, hours: 6, warmth: 5, handSize: 3, cardsPerHour: 2,
    lantern: 2, sharedLanterns: false, carryCap: 3, charmThreshold: 4,
    dawnLowByNight: [2, 3, 4, 5, 6], // at dawn of night n, fewer than this many blooms costs 1 Warmth
    // spawns marked per hour, per night (index 0 = night 1)
    schedule: [
      [1, 1, 1, 2, 1, 2],
      [1, 2, 1, 2, 2, 2],
      [2, 2, 2, 3, 2, 3],
      [2, 3, 3, 2, 3, 3],
      [3, 3, 3, 3, 3, 4],
    ],
    // wisp type weights per night
    typeWeights: [
      { chill: 1 },
      { chill: 3, flurry: 1 },
      { chill: 3, flurry: 2, hoar: 1 },
      { chill: 3, flurry: 2, hoar: 1, sleet: 1 },
      { chill: 2, flurry: 2, hoar: 2, sleet: 1 },
    ],
    stones: [4, 6], ponds: [1, 2],
    startPlants: { sprouts: 2, seeds: 1 },
  };

  // ---------- rng (mulberry32) ----------
  function rngNext(state) {
    let t = (state.rng += 0x6D2B79F5) >>> 0;
    state.rng = t;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  }
  function rngInt(state, n) { return Math.floor(rngNext(state) * n); }
  function rngPick(state, arr) { return arr[rngInt(state, arr.length)]; }
  function shuffle(state, arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = rngInt(state, i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  // ---------- helpers ----------
  function idx(state, x, y) { return y * state.config.W + x; }
  function inBoard(state, x, y) { return x >= 0 && y >= 0 && x < state.config.W && y < state.config.H; }
  function tileAt(state, x, y) { return inBoard(state, x, y) ? state.tiles[idx(state, x, y)] : null; }
  function wispAt(state, x, y) { return state.wisps.find(w => w.hp > 0 && w.x === x && w.y === y) || null; }
  function keeperAt(state, x, y) { return KEEPER_IDS.map(k => state.keepers[k]).find(k => k.x === x && k.y === y) || null; }
  function manhattan(ax, ay, bx, by) { return Math.abs(ax - bx) + Math.abs(ay - by); }
  function isEdge(state, x, y) { return x === 0 || y === 0 || x === state.config.W - 1 || y === state.config.H - 1; }
  function coordName(x, y) { return String.fromCharCode(65 + x) + (y + 1); }
  function hasCharm(state, id) { return state.charms.includes(id); }
  function livingWisps(state) { return state.wisps.filter(w => w.hp > 0); }
  function plants(state) {
    const out = [];
    for (let y = 0; y < state.config.H; y++) for (let x = 0; x < state.config.W; x++) {
      const t = state.tiles[idx(state, x, y)];
      if (t.plant > 0) out.push({ x, y, stage: t.plant });
    }
    return out;
  }
  function countBlooms(state) { return plants(state).filter(p => p.stage === 3).length; }
  function isPuddle(state, x, y) { const t = tileAt(state, x, y); return !!t && t.terrain === 'puddle'; }
  function keeperSpeed(state, k) {
    let s = k.id === 'gale' ? 3 : 2;
    if (k.id === 'gale' && hasCharm(state, 'tailwind')) s += 1;
    if (k.id === 'rill' && hasCharm(state, 'webbed')) s += 1;
    return s + (k.dashBonus || 0);
  }
  function lanternRadius(state) { return state.config.lantern + (hasCharm(state, 'longwick') ? 1 : 0); }

  // Blocking for movement of anything (keeper or wisp): stone, plant, keeper, wisp.
  function blockedFor(state, x, y, mover) {
    if (!inBoard(state, x, y)) return 'edge';
    const t = state.tiles[idx(state, x, y)];
    if (t.terrain === 'stone') return 'stone';
    if (t.plant > 0) return 'plant';
    const k = keeperAt(state, x, y); if (k && k !== mover) return 'keeper';
    const w = wispAt(state, x, y); if (w && w !== mover) return 'wisp';
    return null;
  }

  function log(state, text, cls) {
    state.log.push({ night: state.night, hour: state.hour, text, cls: cls || '' });
    if (state.log.length > 300) state.log.splice(0, state.log.length - 300);
  }
  function emit(state, ev) { state.events.push(ev); }

  function cloneState(s) { return JSON.parse(JSON.stringify(s)); }

  // ---------- wisp damage / death / push ----------
  function damageWisp(state, w, n, why) {
    if (w.hp <= 0) return;
    w.hp -= n;
    emit(state, { type: 'hit', id: w.id, x: w.x, y: w.y, n });
    if (w.hp <= 0) {
      emit(state, { type: 'die', id: w.id, x: w.x, y: w.y, wtype: w.type });
      log(state, `${WISP_TYPES[w.type].name} at ${coordName(w.x, w.y)} melted away${why ? ' (' + why + ')' : ''}.`, 'good');
      if (WISP_TYPES[w.type].sleet) {
        const t = tileAt(state, w.x, w.y);
        if (t && t.terrain === 'soil' && t.plant === 0) { t.terrain = 'frost'; emit(state, { type: 'frost', x: w.x, y: w.y }); }
      }
    }
  }

  // push one step. returns true if it moved.
  function pushStep(state, w, dir, why) {
    const [dx, dy] = DIRS[dir];
    const nx = w.x + dx, ny = w.y + dy;
    const b = blockedFor(state, nx, ny, w);
    if (b) {
      emit(state, { type: 'bump', id: w.id, x: w.x, y: w.y, dir, into: b });
      damageWisp(state, w, 1, 'bumped ' + b);
      if (b === 'wisp') { const o = wispAt(state, nx, ny); if (o) damageWisp(state, o, 1, 'bumped'); }
      return false;
    }
    emit(state, { type: 'slide', id: w.id, from: [w.x, w.y], to: [nx, ny] });
    w.x = nx; w.y = ny;
    if (isPuddle(state, nx, ny)) { w.soaked = true; emit(state, { type: 'soak', id: w.id, x: nx, y: ny }); return 'soaked'; }
    w.soaked = false;
    return true;
  }
  function pushWisp(state, w, dir, steps, why) {
    for (let i = 0; i < steps; i++) {
      const r = pushStep(state, w, dir, why);
      if (r !== true) break;
    }
  }
  function dirFromTo(ax, ay, bx, by) {
    if (bx > ax) return 'E'; if (bx < ax) return 'W'; if (by > ay) return 'S'; return 'N';
  }

  // ---------- plants ----------
  function killPlant(state, x, y, cause) {
    const t = tileAt(state, x, y);
    if (!t || t.plant === 0) return;
    const stage = t.plant;
    if (stage === 3 && hasCharm(state, 'deeproots') && cause === 'breath') {
      t.plant = 2;
      emit(state, { type: 'wither', x, y, stage: 3, to: 2 });
      log(state, `The bloom at ${coordName(x, y)} withers to a sprout (Deep Roots).`, 'warn');
      return;
    }
    t.plant = 0;
    if (t.terrain === 'soil') t.terrain = 'frost';
    emit(state, { type: 'freeze', x, y, stage });
    if (stage === 3) {
      if (hasCharm(state, 'hearthstone') && !state.nightFlags.firstLoss) {
        state.nightFlags.firstLoss = true;
        log(state, `The bloom at ${coordName(x, y)} froze. Hearthstone keeps the Warmth.`, 'warn');
      } else {
        state.warmth -= 1;
        emit(state, { type: 'warmth', warmth: state.warmth });
        log(state, `The bloom at ${coordName(x, y)} froze. Warmth ${state.warmth}.`, 'bad');
      }
    } else {
      log(state, `The ${STAGE_NAME[stage]} at ${coordName(x, y)} froze.`, 'warn');
    }
  }
  function growPlant(state, x, y) {
    const t = tileAt(state, x, y);
    if (!t || t.plant === 0 || t.plant >= 3) return false;
    t.plant += 1;
    emit(state, { type: 'grow', x, y, stage: t.plant });
    return true;
  }
  function placePlant(state, x, y, stage) {
    const t = tileAt(state, x, y);
    t.plant = stage;
    emit(state, { type: 'plant', x, y, stage });
  }

  // ---------- pathing ----------
  // BFS over tiles a wisp could walk (not stone/plant/keeper). Other wisps are passable for planning.
  function bfsWisp(state, sx, sy) {
    const W = state.config.W, H = state.config.H;
    const dist = new Array(W * H).fill(-1);
    const q = [[sx, sy]]; dist[sy * W + sx] = 0;
    while (q.length) {
      const [x, y] = q.shift();
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (!inBoard(state, nx, ny)) continue;
        const i = ny * W + nx;
        if (dist[i] >= 0) continue;
        const t = state.tiles[i];
        if (t.terrain === 'stone' || t.plant > 0 || keeperAt(state, nx, ny)) continue;
        dist[i] = dist[y * W + x] + 1;
        q.push([nx, ny]);
      }
    }
    return dist;
  }

  // Keeper reachable tiles with Rill's free puddle entry. Returns map idx -> cost.
  function keeperReach(state, k) {
    const W = state.config.W, H = state.config.H;
    const speed = keeperSpeed(state, k);
    const cost = new Array(W * H).fill(Infinity);
    cost[idx(state, k.x, k.y)] = 0;
    // Dijkstra on tiny graph
    const open = [[0, k.x, k.y]];
    while (open.length) {
      open.sort((a, b) => a[0] - b[0]);
      const [c, x, y] = open.shift();
      if (c > cost[idx(state, x, y)]) continue;
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (blockedFor(state, nx, ny, k)) continue;
        const step = (k.id === 'rill' && isPuddle(state, nx, ny)) ? 0 : 1;
        const nc = c + step;
        if (nc > speed) continue;
        const i = idx(state, nx, ny);
        if (nc < cost[i]) { cost[i] = nc; open.push([nc, nx, ny]); }
      }
    }
    const out = [];
    for (let i = 0; i < W * H; i++) if (cost[i] < Infinity && i !== idx(state, k.x, k.y)) out.push({ x: i % W, y: Math.floor(i / W), cost: cost[i] });
    return out;
  }

  // ---------- intents ----------
  function adjacentPlantDirs(state, w) {
    const out = [];
    for (const d of DIR_LIST) {
      const t = tileAt(state, w.x + DIRS[d][0], w.y + DIRS[d][1]);
      if (t && t.plant > 0) out.push({ dir: d, stage: t.plant });
    }
    return out;
  }
  function openDirs(state, w) {
    return DIR_LIST.filter(d => { const b = blockedFor(state, w.x + DIRS[d][0], w.y + DIRS[d][1], w); return !b || b === 'wisp'; });
  }
  function computeIntent(state, w) {
    const T = WISP_TYPES[w.type];
    const adj = adjacentPlantDirs(state, w);
    if (adj.length) {
      let pool = adj;
      if (hasCharm(state, 'brightbulbs') && adj.some(a => a.stage === 1)) pool = adj.filter(a => a.stage === 1);
      const best = Math.max(...pool.map(a => a.stage));
      const dir = rngPick(state, pool.filter(a => a.stage === best)).dir;
      return { kind: 'breathe', dir, steps: 0 };
    }
    if (w.soaked) return { kind: 'none', dir: null, steps: 0 };
    const ps = plants(state);
    if (!ps.length) {
      const od = openDirs(state, w);
      return od.length ? { kind: 'move', dir: rngPick(state, od), steps: T.moves, wander: true } : { kind: 'none', dir: null, steps: 0 };
    }
    // fickle roll happens before pathing so lantern-revealed intent includes it
    if (T.fickle > 0 && rngNext(state) < T.fickle) {
      const od = openDirs(state, w);
      if (od.length) return { kind: 'move', dir: rngPick(state, od), steps: 1, fickle: true };
    }
    const dist = bfsWisp(state, w.x, w.y);
    // distance to a plant = min dist over its free adjacent tiles
    let candidates = ps.map(p => {
      let best = Infinity;
      for (const d of DIR_LIST) {
        const nx = p.x + DIRS[d][0], ny = p.y + DIRS[d][1];
        if (!inBoard(state, nx, ny)) continue;
        const di = dist[idx(state, nx, ny)];
        if (di >= 0 && di < best) best = di;
      }
      return { p, d: best };
    }).filter(c => c.d < Infinity);
    if (!candidates.length) {
      const od = openDirs(state, w);
      return od.length ? { kind: 'move', dir: rngPick(state, od), steps: T.moves, wander: true } : { kind: 'none', dir: null, steps: 0 };
    }
    if (hasCharm(state, 'brightbulbs') && candidates.some(c => c.p.stage === 1)) candidates = candidates.filter(c => c.p.stage === 1);
    const dmin = Math.min(...candidates.map(c => c.d));
    const target = rngPick(state, candidates.filter(c => c.d === dmin)).p;
    // choose the first step: a neighbour whose distance-to-target is one less than ours
    const tdist = bfsFrom(state, target);
    const here = tdist[idx(state, w.x, w.y)];
    const steps = DIR_LIST.filter(d => {
      const nx = w.x + DIRS[d][0], ny = w.y + DIRS[d][1];
      if (!inBoard(state, nx, ny)) return false;
      const b = blockedFor(state, nx, ny, w);
      if (b && b !== 'wisp') return false;
      const di = tdist[idx(state, nx, ny)];
      return di >= 0 && di === here - 1;
    });
    if (!steps.length) return { kind: 'none', dir: null, steps: 0 };
    return { kind: 'move', dir: rngPick(state, steps), steps: T.moves, target: [target.x, target.y] };
  }
  // BFS distances *to* the tiles adjacent to a plant (multi-source), through wisp-walkable tiles.
  function bfsFrom(state, plant) {
    const W = state.config.W, H = state.config.H;
    const dist = new Array(W * H).fill(-1);
    const q = [];
    for (const d of DIR_LIST) {
      const nx = plant.x + DIRS[d][0], ny = plant.y + DIRS[d][1];
      if (!inBoard(state, nx, ny)) continue;
      const t = state.tiles[idx(state, nx, ny)];
      if (t.terrain === 'stone' || t.plant > 0 || keeperAt(state, nx, ny)) continue;
      dist[idx(state, nx, ny)] = 0; q.push([nx, ny]);
    }
    while (q.length) {
      const [x, y] = q.shift();
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (!inBoard(state, nx, ny)) continue;
        const i = idx(state, nx, ny);
        if (dist[i] >= 0) continue;
        const t = state.tiles[i];
        if (t.terrain === 'stone' || t.plant > 0 || keeperAt(state, nx, ny)) continue;
        dist[i] = dist[idx(state, x, y)] + 1; q.push([nx, ny]);
      }
    }
    return dist;
  }
  function assignIntents(state) {
    for (const w of state.wisps) { if (w.hp > 0) w.intent = computeIntent(state, w); }
  }

  // ---------- spawning ----------
  function pickWispType(state) {
    const weights = state.config.typeWeights[Math.min(state.night, state.config.typeWeights.length) - 1];
    const entries = Object.entries(weights);
    const total = entries.reduce((a, [, v]) => a + v, 0);
    let r = rngNext(state) * total;
    for (const [t, v] of entries) { r -= v; if (r < 0) return t; }
    return entries[entries.length - 1][0];
  }
  function markSpawns(state) {
    state.spawns = [];
    const sched = state.config.schedule[Math.min(state.night, state.config.schedule.length) - 1];
    const n = sched[Math.min(state.hour, sched.length) - 1];
    const cands = [];
    for (let y = 0; y < state.config.H; y++) for (let x = 0; x < state.config.W; x++) {
      if (!isEdge(state, x, y)) continue;
      const t = state.tiles[idx(state, x, y)];
      if (t.terrain === 'stone' || t.terrain === 'puddle' || t.plant > 0) continue;
      if (keeperAt(state, x, y) || wispAt(state, x, y)) continue;
      cands.push({ x, y });
    }
    const chosen = shuffle(state, cands).slice(0, n);
    for (const c of chosen) state.spawns.push({ x: c.x, y: c.y, type: pickWispType(state) });
  }
  function freeEdgeNear(state, x, y) {
    const cands = [];
    for (let yy = 0; yy < state.config.H; yy++) for (let xx = 0; xx < state.config.W; xx++) {
      if (!isEdge(state, xx, yy)) continue;
      const t = state.tiles[idx(state, xx, yy)];
      if (t.terrain === 'stone' || t.plant > 0) continue;
      if (keeperAt(state, xx, yy) || wispAt(state, xx, yy)) continue;
      if (state.spawns.some(sp => sp.x === xx && sp.y === yy && !sp.resolved)) continue;
      cands.push({ x: xx, y: yy, d: manhattan(x, y, xx, yy) });
    }
    if (!cands.length) return null;
    const dmin = Math.min(...cands.map(c => c.d));
    return rngPick(state, cands.filter(c => c.d === dmin));
  }
  function resolveSpawns(state) {
    for (const s of state.spawns) {
      let x = s.x, y = s.y;
      const k = keeperAt(state, x, y);
      if (k) { k.frosted = true; emit(state, { type: 'frostKeeper', keeper: k.id }); log(state, `${keeperName(k.id)} stood in the Chill's way at ${coordName(x, y)} and got frosted.`, 'warn'); }
      const t = tileAt(state, x, y);
      if (t.plant > 0) killPlant(state, x, y, 'spawn');
      if (keeperAt(state, x, y) || wispAt(state, x, y) || t.plant > 0 || t.terrain === 'stone') {
        const alt = freeEdgeNear(state, x, y);
        if (!alt) { log(state, `A Chill found no way in near ${coordName(x, y)}.`, ''); s.resolved = true; continue; }
        log(state, `The Chill squeezed in at ${coordName(alt.x, alt.y)} instead.`, '');
        x = alt.x; y = alt.y;
      }
      s.resolved = true;
      const w = { id: state.nextWispId++, type: s.type, hp: WISP_TYPES[s.type].hp, x, y, soaked: isPuddle(state, x, y), intent: { kind: 'none', dir: null, steps: 0 } };
      state.wisps.push(w);
      emit(state, { type: 'spawn', id: w.id, x, y, wtype: s.type });
    }
    state.spawns = [];
  }

  // ---------- wisp phase ----------
  function wispPhase(state) {
    for (const w of state.wisps) {
      if (w.hp <= 0) continue;
      const it = w.intent;
      if (!it || it.kind === 'none') continue;
      if (it.kind === 'breathe') {
        const dirs = WISP_TYPES[w.type].area ? DIR_LIST : [it.dir];
        for (const d of dirs) {
          const tx = w.x + DIRS[d][0], ty = w.y + DIRS[d][1];
          if (!inBoard(state, tx, ty)) continue;
          emit(state, { type: 'breathe', id: w.id, x: w.x, y: w.y, dir: d });
          const t = tileAt(state, tx, ty);
          if (t.plant > 0) killPlant(state, tx, ty, 'breath');
          else { const k = keeperAt(state, tx, ty); if (k) { k.frosted = true; emit(state, { type: 'frostKeeper', keeper: k.id }); log(state, `${keeperName(k.id)} was breathed on and is frosted.`, 'warn'); } }
        }
      } else if (it.kind === 'move') {
        if (w.soaked) continue; // soaked wisps cannot move
        for (let s = 0; s < it.steps; s++) {
          const nx = w.x + DIRS[it.dir][0], ny = w.y + DIRS[it.dir][1];
          if (blockedFor(state, nx, ny, w)) break;
          emit(state, { type: 'walk', id: w.id, from: [w.x, w.y], to: [nx, ny] });
          w.x = nx; w.y = ny;
          if (isPuddle(state, nx, ny)) { w.soaked = true; emit(state, { type: 'soak', id: w.id, x: nx, y: ny }); break; }
        }
      }
    }
    state.wisps = state.wisps.filter(w => w.hp > 0);
  }

  // ---------- dusk ----------
  function dusk(state) {
    // growth
    const grow = [];
    for (const p of plants(state)) {
      if (p.stage >= 3) continue;
      if (DIR_LIST.some(d => isPuddle(state, p.x + DIRS[d][0], p.y + DIRS[d][1]))) grow.push(p);
    }
    for (const p of grow) { growPlant(state, p.x, p.y); }
    if (grow.length) log(state, `${grow.length} plant${grow.length > 1 ? 's' : ''} grew by the water.`, 'good');
    // temporary puddles (Dew) revert
    for (const t of state.tiles) if (t.dew) { t.dew = false; if (t.terrain === 'puddle') t.terrain = 'soil'; }
    for (const w of state.wisps) if (w.soaked && !isPuddle(state, w.x, w.y)) w.soaked = false;
    // early thaw
    if (hasCharm(state, 'earlythaw')) {
      const frost = [];
      for (let y = 0; y < state.config.H; y++) for (let x = 0; x < state.config.W; x++) {
        const t = state.tiles[idx(state, x, y)];
        if (t.terrain === 'frost' && DIR_LIST.some(d => isPuddle(state, x + DIRS[d][0], y + DIRS[d][1]))) frost.push({ x, y });
      }
      if (frost.length) { const f = rngPick(state, frost); tileAt(state, f.x, f.y).terrain = 'soil'; emit(state, { type: 'thaw', x: f.x, y: f.y }); }
    }
    resolveSpawns(state);
  }

  // ---------- hours & nights ----------
  function keeperName(id) { return id === 'gale' ? 'Gale' : 'Rill'; }
  function dawnNeed(state) { const a = state.config.dawnLowByNight || [0]; return a[Math.min(Math.max(state.night, 1), a.length) - 1]; }

  function drawCards(state, k) {
    const size = state.config.handSize;
    while (k.hand.length < size) {
      if (!k.deck.length) {
        if (!k.discard.length) break;
        k.deck = shuffle(state, k.discard); k.discard = [];
      }
      k.hand.push(k.deck.pop());
    }
  }
  function startHour(state) {
    for (const id of KEEPER_IDS) {
      const k = state.keepers[id];
      k.discard.push(...k.hand); k.hand = [];
      drawCards(state, k);
      k.moved = k.frosted; // frosted keepers lose their move
      k.frosted = false;
      k.played = 0; k.done = false; k.dashBonus = 0;
    }
    assignIntents(state);
    markSpawns(state);
    state.phase = 'act';
    emit(state, { type: 'hour', night: state.night, hour: state.hour });
  }

  function endHour(state) {
    state.phase = 'wisps';
    emit(state, { type: 'wispPhase' });
    wispPhase(state);
    if (state.warmth <= 0) { state.phase = 'lost'; log(state, 'The last warmth is gone. The garden sleeps.', 'bad'); emit(state, { type: 'lost' }); return; }
    dusk(state);
    if (state.warmth <= 0) { state.phase = 'lost'; log(state, 'The last warmth is gone. The garden sleeps.', 'bad'); emit(state, { type: 'lost' }); return; }
    if (state.hour >= state.config.hours) { endNight(state); return; }
    state.hour += 1;
    startHour(state);
  }

  function endNight(state) {
    const blooms = countBlooms(state);
    state.glow += blooms;
    state.glowByNight.push(blooms);
    state.lastBlooms = blooms;
    log(state, `Dawn. ${blooms} bloom${blooms === 1 ? '' : 's'} lit the garden. Glow ${state.glow}.`, 'good');
    emit(state, { type: 'dawn', blooms, glow: state.glow });
    const dawnLow = dawnNeed(state);
    if (blooms < dawnLow) {
      state.warmth -= 1; emit(state, { type: 'warmth', warmth: state.warmth, dawn: 'gutter' });
      log(state, `Too little light for the hearth: it needed ${dawnLow} blooms. Warmth ${state.warmth}.`, 'bad');
      if (state.warmth <= 0) { state.phase = 'lost'; log(state, 'The last warmth is gone. The garden sleeps.', 'bad'); emit(state, { type: 'lost' }); return; }
    }
    if (state.night >= state.config.nights) { state.phase = 'won'; emit(state, { type: 'won' }); return; }
    // draft
    state.phase = 'draft';
    const offers = {};
    for (const id of KEEPER_IDS) {
      const pool = CARD_POOLS[id];
      offers[id] = shuffle(state, pool).slice(0, 3);
    }
    let charmOffers = null;
    if (blooms >= state.config.charmThreshold) {
      const remaining = Object.keys(CHARMS).filter(c => !state.charms.includes(c));
      charmOffers = shuffle(state, remaining).slice(0, 2);
      if (!charmOffers.length) charmOffers = null;
    }
    state.draft = { offers, picks: { gale: null, rill: null }, charmOffers, charmPick: null, carry: Math.min(blooms, state.config.carryCap) };
  }

  function maybeFinishDraft(state) {
    const d = state.draft;
    if (!d) return;
    if (d.picks.gale === null || d.picks.rill === null) return;
    if (d.charmOffers && d.charmPick === null) return;
    for (const id of KEEPER_IDS) {
      if (d.picks[id] === -1) continue;
      const c = d.offers[id][d.picks[id]];
      state.keepers[id].collection.push(c);
    }
    if (d.charmOffers) state.charms.push(d.charmOffers[d.charmPick]);
    const carry = d.carry;
    state.draft = null;
    state.night += 1;
    startNight(state, carry);
  }

  function connected(state) {
    const W = state.config.W, H = state.config.H;
    let start = -1;
    for (let i = 0; i < W * H; i++) if (state.tiles[i].terrain !== 'stone') { start = i; break; }
    const seen = new Array(W * H).fill(false); seen[start] = true;
    const q = [start]; let n = 1;
    while (q.length) {
      const i = q.shift(); const x = i % W, y = Math.floor(i / W);
      for (const d of DIR_LIST) {
        const nx = x + DIRS[d][0], ny = y + DIRS[d][1];
        if (!inBoard(state, nx, ny)) continue;
        const j = ny * W + nx;
        if (seen[j] || state.tiles[j].terrain === 'stone') continue;
        seen[j] = true; n++; q.push(j);
      }
    }
    const total = state.tiles.filter(t => t.terrain !== 'stone').length;
    return n === total;
  }

  function startNight(state, carrySeeds) {
    const W = state.config.W, H = state.config.H;
    state.tiles = [];
    for (let i = 0; i < W * H; i++) state.tiles.push({ terrain: 'soil', plant: 0 });
    state.wisps = []; state.spawns = [];
    state.nightFlags = { firstLoss: false };
    state.hour = 1;
    const cx = Math.floor(W / 2), cy = Math.floor((H - 1) / 2); // 3, 2
    // keepers
    state.keepers.gale.x = 1; state.keepers.gale.y = cy + 1;
    state.keepers.rill.x = W - 2; state.keepers.rill.y = cy;
    // stones (not adjacent to centre plants, never disconnect)
    const nStones = state.config.stones[0] + rngInt(state, state.config.stones[1] - state.config.stones[0] + 1);
    let placed = 0, tries = 0;
    while (placed < nStones && tries++ < 200) {
      const x = rngInt(state, W), y = rngInt(state, H);
      if (manhattan(x, y, cx, cy) <= 1) continue;
      if (keeperAt(state, x, y)) continue;
      const t = state.tiles[idx(state, x, y)];
      if (t.terrain !== 'soil') continue;
      t.terrain = 'stone';
      if (!connected(state)) { t.terrain = 'soil'; continue; }
      placed++;
    }
    // ponds
    const nPonds = state.config.ponds[0] + rngInt(state, state.config.ponds[1] - state.config.ponds[0] + 1);
    placed = 0; tries = 0;
    while (placed < nPonds && tries++ < 200) {
      const x = 1 + rngInt(state, W - 2), y = 1 + rngInt(state, H - 2);
      if (manhattan(x, y, cx, cy) === 0) continue;
      if (keeperAt(state, x, y)) continue;
      const t = state.tiles[idx(state, x, y)];
      if (t.terrain !== 'soil') continue;
      t.terrain = 'puddle'; placed++;
    }
    // plants near centre
    const spots = [];
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      if (manhattan(x, y, cx, cy) > 2 || isEdge(state, x, y)) continue;
      const t = state.tiles[idx(state, x, y)];
      if (t.terrain !== 'soil' || keeperAt(state, x, y)) continue;
      spots.push({ x, y, d: manhattan(x, y, cx, cy) });
    }
    const order = shuffle(state, spots).sort((a, b) => a.d - b.d);
    let i = 0;
    for (let s = 0; s < state.config.startPlants.sprouts && i < order.length; s++, i++) state.tiles[idx(state, order[i].x, order[i].y)].plant = 2;
    for (let s = 0; s < state.config.startPlants.seeds + (carrySeeds || 0) && i < order.length; s++, i++) state.tiles[idx(state, order[i].x, order[i].y)].plant = 1;
    // decks
    for (const id of KEEPER_IDS) {
      const k = state.keepers[id];
      k.deck = shuffle(state, k.collection.slice());
      k.hand = []; k.discard = []; k.exhausted = [];
      k.frosted = false; k.moved = false; k.played = 0; k.done = false; k.dashBonus = 0;
    }
    log(state, `Night ${state.night} falls over the garden.`, 'title');
    emit(state, { type: 'night', night: state.night });
    startHour(state);
  }

  // ---------- cards ----------
  // target kinds: none | wisp-adjacent | wisp-range | tile-range | dir | plant-range | puddle-any | puddle-range | wisp-dir | plant-move | frost-range
  function wispsWithin(state, k, r) { return livingWisps(state).filter(w => manhattan(w.x, w.y, k.x, k.y) <= r); }
  function tilesWithin(state, k, r, pred) {
    const out = [];
    for (let y = 0; y < state.config.H; y++) for (let x = 0; x < state.config.W; x++) {
      if (manhattan(x, y, k.x, k.y) > r) continue;
      if (pred(state.tiles[idx(state, x, y)], x, y)) out.push({ x, y });
    }
    return out;
  }
  const emptySoil = (state) => (t, x, y) => t.terrain === 'soil' && t.plant === 0 && !wispAt(state, x, y) && !keeperAt(state, x, y);

  const CARDS = {
    // ----- Gale -----
    gust: { name: 'Gust', keeper: 'gale', text: 'Push an adjacent Chill one tile away from you.', target: 'wisp-adjacent',
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, dirFromTo(k.x, k.y, w.x, w.y), 1); } },
    sweep: { name: 'Sweep', keeper: 'gale', text: 'Choose a direction. Every Chill in that line from you is pushed one tile that way, farthest first.', target: 'dir',
      effect(s, k, t) {
        const [dx, dy] = DIRS[t.dir]; const line = [];
        for (let x = k.x + dx, y = k.y + dy; inBoard(s, x, y); x += dx, y += dy) { const w = wispAt(s, x, y); if (w) line.push(w); }
        for (const w of line.reverse()) pushWisp(s, w, t.dir, 1);
      } },
    scatter: { name: 'Scatter', keeper: 'gale', text: 'Plant a seed on an empty soil tile within 2.', target: 'tile-range', range: 2, pred: emptySoil,
      effect(s, k, t) { placePlant(s, t.x, t.y, 1); } },
    pollinate: { name: 'Pollinate', keeper: 'gale', text: 'Choose a bloom within 2. Seeds sprout on every empty soil tile next to it.', target: 'plant-range', range: 2, stage: [3],
      effect(s, k, t) { for (const d of DIR_LIST) { const x = t.x + DIRS[d][0], y = t.y + DIRS[d][1]; const tile = tileAt(s, x, y); if (tile && emptySoil(s)(tile, x, y)) placePlant(s, x, y, 1); } } },
    dash: { name: 'Dash', keeper: 'gale', text: 'You may move again this hour, with +1 speed.', target: 'none',
      effect(s, k) { k.moved = false; k.dashBonus = (k.dashBonus || 0) + 1; } },
    bluster: { name: 'Bluster', keeper: 'gale', text: 'A Chill within 2 forgets its intent this hour.', target: 'wisp-range', range: 2,
      effect(s, k, t) { const w = findWisp(s, t.wisp); w.intent = { kind: 'none', dir: null, steps: 0 }; emit(s, { type: 'calm', id: w.id, x: w.x, y: w.y }); } },
    updraft: { name: 'Updraft', keeper: 'gale', text: 'Push an adjacent Chill two tiles away from you.', target: 'wisp-adjacent',
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, dirFromTo(k.x, k.y, w.x, w.y), 2); } },
    crosswind: { name: 'Crosswind', keeper: 'gale', text: 'Push a Chill within 2 one tile in any direction.', target: 'wisp-dir', range: 2,
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, t.dir, 1); } },
    whirl: { name: 'Whirl', keeper: 'gale', text: 'Every Chill adjacent to you is pushed one tile away.', target: 'none', needs: 'wisp-adjacent',
      effect(s, k) { for (const w of wispsWithin(s, k, 1)) if (w.hp > 0) pushWisp(s, w, dirFromTo(k.x, k.y, w.x, w.y), 1); } },
    kite: { name: 'Kite', keeper: 'gale', text: 'Carry a seed or sprout within 2 to an adjacent empty soil tile.', target: 'plant-move', range: 2, stage: [1, 2],
      effect(s, k, t) { const from = tileAt(s, t.x, t.y); const st = from.plant; from.plant = 0; placePlant(s, t.tx, t.ty, st); emit(s, { type: 'carry', from: [t.x, t.y], to: [t.tx, t.ty] }); } },
    tailwind: { name: 'Tailwind', keeper: 'gale', text: 'Both keepers may move again this hour. Exhaust.', target: 'none', exhaust: true,
      effect(s) { for (const id of KEEPER_IDS) s.keepers[id].moved = false; } },
    secondwind: { name: 'Second Wind', keeper: 'gale', text: 'Draw two cards.', target: 'none',
      effect(s, k) { const size = s.config.handSize; s.config.handSize = k.hand.length + 2; drawCards(s, k); s.config.handSize = size; } },
    bait: { name: 'Bait', keeper: 'gale', text: 'Plant a seed on any empty soil tile on the board.', target: 'tile-range', range: 99, pred: emptySoil,
      effect(s, k, t) { placePlant(s, t.x, t.y, 1); } },
    howl: { name: 'Howl', keeper: 'gale', text: 'Every Chill within 2 forgets its intent this hour. Exhaust.', target: 'none', exhaust: true, needs: 'wisp-range2',
      effect(s, k) { for (const w of wispsWithin(s, k, 2)) { w.intent = { kind: 'none', dir: null, steps: 0 }; emit(s, { type: 'calm', id: w.id, x: w.x, y: w.y }); } } },

    // ----- Rill -----
    puddle: { name: 'Puddle', keeper: 'rill', text: 'Make a puddle on a soil tile within 2 with no plant. A Chill standing there is soaked.', target: 'tile-range', range: 2,
      pred: (state) => (t, x, y) => t.terrain === 'soil' && t.plant === 0,
      effect(s, k, t) { makePuddle(s, t.x, t.y, false); } },
    splash: { name: 'Splash', keeper: 'rill', text: 'Push an adjacent Chill one tile away from you.', target: 'wisp-adjacent',
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, dirFromTo(k.x, k.y, w.x, w.y), 1); } },
    sprinkle: { name: 'Sprinkle', keeper: 'rill', text: 'A plant within 2 grows one stage.', target: 'plant-range', range: 2, stage: [1, 2],
      effect(s, k, t) { growPlant(s, t.x, t.y); } },
    mist: { name: 'Mist', keeper: 'rill', text: 'A Chill within 2 forgets its intent this hour.', target: 'wisp-range', range: 2,
      effect(s, k, t) { const w = findWisp(s, t.wisp); w.intent = { kind: 'none', dir: null, steps: 0 }; emit(s, { type: 'calm', id: w.id, x: w.x, y: w.y }); } },
    hop: { name: 'Hop', keeper: 'rill', text: 'Leap to any empty puddle on the board.', target: 'puddle-any',
      effect(s, k, t) { emit(s, { type: 'hop', keeper: k.id, from: [k.x, k.y], to: [t.x, t.y] }); k.x = t.x; k.y = t.y; } },
    drain: { name: 'Drain', keeper: 'rill', text: 'Remove a puddle within 2. A Chill soaking in it shivers for 1.', target: 'puddle-range', range: 2,
      effect(s, k, t) { const tile = tileAt(s, t.x, t.y); tile.terrain = 'soil'; tile.dew = false; emit(s, { type: 'drain', x: t.x, y: t.y }); const w = wispAt(s, t.x, t.y); if (w) { w.soaked = false; damageWisp(s, w, 1, 'shivered'); } s.wisps = s.wisps.filter(w => w.hp > 0); } },
    deluge: { name: 'Deluge', keeper: 'rill', text: 'Every soil tile next to you with no plant becomes a puddle.', target: 'none',
      effect(s, k) { for (const d of DIR_LIST) { const x = k.x + DIRS[d][0], y = k.y + DIRS[d][1]; const t = tileAt(s, x, y); if (t && t.terrain === 'soil' && t.plant === 0) makePuddle(s, x, y, false); } } },
    slick: { name: 'Slick', keeper: 'rill', text: 'A soaked Chill within 3 slides in a direction of your choice until it hits something.', target: 'wisp-dir', range: 3, soakedOnly: true,
      effect(s, k, t) { const w = findWisp(s, t.wisp); w.soaked = false; pushWisp(s, w, t.dir, 12); } },
    ripple: { name: 'Ripple', keeper: 'rill', text: 'Choose a puddle within 2. Every Chill next to it is pushed one tile away from it.', target: 'puddle-range', range: 2,
      effect(s, k, t) { const ws = livingWisps(s).filter(w => manhattan(w.x, w.y, t.x, t.y) === 1); for (const w of ws) pushWisp(s, w, dirFromTo(t.x, t.y, w.x, w.y), 1); } },
    thaw: { name: 'Thaw', keeper: 'rill', text: 'A frost tile within 2 melts into a puddle.', target: 'frost-range', range: 2,
      effect(s, k, t) { tileAt(s, t.x, t.y).terrain = 'soil'; emit(s, { type: 'thaw', x: t.x, y: t.y }); makePuddle(s, t.x, t.y, false); } },
    chorus: { name: 'Frog Chorus', keeper: 'rill', text: 'Every plant next to a puddle grows one stage now. Exhaust.', target: 'none', exhaust: true,
      effect(s) { const g = plants(s).filter(p => p.stage < 3 && DIR_LIST.some(d => isPuddle(s, p.x + DIRS[d][0], p.y + DIRS[d][1]))); for (const p of g) growPlant(s, p.x, p.y); } },
    dew: { name: 'Dew', keeper: 'rill', text: 'A soil tile within 2 becomes a puddle until dusk (plants beside it still grow).', target: 'tile-range', range: 2,
      pred: (state) => (t, x, y) => t.terrain === 'soil' && t.plant === 0,
      effect(s, k, t) { makePuddle(s, t.x, t.y, true); } },
    snowmelt: { name: 'Snowmelt', keeper: 'rill', text: 'Every soaked Chill shivers for 1.', target: 'none', needs: 'soaked-any',
      effect(s) { for (const w of livingWisps(s)) if (w.soaked) damageWisp(s, w, 1, 'snowmelt'); s.wisps = s.wisps.filter(w => w.hp > 0); } },
    lilypad: { name: 'Lily Pad', keeper: 'rill', text: 'Make a puddle on a soil tile within 2 with no plant, then leap onto it.', target: 'tile-range', range: 2,
      pred: (state) => (t, x, y) => t.terrain === 'soil' && t.plant === 0 && !wispAt(state, x, y) && !keeperAt(state, x, y),
      effect(s, k, t) { makePuddle(s, t.x, t.y, false); emit(s, { type: 'hop', keeper: k.id, from: [k.x, k.y], to: [t.x, t.y] }); k.x = t.x; k.y = t.y; } },
  };
  function findWisp(s, id) { const w = s.wisps.find(w => w.id === id && w.hp > 0); if (!w) throw new Error('no such wisp'); return w; }
  function makePuddle(s, x, y, temp) {
    const t = tileAt(s, x, y); t.terrain = 'puddle'; t.dew = !!temp;
    emit(s, { type: 'puddle', x, y, temp: !!temp });
    const w = wispAt(s, x, y); if (w) { w.soaked = true; emit(s, { type: 'soak', id: w.id, x, y }); if (w.intent && w.intent.kind === 'move') w.intent = { kind: 'none', dir: null, steps: 0 }; }
  }

  const STARTERS = {
    gale: ['gust', 'gust', 'sweep', 'scatter', 'scatter', 'pollinate', 'dash', 'bluster'],
    rill: ['puddle', 'puddle', 'splash', 'sprinkle', 'sprinkle', 'mist', 'hop', 'drain'],
  };
  const CARD_POOLS = {
    gale: ['updraft', 'crosswind', 'whirl', 'kite', 'tailwind', 'secondwind', 'bait', 'howl', 'gust', 'sweep', 'pollinate'],
    rill: ['deluge', 'slick', 'ripple', 'thaw', 'chorus', 'dew', 'snowmelt', 'lilypad', 'puddle', 'sprinkle', 'mist'],
  };
  const CHARMS = {
    kindling: { name: 'Kindling', text: 'Warmth +2.', apply(s) { s.warmth += 2; } },
    longwick: { name: 'Long Wick', text: 'Both lanterns reach one tile farther.' },
    deeproots: { name: 'Deep Roots', text: 'A bloom that is breathed on withers to a sprout instead of freezing.' },
    tailwind: { name: 'Tailwind', text: 'Gale moves one tile farther.' },
    webbed: { name: 'Webbed Feet', text: 'Rill moves one tile farther.' },
    earlythaw: { name: 'Early Thaw', text: 'At dusk, one frost tile beside a puddle becomes soil.' },
    brightbulbs: { name: 'Bright Bulbs', text: 'Chills go for seeds first whenever they can reach one.' },
    hearthstone: { name: 'Hearthstone', text: 'The first bloom lost each night costs no Warmth.' },
  };

  // Enumerate legal targets for a card in a keeper's hand.
  function cardTargets(state, k, cardId) {
    const c = CARDS[cardId];
    const r = c.range || 1;
    switch (c.target) {
      case 'none':
        if (c.needs === 'wisp-adjacent' && !wispsWithin(state, k, 1).length) return [];
        if (c.needs === 'wisp-range2' && !wispsWithin(state, k, 2).length) return [];
        if (c.needs === 'soaked-any' && !livingWisps(state).some(w => w.soaked)) return [];
        return [{}];
      case 'wisp-adjacent': return wispsWithin(state, k, 1).map(w => ({ wisp: w.id }));
      case 'wisp-range': return wispsWithin(state, k, r).map(w => ({ wisp: w.id }));
      case 'wisp-dir': {
        const out = [];
        for (const w of wispsWithin(state, k, r)) { if (c.soakedOnly && !w.soaked) continue; for (const d of DIR_LIST) out.push({ wisp: w.id, dir: d }); }
        return out;
      }
      case 'dir': return DIR_LIST.map(d => ({ dir: d }));
      case 'tile-range': return tilesWithin(state, k, r, c.pred(state));
      case 'plant-range': return tilesWithin(state, k, r, (t) => t.plant > 0 && c.stage.includes(t.plant));
      case 'plant-move': {
        const out = [];
        for (const p of tilesWithin(state, k, r, (t) => t.plant > 0 && c.stage.includes(t.plant))) {
          for (const d of DIR_LIST) { const x = p.x + DIRS[d][0], y = p.y + DIRS[d][1]; const t = tileAt(state, x, y); if (t && emptySoil(state)(t, x, y)) out.push({ x: p.x, y: p.y, tx: x, ty: y }); }
        }
        return out;
      }
      case 'puddle-any': return tilesWithin(state, k, 99, (t, x, y) => t.terrain === 'puddle' && !wispAt(state, x, y) && !keeperAt(state, x, y) && !(x === k.x && y === k.y));
      case 'puddle-range': return tilesWithin(state, k, r, (t) => t.terrain === 'puddle');
      case 'frost-range': return tilesWithin(state, k, r, (t) => t.terrain === 'frost');

  }

  // ---------- actions ----------
  function newGame(seed, overrides) {

    const state = {
      seed, rng: seed >>> 0, config, phase: 'lobby', night: 0, hour: 0,
      warmth: config.warmth, glow: 0, glowByNight: [], lastBlooms: 0,
      tiles: [], wisps: [], nextWispId: 1, spawns: [], charms: [], draft: null, nightFlags: { firstLoss: false },
      keepers: {}, log: [], events: [], actionCount: 0,

  function validate(state, a) {

    if (a.k === 'pick') {
      if (state.phase !== 'draft') return 'not drafting';
      if (!KEEPER_IDS.includes(a.keeper)) return 'bad keeper';
      if (state.draft.picks[a.keeper] !== null) return 'already picked';
      if (a.index !== -1 && !(a.index >= 0 && a.index < state.draft.offers[a.keeper].length)) return 'bad index';
      return null;
    }
    if (a.k === 'charm') {
      if (state.phase !== 'draft' || !state.draft.charmOffers) return 'no charm to pick';
      if (state.draft.charmPick !== null) return 'already picked';
      if (!(a.index >= 0 && a.index < state.draft.charmOffers.length)) return 'bad index';
      return null;
    }
    if (state.phase !== 'act') return 'not acting';
    if (!KEEPER_IDS.includes(a.keeper)) return 'bad keeper';
    const k = state.keepers[a.keeper];
    if (k.done) return 'already done';
    if (a.k === 'done') return null;
    if (a.k === 'move') {
      if (k.moved) return 'already moved';
      const ok = keeperReach(state, k).some(t => t.x === a.x && t.y === a.y);
      return ok ? null : 'unreachable';
    }
    if (a.k === 'card') {
      if (k.played >= state.config.cardsPerHour) return 'no card plays left';
      if (!(a.hand >= 0 && a.hand < k.hand.length)) return 'bad hand index';
      const cid = k.hand[a.hand];
      const ts = cardTargets(state, k, cid);
      if (!ts.length) return 'no valid target';
      if (!ts.some(t => sameTarget(t, a.target))) return 'bad target';
      return null;
    }
    return 'unknown action';
  }

  function applyAction(prev, a) {
    const err = validate(prev, a);
    if (err) return { state: prev, error: err, events: [] };
    const state = cloneState(prev);
    state.events = [];
    state.actionCount += 1;
    switch (a.k) {
      case 'start': state.night = 1; startNight(state, 0); break;
      case 'pick': state.draft.picks[a.keeper] = a.index; log(state, a.index === -1 ? `${keeperName(a.keeper)} kept their deck as it is.` : `${keeperName(a.keeper)} learned ${CARDS[state.draft.offers[a.keeper][a.index]].name}.`, 'good'); maybeFinishDraft(state); break;
      case 'charm': state.draft.charmPick = a.index; { const c = CHARMS[state.draft.charmOffers[a.index]]; log(state, `The keepers found ${c.name}.`, 'good'); if (c.apply) c.apply(state); } maybeFinishDraft(state); break;

        const k = state.keepers[a.keeper];

        k.played += 1;
        emit(state, { type: 'card', keeper: k.id, card: cid, target: a.target });
        log(state, `${keeperName(k.id)} played ${c.name}${describeTarget(a.target)}.`, k.id);

      }
      case 'done': { const k = state.keepers[a.keeper]; k.done = true; if (KEEPER_IDS.every(id => state.keepers[id].done)) endHour(state); break; }
    }
    return { state, error: null, events: state.events };
  }
  function describeTarget(t) {
    if (!t) return '';
    if (t.tx !== undefined) return ` (${coordName(t.x, t.y)} → ${coordName(t.tx, t.ty)})`;
    if (t.x !== undefined) return ` at ${coordName(t.x, t.y)}`;
    if (t.dir && t.wisp) return ` (${t.dir})`;
    if (t.dir) return ` ${t.dir}`;
    return '';
  }

  // All legal actions for a keeper (for bots / UI).
  function legalActions(state, keeperId) {
    const out = [];
    if (state.phase !== 'act') return out;
    const k = state.keepers[keeperId];
    if (k.done) return out;
    if (!k.moved) for (const t of keeperReach(state, k)) out.push({ k: 'move', keeper: keeperId, x: t.x, y: t.y });
    if (k.played < state.config.cardsPerHour) {
      const seen = new Set();
      k.hand.forEach((cid, hi) => {
        if (seen.has(cid)) return; seen.add(cid);
        for (const t of cardTargets(state, k, cid)) out.push({ k: 'card', keeper: keeperId, hand: hi, target: t });
      });
    }
    out.push({ k: 'done', keeper: keeperId });
    return out;
  }

  // What this viewer may see of a wisp's intent.
  function intentVisibleTo(state, w, viewerId) {
    const r = lanternRadius(state);
    const mine = manhattan(w.x, w.y, state.keepers[viewerId].x, state.keepers[viewerId].y) <= r;
    const other = KEEPER_IDS.find(id => id !== viewerId);
    const theirs = manhattan(w.x, w.y, state.keepers[other].x, state.keepers[other].y) <= r;
    if (mine) return 'mine';
    if (theirs) return state.config.sharedLanterns ? 'mine' : 'partner';
    return 'dark';
  }

  // Replay a log deterministically.
  function replay(seed, config, actions) {
    let s = newGame(seed, config);
    for (const a of actions) { const r = applyAction(s, a); if (r.error) throw new Error('replay error: ' + r.error + ' on ' + JSON.stringify(a)); s = r.state; }
    return s;
  }

  return {
    DIRS, DIR_LIST, OPP, KEEPER_IDS, WISP_TYPES, CARDS, CHARMS, STARTERS, CARD_POOLS, DEFAULT_CONFIG, STAGE_NAME,
    newGame, applyAction, validate, legalActions, replay, cardTargets, keeperReach, keeperSpeed, lanternRadius,
    intentVisibleTo, plants, countBlooms, livingWisps, tileAt, wispAt, keeperAt, coordName, manhattan, cloneState, keeperName, dawnNeed,
    rngNext, rngInt, shuffle,
  };
});

/* ---- bot.js ---- */
/* Two Lanterns — greedy planning bot for both keepers. Used by sim.js and by the
   in-page "solo practice" partner. Pure; depends only on engine.js. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'));
  else root.TLBot = factory(root.TL);
})(typeof self !== 'undefined' ? self : this, function (TL) {
  'use strict';

  const DEFAULT_W = {
    warmth: 100, bloom: 15, sprout: 6, seed: 2, wisp: -4, hoarhp: -3, threat: -2, soaked: 2,
    watered: 2.5, frost: -0.6, lost: -10000, plantsAlive: 1,
  };
  const POLICIES = {
    greedy: DEFAULT_W,
    defend: Object.assign({}, DEFAULT_W, { bloom: 8, sprout: 3, seed: 1, wisp: -8, threat: -4, watered: 0.5 }),
    grow: Object.assign({}, DEFAULT_W, { bloom: 25, sprout: 10, seed: 4, wisp: -1, threat: -1, watered: 4 }),
    // probes: ignore the wisps entirely / ignore growth entirely
    growonly: Object.assign({}, DEFAULT_W, { wisp: 0, hoarhp: 0, threat: 0, soaked: 0 }),
    defendonly: Object.assign({}, DEFAULT_W, { bloom: 0.5, sprout: 0.2, seed: 0.1, watered: 0, plantsAlive: 0.2 }),
  };

  function stripped(state) {
    const s = TL.cloneState(state);
    s.log = []; s.events = [];
    return s;
  }

  // Simulate ending the hour from this state (both keepers done), return the resulting state.
  function simulateEnd(state) {
    let s = stripped(state);
    for (const id of TL.KEEPER_IDS) {
      if (s.keepers[id].done) continue;
      const r = TL.applyAction(s, { k: 'done', keeper: id });
      s = r.state;
    }
    return s;
  }

  function nearestPlantDist(state, w, ps) {
    let best = 99;
    for (const p of ps) { const d = TL.manhattan(w.x, w.y, p.x, p.y); if (d < best) best = d; }
    return best;
  }

  function evaluate(state, W) {
    if (state.phase === 'lost') return W.lost + state.glow;
    let v = state.warmth * W.warmth + state.glow * 10;
    const ps = TL.plants(state);
    for (const p of ps) {
      v += p.stage === 3 ? W.bloom : p.stage === 2 ? W.sprout : W.seed;
      v += W.plantsAlive;
      if (p.stage < 3 && TL.DIR_LIST.some(d => { const t = TL.tileAt(state, p.x + TL.DIRS[d][0], p.y + TL.DIRS[d][1]); return t && t.terrain === 'puddle'; })) v += W.watered;
    }
    for (const w of state.wisps) {
      if (w.hp <= 0) continue;
      v += W.wisp;
      if (w.type === 'hoar') v += W.hoarhp * (w.hp - 1);
      const d = nearestPlantDist(state, w, ps);
      if (d < 4) v += W.threat * (4 - d);
      if (w.soaked) v += W.soaked;

    for (const t of state.tiles) if (t.terrain === 'frost') v += W.frost;

  }

  function scoreAfter(state, W) { return evaluate(simulateEnd(state), W); }

  // Choose one action for keeper `id` with a 2-ply lookahead (second ply: any own action).
  function chooseAction(state, id, opts) {
    const W = (opts && opts.weights) || DEFAULT_W;
    const rnd = (opts && opts.random) || Math.random;
    const topN = (opts && opts.topN) || 10;
    const acts = TL.legalActions(state, id);
    if (!acts.length) return null;
    if (acts.length === 1) return acts[0];
    const scored = [];
    for (const a of acts) {
      const r = TL.applyAction(state, a);
      if (r.error) continue;
      scored.push({ a, s: r.state, v: scoreAfter(r.state, W) + rnd() * 0.01 });
    }
    scored.sort((p, q) => q.v - p.v);
    const cut = scored.slice(0, topN);
    let best = null, bestV = -Infinity;
    for (const c of cut) {
      let v2 = c.v;
      if (c.a.k !== 'done' && c.s.phase === 'act') {
        const next = TL.legalActions(c.s, id);
        for (const b of next) {
          if (b.k === 'done') continue;
          const r2 = TL.applyAction(c.s, b);
          if (r2.error) continue;
          const v = scoreAfter(r2.state, W);
          if (v > v2) v2 = v;
        }
      }
      if (v2 > bestV) { bestV = v2; best = c.a; }
    }
    return best;
  }

  // Play a whole hour for both keepers, interleaving: the keeper whose best action scores higher goes first.
  function playHour(state, opts) {
    let s = state;
    let guard = 0;
    while (s.phase === 'act' && guard++ < 40) {
      const ids = TL.KEEPER_IDS.filter(id => !s.keepers[id].done);
      if (!ids.length) break;
      // pick the keeper with the more valuable next action
      let pick = null;
      for (const id of ids) {
        const a = chooseAction(s, id, opts);
        if (!a) continue;
        const r = TL.applyAction(s, a);
        const v = scoreAfter(r.state, (opts && opts.weights) || DEFAULT_W);
        if (!pick || v > pick.v) pick = { id, a, v, s: r.state };
      }
      if (!pick) break;
      s = pick.s;
    }
    return s;
  }

  function draft(state, opts) {
    let s = state;
    const rnd = (opts && opts.random) || Math.random;
    for (const id of TL.KEEPER_IDS) {
      if (s.draft && s.draft.picks[id] === null) {
        const offers = s.draft.offers[id];
        const pref = (opts && opts.draftPref) || {};
        let bi = 0, bv = -Infinity;
        offers.forEach((c, i) => { const v = (pref[c] || 0) + rnd(); if (v > bv) { bv = v; bi = i; } });
        s = TL.applyAction(s, { k: 'pick', keeper: id, index: bi }).state;
      }
    }
    if (s.draft && s.draft.charmOffers && s.draft.charmPick === null) {
      s = TL.applyAction(s, { k: 'charm', keeper: 'gale', index: Math.floor(rnd() * s.draft.charmOffers.length) }).state;
    }
    return s;
  }

  function playRun(seed, opts) {
    let s = TL.newGame(seed, opts && opts.config);
    s = TL.applyAction(s, { k: 'start' }).state;
    const stats = { cards: {}, hoursPlayed: 0 };
    let guard = 0;
    while (s.phase !== 'won' && s.phase !== 'lost' && guard++ < 400) {
      if (s.phase === 'draft') { s = draft(s, opts); continue; }
      if (s.phase === 'act') {
        const before = s.actionCount;
        s = playHour(s, opts);
        stats.hoursPlayed++;
        for (const l of s.log.slice(-40)) { const m = /^(Gale|Rill) played ([A-Za-z ]+?)( at | \(|\.| [NESW]$)/.exec(l.text); if (m) stats.cards[m[2]] = (stats.cards[m[2]] || 0) + 1; }
        continue;
      }
      break;
    }
    return { state: s, stats };
  }

  return { evaluate, simulateEnd, chooseAction, playHour, playRun, draft, POLICIES, DEFAULT_W };
});

 *   const net = TwoLanternsNet.create({

 *     onMessage(obj) {},            // parsed JSON object from the other side

        var type = err && err.type;
        if (SIGNAL_DOWN_TYPES[type] || FATAL_PEER_TYPES[type]) finish(errorFromPeerError(err));
      }

      p.on('error', onErr);
      p.on('disconnected', onDisc);
    }

    function guestAttempt() {
      if (closed || attempting) return;
      attempting = true;
      attemptNo++;
