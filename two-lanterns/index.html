    splash: { name: 'Splash', keeper: 'rill', text: 'Push an adjacent Chill one tile away from you.', target: 'wisp-adjacent',
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, dirFromTo(k.x, k.y, w.x, w.y), 1); } },
    sprinkle: { name: 'Sprinkle', keeper: 'rill', text: 'A plant within 3 grows one stage.', target: 'plant-range', range: 3, stage: [1, 2],
      effect(s, k, t) { growPlant(s, t.x, t.y); } },
    mist: { name: 'Mist', keeper: 'rill', text: 'A Chill within 2 forgets its intent this hour.', target: 'wisp-range', range: 2,
      effect(s, k, t) { const w = findWisp(s, t.wisp); w.intent = { kind: 'none', dir: null, steps: 0 }; emit(s, { type: 'calm', id: w.id, x: w.x, y: w.y }); } },
    hop: { name: 'Hop', keeper: 'rill', text: 'Leap to any empty puddle on the board.', target: 'puddle-any',
      effect(s, k, t) { emit(s, { type: 'hop', keeper: k.id, from: [k.x, k.y], to: [t.x, t.y] }); k.x = t.x; k.y = t.y; } },
    drain: { name: 'Drain', keeper: 'rill', text: 'Remove a puddle within 2. A Chill soaking in it shivers for 1.', target: 'puddle-range', range: 2,
      effect(s, k, t) { const tile = tileAt(s, t.x, t.y); tile.terrain = 'soil'; delete tile.life; emit(s, { type: 'drain', x: t.x, y: t.y }); const w = wispAt(s, t.x, t.y); if (w) { emit(s, { type: 'drainWisp', id: w.id, x: w.x, y: w.y }); const soaked = w.soaked; dryWisp(s, w); if (soaked) damageWisp(s, w, 1, 'shivered'); } s.wisps = s.wisps.filter(w => w.hp > 0); } },
    deluge: { name: 'Deluge', keeper: 'rill', text: 'Every soil tile next to you with no plant becomes a life-2 puddle.', target: 'none',
      effect(s, k) { for (const d of DIR_LIST) { const x = k.x + DIRS[d][0], y = k.y + DIRS[d][1]; const t = tileAt(s, x, y); if (t && t.terrain === 'soil' && t.plant === 0) makePuddle(s, x, y); } } },
    slick: { name: 'Slick', keeper: 'rill', text: 'A soaked Chill within 3 slides in a direction of your choice until it hits something.', target: 'wisp-dir', range: 3, soakedOnly: true,
      effect(s, k, t) { const w = findWisp(s, t.wisp); pushWisp(s, w, t.dir, 12); } },
    ripple: { name: 'Ripple', keeper: 'rill', text: 'Choose a puddle within 2. Every Chill next to it is pushed one tile away from it.', target: 'puddle-range', range: 2,
      effect(s, k, t) { const ws = livingWisps(s).filter(w => manhattan(w.x, w.y, t.x, t.y) === 1); for (const w of ws) pushWisp(s, w, dirFromTo(t.x, t.y, w.x, w.y), 1); } },
    thaw: { name: 'Thaw', keeper: 'rill', text: 'A frost tile within 2 melts into a life-2 puddle.', target: 'frost-range', range: 2,
      effect(s, k, t) { tileAt(s, t.x, t.y).terrain = 'soil'; emit(s, { type: 'thaw', x: t.x, y: t.y }); makePuddle(s, t.x, t.y); } },
    chorus: { name: 'Frog Chorus', keeper: 'rill', text: 'Each puddle waters one plant now: highest stage below bloom, nearest Rill, then reading order. Exhaust.', target: 'none', exhaust: true,
      effect(s) { irrigate(s); } },
    dew: { name: 'Dew', keeper: 'rill', text: 'Every seed next to a puddle becomes a sprout now.', target: 'none',
      effect(s) { for (const p of plants(s)) if (p.stage === 1 && DIR_LIST.some(d => isPuddle(s, p.x + DIRS[d][0], p.y + DIRS[d][1]))) growPlant(s, p.x, p.y); } },
    backwash: { name: 'Backwash', keeper: 'rill', text: 'Every soaked Chill shivers for 1. Chills Gale pushed this hour count as soaked for this card.', target: 'none', needs: 'backwash-any',
      effect(s) { for (const w of livingWisps(s)) if (w.soaked || flagged(s, 'galePushed', w.id)) damageWisp(s, w, 1, 'backwash'); s.wisps = s.wisps.filter(w => w.hp > 0); } },
    drinkdeep: { name: 'Drink Deep', keeper: 'rill', text: 'A plant within 2 grows one stage. If Gale planted or moved that plant this hour, it grows two.', target: 'plant-range', range: 2, stage: [1, 2],
      effect(s, k, t) { growPlant(s, t.x, t.y); if (flagged(s, 'galePlanted', tileKey(t.x, t.y))) growPlant(s, t.x, t.y); } },
    lilypad: { name: 'Lily Pad', keeper: 'rill', text: 'Make a life-2 puddle on a soil tile within 2 with no plant, then leap onto it.', target: 'tile-range', range: 2,
      pred: (state) => (t, x, y) => t.terrain === 'soil' && t.plant === 0 && !wispAt(state, x, y) && !keeperAt(state, x, y),
      effect(s, k, t) { makePuddle(s, t.x, t.y); emit(s, { type: 'hop', keeper: k.id, from: [k.x, k.y], to: [t.x, t.y] }); k.x = t.x; k.y = t.y; } },
  };
  function findWisp(s, id) { const w = s.wisps.find(w => w.id === id && w.hp > 0); if (!w) throw new Error('no such wisp'); return w; }
  function makePuddle(s, x, y) {
    const t = tileAt(s, x, y); t.terrain = 'puddle'; t.life = 2;
    emit(s, { type: 'puddle', x, y, life: 2 });
    const w = wispAt(s, x, y); if (w) { soakWisp(s, w); if (w.intent && w.intent.kind === 'move') w.intent = { kind: 'none', dir: null, steps: 0 }; }
  }

  const STARTERS = {
    gale: ['gust', 'followingwind', 'sweep', 'scatter', 'scatter', 'pollinate', 'dash', 'bluster'],
    rill: ['puddle', 'puddle', 'splash', 'sprinkle', 'drinkdeep', 'mist', 'hop', 'drain'],
  };
  const CARD_POOLS = {
    gale: ['updraft', 'crosswind', 'whirl', 'kite', 'followingwind', 'seedwind', 'secondwind', 'bait', 'howl', 'gust', 'sweep', 'pollinate'],
    rill: ['deluge', 'slick', 'ripple', 'thaw', 'chorus', 'dew', 'backwash', 'drinkdeep', 'lilypad', 'puddle', 'sprinkle', 'mist'],
  };
  const CHARMS = {
    kindling: { name: 'Kindling', text: 'Warmth +2.', apply(s) { s.warmth += 2; } },
    longwick: { name: 'Long Wick', text: 'Both lanterns reach one tile farther.' },
    deeproots: { name: 'Deep Roots', text: 'Once per night, the first bloom that would freeze withers to a sprout instead, with no Warmth loss. It cannot grow at that dusk; immediate growth cards still work.' },
    tailwind: { name: 'Tailwind', text: 'Gale moves one tile farther.' },
    webbed: { name: 'Webbed Feet', text: 'Rill moves one tile farther.' },
    earlythaw: { name: 'Early Thaw', text: 'At dusk, one frost tile beside a puddle becomes soil.' },
    brightbulbs: { name: 'Bright Bulbs', text: 'Chills go for seeds first whenever they can reach one.' },
    mossystones: { name: 'Mossy Stones', text: 'A Chill that bumps into stone takes 2 damage instead of 1.' },
  };

  // Enumerate legal targets for a card in a keeper's hand.
  function cardTargets(state, k, cardId) {
    const c = CARDS[cardId];
    const r = c.range || 1;
    switch (c.target) {
      case 'none':
        if (c.needs === 'wisp-adjacent' && !wispsWithin(state, k, 1).length) return [];
        if (c.needs === 'wisp-range2' && !wispsWithin(state, k, 2).length) return [];
        if (c.needs === 'soaked-any' && !livingWisps(state).some(w => w.soaked)) return [];
        if (c.needs === 'backwash-any' && !livingWisps(state).some(w => w.soaked || flagged(state, 'galePushed', w.id))) return [];
        return [{}];
      case 'wisp-adjacent': return wispsWithin(state, k, 1).flatMap(w => {
        const targets = [{ wisp: w.id }];
        if (cardId === 'followingwind' && flagged(state, 'rillTouched', w.id)) for (const dir of DIR_LIST) targets.push({ wisp: w.id, dir });
        return targets;
      });
      case 'wisp-range': return wispsWithin(state, k, r).map(w => ({ wisp: w.id }));
      case 'wisp-dir': {
        const out = [];
        for (const w of wispsWithin(state, k, r)) { if (c.soakedOnly && !w.soaked) continue; for (const d of DIR_LIST) out.push({ wisp: w.id, dir: d }); }
        return out;
      }
      case 'dir': return DIR_LIST.map(d => ({ dir: d }));
      case 'tile-range': return tilesWithin(state, k, r, c.pred(state));
      case 'seed-pair': {
        const soil = tilesWithin(state, k, r, emptySoil(state));
        const seconds = seedWindBonusTiles(state);
        const out = [];
        for (const p of soil) {
          const available = seconds.filter(q => p.x !== q.x || p.y !== q.y);
          if (!available.length) out.push(p);
          else for (const q of available) out.push({ x: p.x, y: p.y, tx: q.x, ty: q.y });
        }
        return out;
      }
      case 'plant-range': return tilesWithin(state, k, r, (t) => t.plant > 0 && c.stage.includes(t.plant));
      case 'plant-move': {
        const out = [];
        for (const p of tilesWithin(state, k, r, (t) => t.plant > 0 && c.stage.includes(t.plant))) {
          for (const d of DIR_LIST) { const x = p.x + DIRS[d][0], y = p.y + DIRS[d][1]; const t = tileAt(state, x, y); if (t && emptySoil(state)(t, x, y)) out.push({ x: p.x, y: p.y, tx: x, ty: y }); }
        }
        return out;
      }
      case 'puddle-any': return tilesWithin(state, k, 99, (t, x, y) => t.terrain === 'puddle' && !wispAt(state, x, y) && !keeperAt(state, x, y) && !(x === k.x && y === k.y));
      case 'puddle-range': return tilesWithin(state, k, r, (t) => t.terrain === 'puddle');
      case 'frost-range': return tilesWithin(state, k, r, (t) => t.terrain === 'frost');
    }
    return [];
  }
  function seedWindBonusTiles(state) {
    return tilesWithin(state, state.keepers.gale, 99, (t, x, y) => emptySoil(state)(t, x, y) &&
      DIR_LIST.some(d => {
        const px = x + DIRS[d][0], py = y + DIRS[d][1];
        return isPuddle(state, px, py) && flagged(state, 'rillWatered', tileKey(px, py));
      }));
  }
  function partnerBonusTargets(state, cardId, keeper) {
    const k = typeof keeper === 'string' ? state.keepers[keeper] : keeper || state.keepers[CARDS[cardId].keeper];
    if (cardId === 'followingwind') return cardTargets(state, k, cardId).filter(t => flagged(state, 'rillTouched', t.wisp));
    if (cardId === 'backwash') return livingWisps(state).filter(w => flagged(state, 'galePushed', w.id)).map(w => ({ wisp: w.id }));
    if (cardId === 'drinkdeep') return cardTargets(state, k, cardId).filter(t => flagged(state, 'galePlanted', tileKey(t.x, t.y)));
    if (cardId === 'seedwind') return seedWindBonusTiles(state);
    return [];
  }
  function bonusTargets(state, keeper, cardId) { return partnerBonusTargets(state, cardId, keeper); }
  function transplantTargets(state, keeper) {
    const k = typeof keeper === 'string' ? state.keepers[keeper] : keeper;
    if (!k || k.played >= state.config.cardsPerHour || k.done || state.phase !== 'act') return [];
    const out = [];
    for (const p of tilesWithin(state, k, 1, t => t.plant > 0)) {
      for (const d of DIR_LIST) {
        const x = p.x + DIRS[d][0], y = p.y + DIRS[d][1], t = tileAt(state, x, y);
        if (t && emptySoil(state)(t, x, y)) out.push({ k: 'transplant', keeper: k.id, x: p.x, y: p.y, tx: x, ty: y });
      }
    }
    return out;
  }
  function movePlantFlag(state, x, y, tx, ty) {
    const from = tileAt(state, x, y), to = tileAt(state, tx, ty);
    delete to.recoveryNight; delete to.recoveryHour;
    if (from.recoveryNight !== undefined) {
      to.recoveryNight = from.recoveryNight; to.recoveryHour = from.recoveryHour;
    }
    delete from.recoveryNight; delete from.recoveryHour;
    const old = tileKey(x, y), had = flagged(state, 'galePlanted', old);
    state.hourFlags.galePlanted = (state.hourFlags.galePlanted || []).filter(key => key !== old);
    if (had) addFlag(state, 'galePlanted', tileKey(tx, ty));
  }
  function sameTarget(a, b) { return JSON.stringify(a || {}) === JSON.stringify(b || {}); }

  // ---------- actions ----------
  function newGame(seed, overrides) {
    const config = Object.assign(difficultyConfig(overrides && overrides.difficulty), overrides || {});
    const state = {
      seed, rng: seed >>> 0, config, phase: 'lobby', night: 0, hour: 0,
      warmth: config.warmth, glow: 0, glowByNight: [], lastBlooms: 0,
      tiles: [], wisps: [], nextWispId: 1, spawns: [], charms: [], draft: null, nightFlags: { deepRootsUsed: false },
      hourFlags: freshHourFlags(), frontColumn: 0, frontSide: null, stream: null, streamDirection: null, weatherByNight: {},
      keepers: {}, log: [], events: [], actionCount: 0,
    };
    for (const id of KEEPER_IDS) {
      state.keepers[id] = { id, x: 0, y: 0, frosted: false, moved: false, played: 0, done: false, dashBonus: 0, keep: null,
        collection: STARTERS[id].slice(), deck: [], hand: [], discard: [], exhausted: [] };
    }
    return state;
  }

  function validate(state, a) {
    if (!a || typeof a !== 'object') return 'bad action';
    if (a.k === 'start') return state.phase === 'lobby' ? null : 'already started';
    if (a.k === 'pick') {
      if (state.phase !== 'draft') return 'not drafting';
      if (!KEEPER_IDS.includes(a.keeper)) return 'bad keeper';
      if (state.draft.picks[a.keeper] !== null) return 'already picked';
      if (a.index !== -1 && !(a.index >= 0 && a.index < state.draft.offers[a.keeper].length)) return 'bad index';
      return null;
    }
    if (a.k === 'charm') {
      if (state.phase !== 'draft' || !state.draft.charmOffers) return 'no charm to pick';
      if (state.draft.charmPick !== null) return 'already picked';
      if (!(a.index >= 0 && a.index < state.draft.charmOffers.length)) return 'bad index';
      return null;
    }
    if (state.phase !== 'act') return 'not acting';
    if (!KEEPER_IDS.includes(a.keeper)) return 'bad keeper';
    const k = state.keepers[a.keeper];
    if (k.done) return 'already done';
    if (a.k === 'done') return null;
    if (a.k === 'keep') return Number.isInteger(a.hand) && a.hand >= 0 && a.hand < k.hand.length ? null : 'bad hand index';
    if (a.k === 'transplant') {
      if (k.played >= state.config.cardsPerHour) return 'no card plays left';
      return transplantTargets(state, k).some(t => t.x === a.x && t.y === a.y && t.tx === a.tx && t.ty === a.ty) ? null : 'bad transplant target';
    }
    if (a.k === 'move') {
      if (k.moved) return 'already moved';
      const ok = keeperReach(state, k).some(t => t.x === a.x && t.y === a.y);
      return ok ? null : 'unreachable';
    }
    if (a.k === 'card') {
      if (k.played >= state.config.cardsPerHour) return 'no card plays left';
      if (!(a.hand >= 0 && a.hand < k.hand.length)) return 'bad hand index';
      const cid = k.hand[a.hand];
      const ts = cardTargets(state, k, cid);
      if (!ts.length) return 'no valid target';
      if (!ts.some(t => sameTarget(t, a.target))) return 'bad target';
      return null;
    }
    return 'unknown action';
  }

  function applyAction(prev, a) {
    const err = validate(prev, a);
    if (err) return { state: prev, error: err, events: [] };
    const state = cloneState(prev);
    state.events = [];
    state.actionCount += 1;
    switch (a.k) {
      case 'start': state.night = 1; startNight(state, 0); break;
      case 'pick': state.draft.picks[a.keeper] = a.index; log(state, a.index === -1 ? `${keeperName(a.keeper)} kept their deck as it is.` : `${keeperName(a.keeper)} learned ${CARDS[state.draft.offers[a.keeper][a.index]].name}.`, 'good'); maybeFinishDraft(state); break;
      case 'charm': state.draft.charmPick = a.index; { const c = CHARMS[state.draft.charmOffers[a.index]]; log(state, `The keepers found ${c.name}.`, 'good'); if (c.apply) c.apply(state); } maybeFinishDraft(state); break;
      case 'move': { const k = state.keepers[a.keeper]; emit(state, { type: 'keeperMove', keeper: k.id, from: [k.x, k.y], to: [a.x, a.y] }); k.x = a.x; k.y = a.y; k.moved = true; break; }
      case 'keep': {
        const k = state.keepers[a.keeper]; k.keep = k.keep === a.hand ? null : a.hand;
        emit(state, { type: 'keep', keeper: k.id, hand: k.keep });
        break;
      }
      case 'transplant': {
        const k = state.keepers[a.keeper], from = tileAt(state, a.x, a.y), stage = Math.min(from.plant, 2);
        from.plant = 0; k.played += 1;
        movePlantFlag(state, a.x, a.y, a.tx, a.ty);
        placePlant(state, a.tx, a.ty, stage);
        if (k.id === 'gale') addFlag(state, 'galePlanted', tileKey(a.tx, a.ty));
        emit(state, { type: 'carry', keeper: k.id, from: [a.x, a.y], to: [a.tx, a.ty], transplant: true });
        log(state, `${keeperName(k.id)} transplanted ${coordName(a.x, a.y)} to ${coordName(a.tx, a.ty)}.`, k.id);
        break;
      }
      case 'card': {
        const k = state.keepers[a.keeper];
        const cid = k.hand[a.hand];
        const c = CARDS[cid];
        k.hand.splice(a.hand, 1);
        if (k.keep === a.hand) k.keep = null; else if (k.keep !== null && k.keep > a.hand) k.keep -= 1;
        if (c.exhaust) k.exhausted.push(cid); else k.discard.push(cid);
        k.played += 1;
        emit(state, { type: 'card', keeper: k.id, card: cid, target: a.target });
        log(state, `${keeperName(k.id)} played ${c.name}${describeTarget(a.target)}.`, k.id);
        c.effect(state, k, a.target || {});
        // Derive per-target partner bonuses from actual effects, including bumps.
        for (const e of state.events) {
          if (k.id === 'gale') {
            if (e.type === 'slide' || e.type === 'bump') addFlag(state, 'galePushed', e.id);
            if (e.type === 'plant') addFlag(state, 'galePlanted', tileKey(e.x, e.y));
          } else {
            if (e.type === 'puddle') addFlag(state, 'rillWatered', tileKey(e.x, e.y));
            if (['slide', 'bump', 'soak', 'drainWisp', 'calm'].includes(e.type)) addFlag(state, 'rillTouched', e.id);
          }
        }
        state.wisps = state.wisps.filter(w => w.hp > 0);
        break;
      }
      case 'done': { const k = state.keepers[a.keeper]; k.done = true; if (KEEPER_IDS.every(id => state.keepers[id].done)) endHour(state); break; }
    }
    return { state, error: null, events: state.events };
  }
  function describeTarget(t) {
    if (!t) return '';
    if (t.tx !== undefined) return ` (${coordName(t.x, t.y)} → ${coordName(t.tx, t.ty)})`;
    if (t.x !== undefined) return ` at ${coordName(t.x, t.y)}`;
    if (t.dir && t.wisp) return ` (${t.dir})`;
    if (t.dir) return ` ${t.dir}`;
    return '';
  }

  // All legal actions for a keeper (for bots / UI).
  function legalActions(state, keeperId) {
    const out = [];
    if (state.phase !== 'act') return out;
    const k = state.keepers[keeperId];
    if (k.done) return out;
    k.hand.forEach((cid, hand) => out.push({ k: 'keep', keeper: keeperId, hand }));
    out.push(...transplantTargets(state, k));
    if (!k.moved) for (const t of keeperReach(state, k)) out.push({ k: 'move', keeper: keeperId, x: t.x, y: t.y });
    if (k.played < state.config.cardsPerHour) {
      const seen = new Set();
      k.hand.forEach((cid, hi) => {
        if (seen.has(cid)) return; seen.add(cid);
        for (const t of cardTargets(state, k, cid)) out.push({ k: 'card', keeper: keeperId, hand: hi, target: t });
      });
    }
    out.push({ k: 'done', keeper: keeperId });
    return out;
  }

  // What this viewer may see of a wisp's intent.
  function intentVisibleTo(state, w, viewerId) {
    const r = lanternRadius(state);
    const mine = manhattan(w.x, w.y, state.keepers[viewerId].x, state.keepers[viewerId].y) <= r;
    const other = KEEPER_IDS.find(id => id !== viewerId);
    const theirs = manhattan(w.x, w.y, state.keepers[other].x, state.keepers[other].y) <= r;
    if (mine || plantGlowVisible(state, w)) return 'mine';
    if (theirs) return state.config.sharedLanterns ? 'mine' : 'partner';
    return 'dark';
  }

  // Replay a log deterministically.
  function replay(seed, config, actions) {
    let s = newGame(seed, config);
    for (const a of actions) { const r = applyAction(s, a); if (r.error) throw new Error('replay error: ' + r.error + ' on ' + JSON.stringify(a)); s = r.state; }
    return s;
  }

  return {
    DIRS, DIR_LIST, OPP, KEEPER_IDS, WISP_TYPES, CARDS, CHARMS, STARTERS, CARD_POOLS, DEFAULT_CONFIG, STAGE_NAME,
    newGame, applyAction, validate, legalActions, replay, cardTargets, keeperReach, keeperSpeed, lanternRadius,
    intentVisibleTo, wispVisibleTo, wailLane, glowRank, plants, countBlooms, livingWisps, tileAt, wispAt, keeperAt, coordName, manhattan, cloneState, keeperName, dawnNeed,
    rngNext, rngInt, shuffle, wateringPlan, transplantTargets, partnerBonusTargets, bonusTargets,
    weatherInfo, difficultyConfig, windDirection, frontHours, fickleChance, spawnTypeVisible,
  };
});

<script>
/* ---- bot.js ---- */
/* Two Lanterns — greedy planning bot for both keepers. Used by sim.js and by the
   in-page "solo practice" partner. Pure; depends only on engine.js. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./engine.js'));
  else root.TLBot = factory(root.TL);
})(typeof self !== 'undefined' ? self : this, function (TL) {
  'use strict';

  const DEFAULT_W = {
    warmth: 100, bloom: 15, sprout: 6, seed: 2, wisp: -4, hoarhp: -3, threat: -2, soaked: 0.75,
    watered: 2.5, frost: -0.6, lost: -10000, plantsAlive: 1,
  };
  const POLICIES = {
    greedy: DEFAULT_W,
    defend: Object.assign({}, DEFAULT_W, { bloom: 8, sprout: 3, seed: 1, wisp: -8, threat: -4, watered: 0.5 }),
    grow: Object.assign({}, DEFAULT_W, { bloom: 25, sprout: 10, seed: 4, wisp: -1, threat: -1, watered: 4 }),
    // probes: ignore the wisps entirely / ignore growth entirely
    growonly: Object.assign({}, DEFAULT_W, { wisp: 0, hoarhp: 0, threat: 0, soaked: 0 }),
    defendonly: Object.assign({}, DEFAULT_W, { bloom: 0.5, sprout: 0.2, seed: 0.1, watered: 0, plantsAlive: 0.2 }),
  };

  function stripped(state) {
    const s = TL.cloneState(state);
    s.log = []; s.events = [];
    return s;
  }

  // Simulate ending the hour from this state (both keepers done), return the resulting state.
  function simulateEnd(state) {
    let s = stripped(state);
    for (const id of TL.KEEPER_IDS) {
      if (s.keepers[id].done) continue;
      const r = TL.applyAction(s, { k: 'done', keeper: id });
      s = r.state;
    }
    return s;
  }

  function nearestTargetDist(w, targets) {
    let best = 99;
    for (const p of targets) { const d = TL.manhattan(w.x, w.y, p.x, p.y); if (d < best) best = d; }
    return best;
  }

  function evaluate(state, W) {
    if (state.phase === 'lost') return W.lost + state.glow;
    let v = state.warmth * W.warmth + state.glow * 10;
    const ps = TL.plants(state);
    const water = [];
    state.tiles.forEach((t, i) => {
      if (t.terrain === 'puddle') water.push({ x: i % state.config.W, y: Math.floor(i / state.config.W) });
    });
    // Each puddle allocates just one pulse; two puddles selecting the same
    // plant do not double its growth. Preserve the life-1 seed discount.
    const irrigated = new Map();
    for (const q of TL.wateringPlan(state)) {
      const t = TL.tileAt(state, q.x, q.y);
      const key = q.tx + ',' + q.ty;
      irrigated.set(key, Math.max(irrigated.get(key) || 0, t.life === undefined ? 2 : t.life));
    }
    for (const p of ps) {
      v += p.stage === 3 ? W.bloom : p.stage === 2 ? W.sprout : W.seed;
      v += W.plantsAlive;
      if (p.stage < 3) {
        // Credit only the growth pulses still available: a one-dusk puddle
        // cannot finish a seed, while a pond or two-dusk puddle can.
        const pulses = irrigated.get(p.x + ',' + p.y) || 0;
        v += W.watered * Math.min(1, pulses / (3 - p.stage));
      }
    }
    for (const w of state.wisps) {
      if (w.hp <= 0) continue;
      v += W.wisp;
      if (w.type === 'hoar') v += W.hoarhp * (w.hp - 1);
      // Sleet threatens irrigation, never the plants directly.
      const d = nearestTargetDist(w, w.type === 'sleet' ? water : ps);
      if (d < 4) v += W.threat * (4 - d);
      // A Wail can threaten from three tiles away. Read its actual fixed lane
      // so a sideways push or a keeper shield removes that immediate threat.
      if (w.intent && w.intent.kind === 'wail') {
        const end = TL.wailLane(state, w).at(-1);
        const stage = end && TL.tileAt(state, end.x, end.y).plant;
        if (stage) v += W.threat * stage;
      }
      if (w.soaked) v += W.soaked; // one delayed activation, not a permanent trap
    }
    for (const t of state.tiles) if (t.terrain === 'frost') v += W.frost;
    return v;
  }

  function scoreAfter(state, W, origin) {
    // Done may already have resolved the hour. Compare every candidate at the
    // same dusk instead of giving that action an extra enemy activation.
    const advanced = state.phase !== 'act' || state.night !== origin.night || state.hour !== origin.hour;
    return evaluate(advanced ? state : simulateEnd(state), W);
  }

  // Choose one action for keeper `id` with a 2-ply lookahead (second ply: any own action).
  function chooseAction(state, id, opts) {
    const W = (opts && opts.weights) || DEFAULT_W;
    const rnd = (opts && opts.random) || Math.random;
    const topN = (opts && opts.topN) || 10;
    // Pins are chosen when ready to finish. Searching free pin toggles as
    // tactical moves otherwise creates score-neutral loops.
    const acts = TL.legalActions(state, id).filter(a => a.k !== 'keep');
    if (!acts.length) return null;
    if (acts.length === 1) return finishWithPin(state, id, acts[0], W);
    const scored = [];
    for (const a of acts) {
      const r = TL.applyAction(state, a);
      if (r.error) continue;
      scored.push({ a, s: r.state, v: scoreAfter(r.state, W, state) + rnd() * 0.01 });
    }
    scored.sort((p, q) => q.v - p.v);
    const cut = scored.slice(0, topN);
    let best = null, bestV = -Infinity;
    for (const c of cut) {
      let v2 = c.v;
      if (c.a.k !== 'done' && c.s.phase === 'act') {
        const next = TL.legalActions(c.s, id);
        for (const b of next) {
          if (b.k === 'done' || b.k === 'keep') continue;
          const r2 = TL.applyAction(c.s, b);
          if (r2.error) continue;
          const v = scoreAfter(r2.state, W, state);
          if (v > v2) v2 = v;
        }
      }
      if (v2 > bestV) { bestV = v2; best = c.a; }
    }
    return finishWithPin(state, id, best, W);
  }

  function finishWithPin(state, id, action, W) {
    if (!action || action.k !== 'done') return action;
    const k = state.keepers[id];
    if (!k.hand.length) return action;
    const growth = new Set(['scatter', 'pollinate', 'seedwind', 'puddle', 'deluge', 'sprinkle', 'drinkdeep', 'chorus', 'dew']);
    const utility = { kite: 3, lilypad: 3, secondwind: 3, sweep: 4, crosswind: 4, ripple: 3, mist: 2, bluster: 2 };
    let best = 0, bestValue = -Infinity;
    k.hand.forEach((cid, hand) => {
      const targets = TL.cardTargets(state, k, cid);
      const value = (utility[cid] || 1) + (growth.has(cid) ? W.bloom / 5 : -W.wisp / 4) + (targets.length ? 0.5 : 0);
      if (value > bestValue) { bestValue = value; best = hand; }
    });
    return k.keep === best ? action : { k: 'keep', keeper: id, hand: best };
  }

  // Play a whole hour for both keepers, interleaving: the keeper whose best action scores higher goes first.
  function playHour(state, opts) {
    let s = state;
    let guard = 0;
    while (s.phase === 'act' && s.night === state.night && s.hour === state.hour && guard++ < 40) {
      const ids = TL.KEEPER_IDS.filter(id => !s.keepers[id].done);
      if (!ids.length) break;
      // pick the keeper with the more valuable next action
      let pick = null;
      for (const id of ids) {
        const a = chooseAction(s, id, opts);
        if (!a) continue;
        const r = TL.applyAction(s, a);
        const v = scoreAfter(r.state, (opts && opts.weights) || DEFAULT_W, s);
        if (!pick || v > pick.v) pick = { id, a, v, s: r.state };
      }
      if (!pick) break;
      if (opts && opts.stats && pick.a.k === 'card') {
        const name = TL.CARDS[s.keepers[pick.id].hand[pick.a.hand]].name;
        opts.stats.cards[name] = (opts.stats.cards[name] || 0) + 1;
      }
      s = pick.s;
    }
    return s;
  }

  function draft(state, opts) {
    let s = state;
    const rnd = (opts && opts.random) || Math.random;
    for (const id of TL.KEEPER_IDS) {
      if (s.draft && s.draft.picks[id] === null) {
        const offers = s.draft.offers[id];
        const pref = (opts && opts.draftPref) || {};
        let bi = 0, bv = -Infinity;
        offers.forEach((c, i) => { const v = (pref[c] || 0) + rnd(); if (v > bv) { bv = v; bi = i; } });
        s = TL.applyAction(s, { k: 'pick', keeper: id, index: bi }).state;
      }
    }
    if (s.draft && s.draft.charmOffers && s.draft.charmPick === null) {
      s = TL.applyAction(s, { k: 'charm', keeper: 'gale', index: Math.floor(rnd() * s.draft.charmOffers.length) }).state;
    }
    return s;
  }

  function playRun(seed, opts) {
    let s = TL.newGame(seed, opts && opts.config);
    s = TL.applyAction(s, { k: 'start' }).state;
    const stats = { cards: {}, hoursPlayed: 0 };
    let guard = 0;
    while (s.phase !== 'won' && s.phase !== 'lost' && guard++ < 400) {
      if (s.phase === 'draft') { s = draft(s, opts); continue; }
      if (s.phase === 'act') {
        const night = s.night, hour = s.hour;
        s = playHour(s, Object.assign({}, opts, { stats }));
        if (s.phase === 'act' && s.night === night && s.hour === hour) throw new Error('Bot did not finish its hour');
        stats.hoursPlayed++;
        continue;
      }
      break;
    }
    return { state: s, stats };
  }

  return { evaluate, simulateEnd, chooseAction, playHour, playRun, draft, POLICIES, DEFAULT_W };
});

</script>
<script>
/* ---- art.js ---- */
/* Two Lanterns — sprite set.
 * Defines window.ART (and module.exports when available).
 *   ART.sprites[key]      -> SVG inner markup, drawn in a 0 0 64 64 viewBox
 *   ART.svg(key, cls)     -> full <svg> string
 *   ART.palette           -> colour tokens used by the sprites
 * Style: chunky, rounded, dark-indigo outlines, flat fills, one highlight +
 * one shadow per sprite, radial glow only on bloom + lantern.
 */
(function (root) {
  'use strict';

  const O = '#2b2a4a';                       // outline indigo
  const L  = `stroke="${O}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"`;
  const L2 = `stroke="${O}" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"`;
  const L1 = `stroke="${O}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"`;

  const palette = {
    night:    '#1b1a33',
    outline:  O,
    soil:     '#4a3b58',
    soilAlt:  '#433551',
    puddle:   '#5aa9e6',
    puddleLight: '#a8dcff',
    stone:    '#8a8fa8',
    frost:    '#dff3ff',
    bloom:    '#ffb347',
    bloomCore:'#ffe38a',
    gale:     '#f28c3b',
    galeCream:'#ffe6c7',
    rill:     '#7cc26b',
    rillBelly:'#dff5c9',
    wisp:     '#cfeeff',
    wispFlurry:'#e3f5ff',
    wispHoar: '#eef8ff',
    wispSleet:'#c5cfdd',
    leaf:     '#8fe38a',
    stem:     '#5cb85c',
    seed:     '#a86b3c',
    accent:   '#ffd166',
    frostedFur:'#a9cfef',
    frostedCream:'#e8f5ff',
  };

  /* ---------- little helpers ---------- */

  // dark oval eye with a white highlight dot
  function eye(cx, cy, rx, ry) {
    rx = rx || 3; ry = ry || 4;
    return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${O}"/>` +
           `<circle cx="${cx + rx * 0.38}" cy="${cy - ry * 0.4}" r="${Math.max(1, rx * 0.42)}" fill="#fff"/>`;
  }
  // round dot eye (wisps)
  function dot(cx, cy, r) {
    r = r || 2.8;
    return `<circle cx="${cx}" cy="${cy}" r="${r}" fill="${O}"/>` +
           `<circle cx="${cx + r * 0.35}" cy="${cy - r * 0.4}" r="${r * 0.36}" fill="#fff"/>`;
  }
  // four-point sparkle
  function star(cx, cy, s, fill, op) {
    const k = s * 0.22;
    return `<path d="M ${cx} ${cy - s} Q ${cx + k} ${cy - k} ${cx + s} ${cy} Q ${cx + k} ${cy + k} ${cx} ${cy + s} Q ${cx - k} ${cy + k} ${cx - s} ${cy} Q ${cx - k} ${cy - k} ${cx} ${cy - s} Z" fill="${fill}"${op != null ? ` opacity="${op}"` : ''}/>`;
  }
  // teardrop, tip up
  function drop(cx, cy, s, fill, outlined) {
    return `<path d="M ${cx} ${cy - 1.5 * s} C ${cx + 1.1 * s} ${cy - 0.2 * s}, ${cx + 1.1 * s} ${cy + s}, ${cx} ${cy + s} C ${cx - 1.1 * s} ${cy + s}, ${cx - 1.1 * s} ${cy - 0.2 * s}, ${cx} ${cy - 1.5 * s} Z" fill="${fill}"${outlined ? ' ' + L1 : ''}/>`;
  }
  // radial glow (the only gradients in the set)
  function glow(id, color, cx, cy, r, a) {
    return `<defs><radialGradient id="${id}"><stop offset="0" stop-color="${color}" stop-opacity="${a}"/><stop offset=".45" stop-color="${color}" stop-opacity="${(a * 0.45).toFixed(3)}"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></radialGradient></defs>` +
           `<circle cx="${cx}" cy="${cy}" r="${r}" fill="url(#${id})"/>`;
  }
  // a little hand lantern (flat halo, no gradient) — used by the keepers
  function miniLantern(cx, top, w, h) {
    const x = cx - w / 2;
    return `<circle cx="${cx}" cy="${top + h / 2}" r="${h * 0.75}" fill="${palette.accent}" opacity=".26"/>` +
           `<rect x="${x + 1}" y="${top - 2.2}" width="${w - 2}" height="3.6" rx="1.6" fill="${O}"/>` +
           `<rect x="${x}" y="${top}" width="${w}" height="${h}" rx="3.2" fill="${palette.accent}" ${L2}/>` +
           `<rect x="${x + 1.5}" y="${top + h - 1}" width="${w - 3}" height="3" rx="1.5" fill="${O}"/>` +
           `<circle cx="${cx}" cy="${top + h / 2 + 0.5}" r="${Math.min(w, h) * 0.22}" fill="#fff4c2"/>`;
  }

  /* ---------- keepers ---------- */

  function fox(o) {
    const fur = o.fur, cream = o.cream, inner = o.inner;
    let m = '';
    // tail (behind everything, curling up on the left, cream tip)
    m += `<path d="M 22 54 Q 6 54 7 40" fill="none" stroke="${O}" stroke-width="13" stroke-linecap="round"/>`;
    m += `<path d="M 22 54 Q 6 54 7 40" fill="none" stroke="${fur}" stroke-width="10" stroke-linecap="round"/>`;
    m += `<circle cx="7" cy="40" r="5" fill="${cream}"/>`;
    // lantern stick over the shoulder
    m += `<path d="M 38 46 L 55 14" stroke="${O}" stroke-width="5.5" stroke-linecap="round"/>`;
    m += `<path d="M 38 46 L 55 14" stroke="#9a6a45" stroke-width="2.5" stroke-linecap="round"/>`;
    // body + belly
    m += `<rect x="16" y="40" width="30" height="20" rx="10" fill="${fur}" ${L}/>`;
    m += `<ellipse cx="32" cy="52" rx="8" ry="5" fill="${cream}"/>`;
    // ears
    m += `<path d="M 19 22 L 15 5 L 29 16 Z" fill="${fur}" ${L}/>`;
    m += `<path d="M 33 16 L 44 4 L 43 21 Z" fill="${fur}" ${L}/>`;
    m += `<path d="M 20 18 L 18 10 L 25 15 Z" fill="${inner}"/>`;
    m += `<path d="M 35 14 L 41 9 L 40.5 17 Z" fill="${inner}"/>`;
    // cheek tufts, then head over them
    m += `<path d="M 20 31 L 10 35.5 L 20 40 Z" fill="${fur}" ${L}/>`;
    m += `<path d="M 42 31 L 52 35.5 L 42 40 Z" fill="${fur}" ${L}/>`;
    m += `<circle cx="31" cy="30" r="15" fill="${fur}" ${L}/>`;
    if (o.frosted) {
      m += `<path d="M 18 26 C 19 15, 43 15, 44 26 C 40 22, 37 28, 31 24 C 26 28, 22 22, 18 26 Z" fill="#f4fbff"/>`;
    }
    // muzzle
    m += `<ellipse cx="34" cy="38" rx="9" ry="5.5" fill="${cream}"/>`;
    // face
    if (o.frosted) {
      m += `<path d="M 23 27 l 5 2.5 l -5 2.5" fill="none" ${L2}/>`;
      m += `<path d="M 41 27 l -5 2.5 l 5 2.5" fill="none" ${L2}/>`;
      m += `<path d="M 30 40 l 2 -1.6 l 2 1.6 l 2 -1.6 l 2 1.6" fill="none" ${L1}/>`;
    } else {
      m += eye(26, 29, 3, 4) + eye(38, 29, 3, 4);
      m += `<path d="M 32 40 q 3 2.6 6 0" fill="none" ${L1}/>`;
    }
    m += `<ellipse cx="35" cy="36" rx="2.4" ry="1.8" fill="${O}"/>`;
    m += `<ellipse cx="21" cy="35" rx="3" ry="2" fill="#f79c9c" opacity=".75"/>`;
    m += `<ellipse cx="44" cy="35" rx="2.4" ry="1.8" fill="#f79c9c" opacity=".75"/>`;
    // hanging lantern
    m += `<line x1="55" y1="14" x2="55" y2="19" stroke="${O}" stroke-width="2"/>`;
    m += miniLantern(55, 20, 10, 13);
    if (o.frosted) {
      // shiver marks + frost sparkles
      m += `<path d="M 10 22 q -3 4 0 8 M 6 20 q -3 4 0 8" fill="none" stroke="#dff3ff" stroke-width="2" stroke-linecap="round" opacity=".9"/>`;
      m += `<path d="M 50 42 q 3 4 0 8" fill="none" stroke="#dff3ff" stroke-width="2" stroke-linecap="round" opacity=".9"/>`;
      m += star(11, 11, 3.5, '#fff', .95) + star(53, 50, 2.6, '#fff', .9) + star(22, 61, 2.4, '#fff', .9);
    }
    return m;
  }

  function frog(o) {
    const skin = o.skin, belly = o.belly;
    let m = '';
    // lantern on the ground to the right (behind the arm)
    m += `<path d="M 52.5 37 q 3.5 -7 7 0" fill="none" stroke="${O}" stroke-width="2.2"/>`;
    m += miniLantern(56, 38, 12, 15);
    // feet
    m += `<ellipse cx="17" cy="56" rx="7" ry="4" fill="${skin}" ${L}/>`;
    m += `<ellipse cx="40" cy="56" rx="7" ry="4" fill="${skin}" ${L}/>`;
    // body + belly
    m += `<ellipse cx="29" cy="40" rx="20" ry="17" fill="${skin}" ${L}/>`;
    m += `<ellipse cx="29" cy="46" rx="12" ry="8" fill="${belly}"/>`;
    m += `<circle cx="14" cy="34" r="2.2" fill="${o.spot}"/><circle cx="45" cy="38" r="1.8" fill="${o.spot}"/>`;
    if (o.frosted) {
      m += `<path d="M 21 28 C 24 21, 34 21, 37 28 C 34 26, 32 30, 29 27 C 26 30, 24 26, 21 28 Z" fill="#f4fbff"/>`;
    }
    // arm holding the lantern handle
    m += `<path d="M 44 42 Q 52 40 55 33" fill="none" stroke="${O}" stroke-width="6" stroke-linecap="round"/>`;
    m += `<path d="M 44 42 Q 52 40 55 33" fill="none" stroke="${skin}" stroke-width="3" stroke-linecap="round"/>`;
    m += `<circle cx="55.5" cy="33" r="3" fill="${skin}" ${L2}/>`;
    // eye bulges
    m += `<circle cx="19" cy="24" r="8" fill="${skin}" ${L}/>`;
    m += `<circle cx="39" cy="24" r="8" fill="${skin}" ${L}/>`;
    if (o.frosted) {
      m += `<path d="M 15.5 23 l 5 2.5 l -5 2.5" fill="none" ${L2}/>`;
      m += `<path d="M 42.5 23 l -5 2.5 l 5 2.5" fill="none" ${L2}/>`;
      m += `<path d="M 22 39 l 2.5 -1.8 l 2.5 1.8 l 2.5 -1.8 l 2.5 1.8 l 2.5 -1.8 l 2.5 1.8" fill="none" ${L1}/>`;
    } else {
      m += eye(19.5, 25, 3.4, 4.2) + eye(39.5, 25, 3.4, 4.2);
      m += `<path d="M 20 37 Q 29 45 38 37" fill="none" ${L2}/>`;
    }
    m += `<circle cx="26" cy="33" r="1.1" fill="${O}"/><circle cx="32" cy="33" r="1.1" fill="${O}"/>`;
    m += `<ellipse cx="14" cy="39" rx="3" ry="2" fill="#f79c9c" opacity=".7"/>`;
    m += `<ellipse cx="43" cy="42" rx="2.6" ry="1.8" fill="#f79c9c" opacity=".7"/>`;
    if (o.frosted) {
      m += `<path d="M 6 30 q -3 4 0 8" fill="none" stroke="#dff3ff" stroke-width="2" stroke-linecap="round" opacity=".9"/>`;
      m += star(8, 14, 3.5, '#fff', .95) + star(50, 10, 3, '#fff', .9) + star(58, 58, 2.4, '#fff', .9);

  }

  /* ---------- wisps ---------- */

  const GHOST = 'M 14 36 C 14 12, 50 12, 50 36 L 50 51 C 47 47, 44 47, 41 52 C 38 47, 35 47, 32 52 C 29 47, 26 47, 23 52 C 20 47, 17 47, 14 51 Z';

  // knitted scarf: band across the neck + a dangling tail
  function scarf(c, d, y, tail) {
    const x0 = 12, x1 = 52, len = (tail && tail.len) || 13;
    let m = '';
    if (!tail || tail.side !== 'left') {
      m += `<path d="M ${x1 - 11} ${y + 6} L ${x1 - 7} ${y + len + 4} L ${x1 + 1} ${y + len + 3} L ${x1 - 2} ${y + 5} Z" fill="${c}" ${L2}/>`;
      m += `<path d="M ${x1 - 6.5} ${y + len + 4} l .8 3 M ${x1 - 3} ${y + len + 3.5} l .8 3" fill="none" ${L1}/>`;
    } else {
      m += `<path d="M ${x0 + 3} ${y + 1} L ${x0 - 9} ${y - 6} L ${x0 - 8} ${y} L ${x0 + 4} ${y + 6} Z" fill="${c}" ${L2}/>`;
      m += `<path d="M ${x0 - 8.5} ${y - 5.5} l -3 1 M ${x0 - 8} ${y - 1.5} l -3 1" fill="none" ${L1}/>`;
    }
    m += `<path d="M ${x0} ${y} Q 32 ${y + 6} ${x1} ${y} L ${x1} ${y + 6} Q 32 ${y + 12} ${x0} ${y + 6} Z" fill="${c}" ${L2}/>`;
    m += `<path d="M ${x0 + 7} ${y + 3.2} h 3 M ${x0 + 14} ${y + 4.8} h 3 M ${x0 + 21} ${y + 5.2} h 3 M ${x0 + 28} ${y + 4} h 3" stroke="${d}" stroke-width="1.6" stroke-linecap="round"/>`;
    return m;
  }

  function chill() {
    let m = '';
    m += `<path d="${GHOST}" fill="${palette.wisp}" fill-opacity=".93" ${L}/>`;
    m += `<ellipse cx="24" cy="26" rx="5" ry="3" fill="#fff" opacity=".8" transform="rotate(-30 24 26)"/>`;
    m += dot(25, 35, 2.8) + dot(39, 35, 2.8);
    m += `<ellipse cx="19" cy="40" rx="3" ry="2" fill="#ffb3c6" opacity=".8"/><ellipse cx="45" cy="40" rx="3" ry="2" fill="#ffb3c6" opacity=".8"/>`;
    m += `<path d="M 30 40.5 q 2 2.2 4 0" fill="none" ${L1}/>`;
    m += scarf('#ff8a80', '#d9534f', 42);
    return m;
  }

  function flurry() {
    let m = '';

    var hostPending = null;    // {resolve, reject, timer}

    // ---- helpers --------------------------------------------------------

    function emit(name) {

    }

      if (started) throw netError('busy', 'host()/join() already called');

    // ---- queue ----------------------------------------------------------

    function flush() {

    function stopHeartbeat() {

          resolve: resolve,
          reject: reject,
          timer: setTimeout(function () {
            finishJoin(netError('timeout', 'Timed out joining room ' + code));
          }, JOIN_TIMEOUT_MS),

    }

    function finishJoin(err) {
      var jp = joinPending;

      joinPending = null;

    function attachGuestPeer(p) {
      p.on('open', function (id) {
        if (!isCurrentPeer(p)) return;
        log('guest: registered with signaling as', id);
      });
      p.on('disconnected', function () {

      });
      p.on('close', function () {

    }

    return {
      host: host,
      join: join,
      send: send,
      close: close,
      get isHost() { return isHost; },
      get code() { return code; },
      get status() { return status; },
      // extras (tests / debugging)
      get conn() { return conn; },
      get peer() { return peer; },
      get queued() { return queue.length; },
      get attempts() { return attemptNo; },

  }

    create: create,
    randomCode: randomCode,
    normaliseCode: normaliseCode,
    ID_PREFIX: ID_PREFIX,
  };

    return `<h2>How to play</h2><p class="sub">Two keepers, one garden. Keep <b>Warmth</b> above zero through five nights of six hours. Your <b>Glow</b> is the number of blooms alive at each dawn, added together.</p>
    <div class="help">
      <div><h3>Your hour</h3><p>Both keepers act in <b>any order</b>. Each gets one move and <b>two plays</b>, used for cards or Transplant. Coordinate freely, then both press Done. Chills follow their intents; weather, irrigation and marked arrivals follow.</p><p><b>Pin one card</b> with its pin icon to keep it at dusk. All other cards in hand are discarded, then you draw up to 3. Click the same pin to unpin, or another to change it. Playing your pinned card clears the pin. Second Wind draws two extra; exhausted cards return next night.</p></div>
      <div><h3>Transplant ${sprite('sprout')}</h3><p>Spend <b>one play, with no card</b>, to move a plant beside your keeper onto empty soil beside that plant. Click <b>Transplant</b>, the plant, then its destination. A bloom becomes a sprout; seeds and sprouts keep their stage. This can open an escape route or rescue a crop from the frost front.</p><p><b>Kite</b> still carries plants at range without downgrading them. Gale's planted or moved plants can earn Drink Deep's bonus that hour.</p></div>
      <div><h3>One plant per puddle ${sprite('puddle')}</h3><p>Seed → sprout → bloom. Each puddle waters <b>one adjacent plant</b> at dusk: highest stage below bloom first, then nearest Rill, then reading order (top row first, left to right). A plant chosen by several puddles grows only one stage.</p><p>The blue droplet marks each chosen plant; hover it to see its water sources. Moving Rill can change ties. These show current allocations, which may change before dusk. <b>Sprinkle</b> grows a plant instantly within <b>3 tiles</b>; Drink Deep reaches 2; <b>Frog Chorus</b> uses the same one-plant-per-puddle allocation immediately. Dew turns every seed beside water into a sprout.</p><p>Natural ponds and streams are permanent. Card puddles have <b>2 life</b>, losing one after each dusk's growth; at 0 they become soil.</p></div>
      <div><h3>Chills and collisions ${sprite('chill')}</h3><p>Chill: 1 hp, move 2. Flurry: 1 hp, move 3. Hoar: 2 hp, move 1 and breathes on all four sides. Sleet: 1 hp, move 2, hunts water and <b>never breathes</b>; before irrigation it freezes any water underneath it, including a stream. <b>Wail</b>: 1 hp, move 1; it freezes the first plant in a straight lane up to 3 tiles. Stones, keepers and Chills block the lane. A keeper in the lane takes the wail and shields the plant.</p><p>Breath freezes a plant. Losing a bloom costs <b>1 Warmth</b>. A keeper can block breath and movement, but breath frosts them: no move next hour. A push into stone, plant, keeper, Chill or board edge deals <b>1 damage</b>; a bumped Chill takes 1 too. Mossy Stones raises stone collision damage to 2.</p></div>
      <div><h3>Soaking buys time</h3><p>A Chill entering water stops and becomes soaked. Its next intent is hold, or breath if a plant is adjacent; at the following hour start it dries and can move out. Leaving water also dries it. Entering again soaks it again; a blocked push leaves its soaking unchanged.</p><p>Making a puddle beneath a Chill soaks it and cancels its current move. The droplet on a Chill means soaked; the droplet on a plant means allocated irrigation. <b>Drain</b> damages only an occupant that is still soaked.</p></div>
      <div><h3>Shared lanterns ${sprite('lantern')}</h3><p>Both players see intents inside <b>either lantern</b> by default. Beyond both lanterns, ${sprite('intent_unknown')} means unknown. Radius is 2, plus 1 with Long Wick, including Fog. The optional <b>private lanterns</b> setting shows each keeper only their own coverage; ${sprite('intent_partner')} means your partner can see it.</p><p>Intents are fixed at hour start. Pushing redirects where a breath or Wail lane lands, without changing its direction. Chill and Flurry have a 20% chance of fickle drift; Hoar, Sleet and Wail never do. In <b>Fog</b>, Chills outside both lanterns disappear; the side panel counts them. Adjacent sprouts and blooms reveal Chills to both keepers. Gentle shows dark positions but hides intents. Harsh gives glow only to blooms and hides spawn types; other difficulties show marked types as usual.</p></div>
      <div><h3>Gale and Rill together</h3><p>Gale moves 3; Rill moves 2, with free steps into puddles. <b>Following Wind</b> pushes an adjacent Chill away once. If Rill's cards pushed, soaked, drained or calmed <b>that Chill</b> earlier this hour, pick a direction for one push or <b>away ×2</b> for two pushes away from Gale. <b>Drink Deep</b> grows twice if Gale planted or moved <b>that plant</b> earlier this hour.</p><p><b>Seed Wind</b> puts its bonus seed beside water Rill made this hour. <b>Backwash</b> deals 1 to each soaked Chill. A Chill Gale pushed or bumped this hour counts as soaked for this card, even on dry soil. Eligible targets glow green and the card names their coordinates. These records reset each hour.</p><p><b>Sweep</b> reaches every Chill in its line, even past stones and plants, farthest first.</p></div>
      <div><h3>Weather changes the puzzle</h3><ul>${weathers}</ul><p>The next weather is shown <b>before your draft</b>. Board chevrons show stream current; arrows show tonight's wind. The pale row or column boundary marks the next frost advance and its hour. The forecast names the random front side and stream direction. On Gale Night hour 6, <b>the last gust: pushes go +2 this hour</b> in the wind direction. These rules reflect your selected difficulty.</p></div>
      <div><h3>Arrivals and dawn</h3><p>Markers show where Chills arrive at dusk. Blocking a marker cannot cancel it: a keeper is frosted, a plant freezes, then the Chill takes the tile or squeezes onto a nearby open edge. Hour 5 marks edge tiles within 2 of a plant whenever possible; hour 6 has no marked arrivals. Later nights start with lingering Chills already able to act. Meltwater and Long Dark lingering Chills are Sleet, and their first marked wave includes one Sleet. Long Dark arrivals avoid the front’s edge.</p><p>This difficulty needs <b>${config.dawnLowByNight.join(', ')}</b> blooms at successive dawns. Each missing bloom costs <b>1 Warmth, capped at 2</b>. Warmth does not recover on its own. Each keeper drafts one of three cards or skips after nights 1–4; four blooms earn a shared charm. Up to three surviving blooms carry over as seeds.</p></div>
      <div><h3>Charms and communication</h3><p><b>Deep Roots</b> saves the first freezing bloom each night as a sprout, without Warmth loss. Its rescued sprout skips irrigation at that dusk; Sprinkle can still grow it. <b>Kindling</b> adds 2 Warmth; <b>Long Wick</b> adds lantern range, including harsh Fog. <b>Tailwind / Webbed Feet</b> raise Gale / Rill's speed. <b>Early Thaw</b> thaws one frost tile beside water each dusk; <b>Bright Bulbs</b> makes Chills prefer seeds.</p><p>Tell your partner what your hidden hand can do. Vacate a route, change irrigation priority, set up a collision or rescue a plant. Shift-click any tile to ping it. Keys: <b>1–5</b> cards, <b>M</b> move, <b>T</b> Transplant, <b>D</b> Done, <b>Esc</b> cancel.</p></div>
      <div><h3>Glow ranks</h3><p><b>0–19</b> · the garden slept early<br><b>20–27</b> · kept the garden<br><b>28–35</b> · a bright dawn<br><b>36+</b> · midwinter bloom</p><p>Your total Glow earns this rank at each dawn and at the end of the run.</p></div>
    </div>`;
  }
  $('#btnHelp').onclick = () => { A.ui.helpOpen = !A.ui.helpOpen; if (A.mode === 'game') renderModal(); else { $('#modal').hidden = !A.ui.helpOpen; if (A.ui.helpOpen) { $('#modalCard').innerHTML = helpHtml(); const b = h('button', 'btn', 'Got it'); b.onclick = () => { A.ui.helpOpen = false; $('#modal').hidden = true; }; const act = h('div', 'modal-actions'); act.appendChild(b); $('#modalCard').appendChild(act); } } };
  $('#modal').onclick = (e) => { if (e.target === $('#modal') && A.ui.helpOpen) { A.ui.helpOpen = false; if (A.mode === 'game') renderModal(); else $('#modal').hidden = true; } };
  $('#btnLeave').onclick = () => { if (confirm('Leave this game?')) leaveAll(); };

  // ---------- event playback ----------
  function flashEvents(events, before) {
    for (const e of events) {
      if (e.id !== undefined && !visibleWisp(before, before.wisps.find(w => w.id === e.id))) continue;
      if (e.type === 'die') { const f = fx('float good', e.x, e.y, 'melt'); setTimeout(() => f.remove(), 1000); }
      if (e.type === 'hit' && !events.some(d => d.type === 'die' && d.id === e.id)) { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
      if (e.type === 'bump') { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } }
      if (e.type === 'calm') { const f = fx('label', e.x, e.y, 'calm'); setTimeout(() => f.remove(), 900); }
      if (e.type === 'freeze') { tileEl(e.x, e.y).classList.add('flash'); setTimeout(() => tileEl(e.x, e.y).classList.remove('flash'), 700); }
      if (e.type === 'carry' && e.transplant) { const f = fx('label', e.to[0], e.to[1], 'transplanted'); setTimeout(() => f.remove(), 1000); }
      if (e.type === 'puddle' || e.type === 'plant' || e.type === 'grow' || e.type === 'thaw' || e.type === 'drain') { const t = tileEl(e.x, e.y); t.classList.remove('flash'); void t.offsetWidth; t.classList.add('flash'); }
    }
  }
  // Step through the end-of-hour events with a display state so the wisp phase reads as a sequence.
  function playEvents(before, events, done) {
    A.ui.busy = true; clearPreview(); A.ui.sel = null;
    const d = TL.cloneState(before);
    const steps = [];
    const dur = { current: 300, keeperWind: 300, front: 500, walk: 260, slide: 220, breathe: 520, wail: 520, die: 380, freeze: 320, grow: 180, plant: 160, spawn: 260, wispPhase: 350, dawn: 900, night: 600, hour: 10, thaw: 150, frostKeeper: 300, soak: 120, dry: 120, evaporate: 180, freezeWater: 240, warmth: 200 };
    for (const e of events) {
      const ms = dur[e.type] !== undefined ? dur[e.type] : 60;
      steps.push({ e, ms });
    }
    let i = 0;
    const wispOf = (id) => d.wisps.find(w => w.id === id);
    const tick = () => {
      if (i >= steps.length) { A.ui.busy = false; done(); return; }
      const { e, ms } = steps[i++];
      const seeActor = e.id === undefined || visibleWisp(d, wispOf(e.id));
      switch (e.type) {
        case 'wispPhase': banner('The Chills stir…', 700); break;
        case 'current': case 'walk': case 'slide': { const w = wispOf(e.id); if (w) { w.x = e.to[0]; w.y = e.to[1]; } break; }
        case 'keeperWind': { const k = d.keepers[e.keeper]; k.x = e.to[0]; k.y = e.to[1]; break; }
        case 'front': { const weather = TL.weatherInfo(d); d.frontColumn += 1; banner(`The frost advances from the ${esc(weather.frontSide)}<small>${frontLabel(weather)} freezes</small>`, 1200); break; }
        case 'soak': { const w = wispOf(e.id); if (w) w.soaked = true; break; }
        case 'dry': { const w = wispOf(e.id); if (w) w.soaked = false; break; }
        case 'breathe': { if (!seeActor) break; const x = e.x + TL.DIRS[e.dir][0], y = e.y + TL.DIRS[e.dir][1]; const f = fx('puff', x, y, sprite('intent_breathe')); f.style.transform += ` rotate(${{ N: -90, E: 0, S: 90, W: 180 }[e.dir]}deg)`; setTimeout(() => f.remove(), 700); break; }
        case 'wail': { if (!seeActor) break; for (const p of e.lane) { const f = fx('puff wail-puff', p.x, p.y, sprite('intent_breathe')); f.style.transform += ` rotate(${{ N: -90, E: 0, S: 90, W: 180 }[e.dir]}deg)`; setTimeout(() => f.remove(), 700); } break; }
        case 'freeze': { const t = d.tiles[e.y * 7 + e.x]; t.plant = 0; if (t.terrain === 'soil') t.terrain = 'frost'; const f = fx('float', e.x, e.y, e.stage === 3 ? 'bloom lost' : 'frozen'); setTimeout(() => f.remove(), 1000); break; }
        case 'wither': { const t = d.tiles[e.y * 7 + e.x]; t.plant = e.to; break; }
        case 'warmth': { const p = $('#pillWarmth'); p.classList.remove('shake'); void p.offsetWidth; p.style.animation = 'shake .4s ease'; setTimeout(() => p.style.animation = '', 450); d.warmth = e.warmth; break; }
        case 'frostKeeper': { d.keepers[e.keeper].frosted = true; const k = d.keepers[e.keeper]; const f = fx('float', k.x, k.y, 'frosted'); setTimeout(() => f.remove(), 1000); break; }
        case 'hit': { const el = pieceEls.get('w-' + e.id); if (el) { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); } const w = wispOf(e.id); if (w) w.hp -= e.n; break; }
        case 'die': { d.wisps = d.wisps.filter(w => w.id !== e.id); if (seeActor) { const f = fx('float good', e.x, e.y, 'melt'); setTimeout(() => f.remove(), 1000); } break; }
        case 'frost': { const t = d.tiles[e.y * 7 + e.x]; if (!t.plant) t.terrain = 'frost'; delete t.life; delete t.streamDir; break; }
        case 'grow': case 'plant': { d.tiles[e.y * 7 + e.x].plant = e.stage; break; }
        case 'thaw': { d.tiles[e.y * 7 + e.x].terrain = 'soil'; break; }
        case 'puddle': { const t = d.tiles[e.y * 7 + e.x]; t.terrain = 'puddle'; t.life = e.life; break; }
        case 'evaporate': case 'freezeWater': {
          const t = d.tiles[e.y * 7 + e.x]; t.terrain = e.type === 'freezeWater' ? 'frost' : 'soil'; delete t.life; delete t.streamDir;
          const w = TL.wispAt(d, e.x, e.y); if (w) w.soaked = false;
          const f = fx('label', e.x, e.y, e.type === 'freezeWater' ? 'water freezes' : 'evaporates'); setTimeout(() => f.remove(), 1000); break;
        }
        case 'spawn': { d.wisps.push({ id: e.id, type: e.wtype, hp: TL.WISP_TYPES[e.wtype].hp, x: e.x, y: e.y, soaked: d.tiles[e.y * 7 + e.x].terrain === 'puddle', intent: { kind: 'none' } }); d.spawns = d.spawns.filter(s => !(s.x === e.x && s.y === e.y)); break; }
        case 'dawn': { const need = TL.dawnNeed(before), loss = Math.min(2, Math.max(0, need - e.blooms)); d.glow = before.glow + e.blooms; banner(`Dawn<small>${e.blooms} bloom${e.blooms === 1 ? '' : 's'} lit the garden${loss ? ` · the hearth needed ${need}, Warmth −${loss}` : ''}</small><small class="glow-rank">Glow ${d.glow} · ${esc(TL.glowRank(d.glow))}</small>`, 2000); break; }
        case 'lost': banner('The last warmth is gone', 1200); break;
        case 'won': banner('You made it to dawn', 1400); break;
        case 'hour': { // new hour: snap everything to the real state (intents, hands, spawns) and finish
          A.ui.busy = false; done(); return; }
        case 'night': { A.ui.busy = false; done(); return; }
      }
      renderBoard(d); renderTop();
      setTimeout(tick, ms);
    };
    tick();
  }

  // ---------- boot ----------
  function boot() {
    $('#brandLantern').innerHTML = sprite('lantern');
    $('#heroArt').innerHTML = sprite('gale') + sprite('bloom', 'bloomy') + sprite('rill');
    const u = new URL(location.href);
    const room = u.searchParams.get('room');
    renderLobby();
    if (room) {
      const code = room.toUpperCase();
      const saved = LS.get('host.' + code, null);
      let mine = false; try { mine = sessionStorage.getItem('tl.hostTab') === code; } catch (e) {}
      if (saved && mine) { resumeHost(code); return; }
      if (saved) { A.lobby.joinCode = code; A.lobby.view = 'choose'; renderLobby(); return; }
      A.lobby.joinCode = code; A.lobby.view = 'join'; renderLobby();
      if (A.myName) joinRoom(room);
    }
  }
  boot();
})();

</script>
</body>
