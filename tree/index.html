<style>
  :root{
    --bg:#fbf9f4; --ink:#1c1b18; --muted:#6a665d; --line:#d9d2c4; --rule:#c7bfae; --faint:#a39c8c;
    --hydrie:#2f6f6a; --azam:#8a6d1f; --zaheer:#3f5f86; --russian:#8f3b49;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg); color:var(--ink); font-family:var(--serif)}
  body{padding:34px 30px 60px}
  h1{font-size:1.55rem; font-weight:600; letter-spacing:-.01em}
  .sub{color:var(--muted); margin-top:6px; font-size:.92rem; max-width:78ch}
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-family:var(--mono); font-size:.7rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .sw{width:10px; height:10px; border-radius:2px; display:inline-block}
  .l-hydrie{background:var(--hydrie)} .l-azam{background:var(--azam)} .l-zaheer{background:var(--zaheer)} .l-russian{background:var(--russian)}
  .l-unknown{background:#fff; border:1px dashed var(--rule)}

  /* canvas: SVG connectors sit underneath absolutely-positioned node boxes */
  .scroller{margin-top:22px; overflow:auto; border-top:1px solid var(--rule); padding-top:18px}
  #stage{position:relative}
  #wires{position:absolute; top:0; left:0; pointer-events:none}

  .colhdr{position:absolute; font-family:var(--mono); font-size:.6rem; letter-spacing:.14em;
          text-transform:uppercase; color:var(--faint); white-space:nowrap}

  .node{position:absolute; border:1px solid var(--line); border-left:3px solid var(--ln,var(--rule));
        background:#fff; border-radius:5px; padding:7px 9px; text-align:left}
  .node .n{font-weight:600; font-size:.95rem; line-height:1.15}
  .node .d{font-family:var(--mono); font-size:.63rem; color:var(--muted); margin-top:3px; line-height:1.45}
  .node .r{font-family:var(--mono); font-size:.57rem; color:var(--faint); letter-spacing:.04em; margin-top:4px; text-transform:uppercase}
  .node.ref{border-left-width:3px; box-shadow:0 0 0 2px rgba(47,111,106,.14)}
  .node.unknown{border-style:dashed; border-left-style:solid; background:#fcfbf7}
  .node.unknown .n{color:var(--muted); font-weight:600}
  .node.collateral{background:#faf8f2}

  .e-hydrie{--ln:var(--hydrie)} .e-azam{--ln:var(--azam)} .e-zaheer{--ln:var(--zaheer)} .e-russian{--ln:var(--russian)} .e-unknown{--ln:var(--rule)}
  .node[data-bio]{cursor:help}

  /* hover tooltip — fuller detail */
  #tip{position:fixed; z-index:50; max-width:300px; pointer-events:none; opacity:0; transition:opacity .12s;
       background:#fff; border:1px solid var(--rule); border-left:3px solid var(--tc,var(--rule)); border-radius:6px;
       padding:10px 12px; box-shadow:0 10px 28px rgba(40,35,25,.16); font-size:.82rem; line-height:1.45; color:var(--ink)}
  #tip.show{opacity:1}
  #tip .tn{font-weight:600; font-size:.92rem}
  #tip .tr{font-family:var(--mono); font-size:.58rem; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:3px 0 7px}
  #tip .tb{color:#3a382f}

  footer{margin-top:34px; padding-top:12px; border-top:1px solid var(--rule); color:var(--faint);
         font-family:var(--mono); font-size:.66rem; line-height:1.7}
</style>
</head>

     bio       fuller hover text
     unknown   true = identity not yet confirmed (dashed card)
     ref       true = highlight ring (the focus person)

     Parent order = [father, mother] (drawn top, bottom).

    {parents:['aamer'],              children:['zubin']},
    {parents:['olga'],               children:['masha']},

    // Wazir Hasan's six children, in birth order (Nur Zehra is the direct line)
    {parents:['wazir','ladywazir'],  children:['ali','hasanZ','nurf','husain','nurz','sajjad']},

    // Azam: Dadi's siblings' families
    {parents:['kameswar','urfi'],    children:['seema']},
    {parents:['nusayr','nasreen'],   children:['arsalan']},
    {parents:['partha','shairbani'], children:['ruhita','ahina']},
    {parents:['vishal','nuwayri'],   children:['damini','vivan']},

    // Zaheer: grandchildren of Wazir Hasan and below
    {parents:['ali','aaliya'],        children:['sakina','akram','aju','hamida']},
    {parents:['hasanZ','fahmida'],    children:['sarwath','aasia','hasanSons']},
    {parents:['abdulHasan','nurf'],   children:['nurul','sakani']},
    {parents:['husain','syedaBegum'], children:['selma','vajjan','akhil']},
    {parents:['sajjad','razia'],      children:['aks','uzra']},
    {parents:['aasia'],               children:['imran','imranSibs']},
    {parents:['selma'],               children:['zainKhan','maryam']},
    {parents:['aks','sri'],           children:['sage']},
    {parents:['uzra'],                children:['zainBilgrami','naheed']},
    {parents:['sage'],                children:['reese','hudson']},
  ];

  const SECTIONS=[
    {root:'wasif', color:'azam',
     title:'Azam collateral — Dadi and her siblings (children of Syed Wasif Azam)'},
    {root:'mohammed', color:'azam',
     title:'Azam Jung collateral — children of Nawab Mohammed Azam Jung & Siraj Fatima'},
    {root:'nazir', color:'zaheer',
     title:'Husain collateral — Nana and her siblings (children of Syed Nazir Husain & Nur Zehra)'},
    {root:'wazir', color:'zaheer',
     title:'Zaheer collateral — descendants of Sir Wazir Hasan (relatives, not direct ancestors)'},
  ];

  /* ============================================================================
     DERIVED STRUCTURE — nothing below is data
     ========================================================================== */
  const NS='http://www.w3.org/2000/svg';
  const W=176, H=52;                 // node box size (H = wire-attach offset basis)
  const COL_GAP=84;                  // horizontal gap between generations
  const COL_W=W+COL_GAP;             // pitch
  const PAD_L=4, PAD_T=24;           // top padding leaves room for column headers
  const ROW=70;                      // vertical pitch for a node slot
  const VGAP=14;                     // minimum vertical gap between cards in a column
  const stage=document.getElementById('stage');
  const svg=document.getElementById('wires');

  const COL_NAMES=['Sasha','Parents','Grandparents','Great-grandparents','Apex','Apex'];

  function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  // child -> its union / parents
  const unionOfChild={}, parentsOf={};
  UNIONS.forEach(u=>u.children.forEach(c=>{ unionOfChild[c]=u; parentsOf[c]=u.parents; }));

  // ancestors of FOCUS = the direct line
  const ancestors=new Set([FOCUS]);
  { const stack=[FOCUS];
    while(stack.length){ const id=stack.pop();
      (parentsOf[id]||[]).forEach(p=>{ if(!ancestors.has(p)){ ancestors.add(p); stack.push(p); } }); } }

  // generation = distance up from FOCUS; extended down to siblings/cousins
  const GEN={}; GEN[FOCUS]=0;
  { let frontier=[FOCUS];
    while(frontier.length){ const next=[];
      frontier.forEach(id=>(parentsOf[id]||[]).forEach(p=>{ if(GEN[p]==null){ GEN[p]=GEN[id]+1; next.push(p); } }));
      frontier=next; } }
  { let changed=true;
    while(changed){ changed=false;
      UNIONS.forEach(u=>{
        const pg=u.parents.map(p=>GEN[p]).find(g=>g!=null);
        if(pg==null) return;
        u.children.forEach(c=>{ if(GEN[c]==null){ GEN[c]=pg-1; changed=true; } }); }); } }

  // section coverage: walk down from each root; stop at direct-line people.
  // Anyone covered here renders in that section, not in the fan.
  const inSection=new Set();
  function sectionWalk(root, visit){
    // visit(id, col, isStub, viaParent) for each member, in DFS order
    const seen=new Set();
    (function walk(id, col, via){
      if(seen.has(id)) return;
      seen.add(id);
      const stub = id!==root && ancestors.has(id);
      visit(id, col, stub, via);
      if(stub) return;                                    // don't recurse into the direct line
      UNIONS.filter(u=>u.parents.includes(id)).forEach(u=>{
        u.parents.forEach(p=>{                            // married-in co-parent = spouse
          if(p!==id && !seen.has(p) && !ancestors.has(p)){ seen.add(p); visit(p, col, false, id, true); }
        });
        u.children.forEach(c=>walk(c, col+1, id));
      });
    })(root, 0, null);
  }
  SECTIONS.forEach(s=>sectionWalk(s.root,(id,col,stub)=>{ if(id!==s.root && !stub) inSection.add(id); }));

  // fan membership: ancestors + their siblings/descendants not covered by a section
  const fan=new Set(ancestors);
  { let changed=true;
    while(changed){ changed=false;
      UNIONS.forEach(u=>{
        if(!u.parents.some(p=>fan.has(p))) return;
        u.children.forEach(c=>{ if(!fan.has(c) && !inSection.has(c)){ fan.add(c); changed=true; } }); }); } }

  // fan collaterals anchor to a direct-line sibling, or to their parent (cousins)
  const anchorOf={};
  fan.forEach(id=>{
    if(ancestors.has(id)) return;
    const u=unionOfChild[id];
    const sib=u && u.children.find(c=>ancestors.has(c));
    anchorOf[id]= sib ? {sib} : {par: u.parents.find(p=>fan.has(p))};
  });

  /* ---- generic helpers: render a card, sweep columns for collisions ---------- */
  function makeCard(parentEl, id, x, y, opts){
    const p=PEOPLE[id];
    const el=document.createElement('div');
    el.className='node e-'+(p.line||'unknown')
      +(p.ref||opts.ref?' ref':'')+(p.unknown?' unknown':'')+(opts.collateral?' collateral':'');
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=W+'px'; el.style.minHeight=(opts.minH||H)+'px';
    const d=opts.d!==undefined?opts.d:p.d;
    let html='<div class="n">'+esc(p.name)+'</div>';
    if(d) html+='<div class="d">'+esc(d).replace(/\n/g,'<br>')+'</div>';
    if(p.r && !opts.noR) html+='<div class="r">'+esc(p.r)+'</div>';
    el.innerHTML=html;
    if(p.bio){
      el.setAttribute('data-bio',p.bio); el.setAttribute('data-nm',p.name);
      if(p.r) el.setAttribute('data-rl',p.r); el.setAttribute('data-ln',p.line||'rule');
    }
    parentEl.appendChild(el);
    return el;
  }

  // push cards apart vertically within each column; returns final center Y per id
  function sweep(cols, els, attach){
    // cols: id -> column index; els: id -> element; attach = wire attach offset from top
    const byCol={};
    Object.keys(cols).forEach(id=>{ (byCol[cols[id]]=byCol[cols[id]]||[]).push(id); });
    const Y={};
    Object.values(byCol).forEach(ids=>{
      ids.sort((a,b)=>els[a].offsetTop-els[b].offsetTop);
      let minTop=-Infinity;
      ids.forEach(id=>{
        let top=els[id].offsetTop;
        if(top<minTop) { top=minTop; els[id].style.top=top+'px'; }
        minTop=top+els[id].offsetHeight+VGAP;
      });
      ids.forEach(id=>{ Y[id]=els[id].offsetTop+attach; });
    });
    return Y;
  }

  function wire(svgEl,x1,y1,x2,y2,color){
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke',color); l.setAttribute('stroke-width','1.4');
    svgEl.appendChild(l);
  }
  const lineColor=ln=>'var(--'+(ln||'rule')+')';

  /* ============================================================================
     PEDIGREE FAN — direct ancestors + near collaterals, present at left
     ========================================================================== */
  const maxGen=Math.max(...[...fan].map(id=>GEN[id]));
  const colX=g=>PAD_L+g*COL_W;

  // column headers
  for(let g=0; g<=maxGen; g++){
    const h=document.createElement('div');
    h.className='colhdr'; h.style.left=colX(g)+'px'; h.style.top='0px';
    h.textContent='G'+(g===0?'0':('-'+g))+' · '+(COL_NAMES[g]||'');
    stage.appendChild(h);
  }

  // initial vertical placement: ancestors get halved bands; collaterals hang below anchors
  const fanY={};
  const ancPerGen={};
  ancestors.forEach(id=>{ ancPerGen[GEN[id]]=(ancPerGen[GEN[id]]||0)+1; });
  const SPAN=Math.max(...Object.values(ancPerGen))*ROW*1.35;
  (function place(id, top, height){
    fanY[id]=top+height/2;
    const ps=(parentsOf[id]||[]).filter(p=>ancestors.has(p));
    if(!ps.length) return;
    if(ps.length===1) place(ps[0], top, height);
    else { place(ps[0], top, height/2); place(ps[1], top+height/2, height/2); }
  })(FOCUS, PAD_T, SPAN);
  // collaterals: below their direct-line sibling, or a row below their parent
  { let changed=true;
    while(changed){ changed=false;
      Object.entries(anchorOf).forEach(([id,a])=>{
        if(fanY[id]!=null) return;
        const ref=a.sib||a.par;
        if(fanY[ref]!=null){ fanY[id]=fanY[ref]+ROW; changed=true; }
      }); } }

  // render fan cards
  const fanEls={}, fanCols={};
  fan.forEach(id=>{
    fanCols[id]=GEN[id];
    fanEls[id]=makeCard(stage, id, colX(GEN[id]), (fanY[id]??PAD_T)-H/2,
                        {collateral:!ancestors.has(id)});
  });

  // resolve collisions, get final wire-attach Y
  const Yf=sweep(fanCols, fanEls, H/2);

  // wires: every union with fan members; marriage bracket right of children
  UNIONS.forEach(u=>{
    const kids=u.children.filter(c=>fan.has(c));
    if(!kids.length) return;
    const ps=u.parents.filter(p=>fan.has(p));
    if(!ps.length) return;
    const col=lineColor(PEOPLE[ps[0]].line);
    const xPar=colX(GEN[ps[0]]);
    const bx=xPar-18;
    const ys=ps.map(p=>Yf[p]);
    const ymid=ys.reduce((a,b)=>a+b,0)/ys.length;
    ps.forEach(p=>wire(svg, xPar, Yf[p], bx, Yf[p], col));
    if(ps.length>1) wire(svg, bx, Math.min(...ys), bx, Math.max(...ys), col);
    kids.forEach(c=>{
      const yc=Yf[c], xcRight=colX(GEN[c])+W;
      const mx=(bx+xcRight)/2;
      wire(svg, bx, ymid, mx, ymid, col);
      wire(svg, mx, ymid, mx, yc, col);
      wire(svg, mx, yc, xcRight, yc, col);
    });
  });

  // size the fan stage
  let maxX=0, maxY=0;
  Object.values(fanEls).forEach(el=>{
    maxX=Math.max(maxX, el.offsetLeft+el.offsetWidth);
    maxY=Math.max(maxY, el.offsetTop+el.offsetHeight);
  });
  maxX=Math.max(maxX, colX(maxGen)+W)+30; maxY+=30;
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  svg.style.width=maxX+'px'; svg.style.height=maxY+'px';
  stage.style.width=maxX+'px'; stage.style.height=maxY+'px';

  /* ============================================================================
     COLLATERAL SECTIONS — mini-trees below the fan, root on the right.
     Tidy layout: leaves stack, parents center on their children; spouses sit
     beside their partner; direct-line people render as reference stubs.
     ========================================================================== */
  function renderSection(sec){
    const wrapEl=document.createElement('div');
    wrapEl.style.cssText='margin-top:46px; padding-top:18px; border-top:1px solid var(--rule);';
    const titleEl=document.createElement('div');
    titleEl.className='colhdr';
    titleEl.style.cssText='position:static; display:block; margin-bottom:14px;';
    titleEl.textContent=sec.title;
    wrapEl.appendChild(titleEl);
    const st=document.createElement('div');
    st.style.cssText='position:relative;';
    const sv=document.createElementNS(NS,'svg');
    sv.style.cssText='position:absolute; top:0; left:0; pointer-events:none;';
    st.appendChild(sv);
    wrapEl.appendChild(st);
    document.querySelector('.scroller').appendChild(wrapEl);

    // collect members
    const colOf={}, stubs=new Set(), spouseOf={}, edges=[], kidsOf={};
    sectionWalk(sec.root,(id,col,stub,via,isSpouse)=>{
      colOf[id]=col;
      if(stub) stubs.add(id);
      if(isSpouse) spouseOf[id]=via;
      if(via!=null && !isSpouse){ edges.push([via,id]); (kidsOf[via]=kidsOf[via]||[]).push(id); }
    });
    // co-parent edges (e.g. both Aks and Sri connect to Sage), spouses ride in partner's row group
    UNIONS.forEach(u=>{
      u.parents.forEach(p=>{ if(spouseOf[p]) u.children.forEach(c=>{ if(colOf[c]!=null) edges.push([p,c]); }); });
    });
    Object.keys(spouseOf).forEach(s=>{ (kidsOf[spouseOf[s]]=kidsOf[spouseOf[s]]||[]).push(s); });

    // tidy layout
    const rowOf={}; let nextRow=0;
    (function layRow(id){
      const kids=kidsOf[id]||[];
      if(!kids.length) return rowOf[id]=nextRow++;
      kids.forEach(layRow);
      const real=kids.filter(k=>!spouseOf[k]);
      const a=real.length?real:kids;
      return rowOf[id]=(rowOf[a[0]]+rowOf[a[a.length-1]])/2;
    })(sec.root);

    // render cards
    const maxCol=Math.max(...Object.values(colOf));
    const ZH=46, ZGAPX=70;
    const els={};
    Object.keys(colOf).forEach(id=>{
      const x=PAD_L+(maxCol-colOf[id])*(W+ZGAPX);
      const y=6+rowOf[id]*ROW;
      els[id]=makeCard(st, id, x, y, {
        collateral:true, minH:ZH, noR:true,
        ref:stubs.has(id),
        d:stubs.has(id) ? '↑ direct line, above' : undefined,
      });
    });

    // resolve collisions, draw wires
    const Ys=sweep(colOf, els, ZH/2);
    const color='var(--'+sec.color+')';
    edges.forEach(([p,c])=>{
      const x1=els[p].offsetLeft, y1=Ys[p];          // parent left edge (root on the right)
      const x2=els[c].offsetLeft+W, y2=Ys[c];        // child right edge
      const mx=(x1+x2)/2;
      wire(sv,x1,y1,mx,y1,color); wire(sv,mx,y1,mx,y2,color); wire(sv,mx,y2,x2,y2,color);
    });

    // size
    let mX=0,mY=0;
    Object.values(els).forEach(el=>{
      mX=Math.max(mX, el.offsetLeft+el.offsetWidth);
      mY=Math.max(mY, el.offsetTop+el.offsetHeight);
    });
    mX+=30; mY+=20;
    sv.setAttribute('width',mX); sv.setAttribute('height',mY);
    sv.style.width=mX+'px'; sv.style.height=mY+'px';
    st.style.height=mY+'px'; st.style.width=mX+'px';
  }
  SECTIONS.forEach(renderSection);

  /* ---- hover tooltips: reveal fuller detail ---------------------------------- */
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  function moveTip(e){
    const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
    let x=e.clientX+pad, y=e.clientY+pad;
    if(x+w>window.innerWidth-8) x=e.clientX-w-pad;
    if(y+h>window.innerHeight-8) y=window.innerHeight-h-8;
    if(x<8) x=8; if(y<8) y=8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  document.addEventListener('mouseover',e=>{
    const n=e.target.closest('.node[data-bio]'); if(!n) return;
    const nm=n.getAttribute('data-nm')||'', rl=n.getAttribute('data-rl')||'', ln=n.getAttribute('data-ln')||'rule';
    tip.style.setProperty('--tc','var(--'+ln+')');
    tip.innerHTML='<div class="tn">'+esc(nm)+'</div>'+(rl?'<div class="tr">'+esc(rl)+'</div>':'')+'<div class="tb">'+esc(n.getAttribute('data-bio'))+'</div>';
    tip.classList.add('show'); moveTip(e);
  });
  document.addEventListener('mousemove',e=>{ if(tip.classList.contains('show')) moveTip(e); });
  document.addEventListener('mouseout',e=>{ const n=e.target.closest('.node[data-bio]'); if(n && !n.contains(e.relatedTarget)) tip.classList.remove('show'); });
</script>
</body>
</html>
