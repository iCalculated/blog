<style>
  :root{
    --bg:#fbf9f4; --ink:#1c1b18; --muted:#6a665d; --line:#d9d2c4; --rule:#c7bfae; --faint:#a39c8c;
    --hydrie:#2f6f6a; --azam:#8a6d1f; --zaheer:#3f5f86; --russian:#8f3b49;
    --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --serif:"Iowan Old Style",Georgia,"Times New Roman",serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg); color:var(--ink); font-family:var(--serif)}
  body{padding:34px 30px 60px}
  h1{font-size:1.55rem; font-weight:600; letter-spacing:-.01em}
  .sub{color:var(--muted); margin-top:6px; font-size:.92rem; max-width:78ch}
  .legend{display:flex; flex-wrap:wrap; gap:14px; margin-top:14px; font-family:var(--mono); font-size:.7rem; color:var(--muted)}
  .legend span{display:inline-flex; align-items:center; gap:6px}
  .sw{width:10px; height:10px; border-radius:2px; display:inline-block}
  .l-hydrie{background:var(--hydrie)} .l-azam{background:var(--azam)} .l-zaheer{background:var(--zaheer)} .l-russian{background:var(--russian)}
  .l-unknown{background:#fff; border:1px dashed var(--rule)}

  /* canvas: SVG connectors sit underneath absolutely-positioned node boxes */
  .scroller{margin-top:22px; overflow:auto; border-top:1px solid var(--rule); padding-top:18px}
  #stage{position:relative}
  #wires{position:absolute; top:0; left:0; pointer-events:none}

  .colhdr{position:absolute; font-family:var(--mono); font-size:.6rem; letter-spacing:.14em;
          text-transform:uppercase; color:var(--faint); white-space:nowrap}

  .node{position:absolute; border:1px solid var(--line); border-left:3px solid var(--ln,var(--rule));
        background:#fff; border-radius:5px; padding:7px 9px; text-align:left}
  .node .n{font-weight:600; font-size:.95rem; line-height:1.15}
  .node .d{font-family:var(--mono); font-size:.63rem; color:var(--muted); margin-top:3px; line-height:1.45}
  .node .r{font-family:var(--mono); font-size:.57rem; color:var(--faint); letter-spacing:.04em; margin-top:4px; text-transform:uppercase}
  .node.ref{border-left-width:3px; box-shadow:0 0 0 2px rgba(47,111,106,.14)}
  .node.unknown{border-style:dashed; border-left-style:solid; background:#fcfbf7}
  .node.unknown .n{color:var(--muted); font-weight:600}
  .node.collateral{background:#faf8f2}

  .e-hydrie{--ln:var(--hydrie)} .e-azam{--ln:var(--azam)} .e-zaheer{--ln:var(--zaheer)} .e-russian{--ln:var(--russian)} .e-unknown{--ln:var(--rule)}
  .node[data-bio]{cursor:help}

  /* hover tooltip — fuller detail */
  #tip{position:fixed; z-index:50; max-width:300px; pointer-events:none; opacity:0; transition:opacity .12s;
       background:#fff; border:1px solid var(--rule); border-left:3px solid var(--tc,var(--rule)); border-radius:6px;
       padding:10px 12px; box-shadow:0 10px 28px rgba(40,35,25,.16); font-size:.82rem; line-height:1.45; color:var(--ink)}
  #tip.show{opacity:1}
  #tip .tn{font-weight:600; font-size:.92rem}
  #tip .tr{font-family:var(--mono); font-size:.58rem; text-transform:uppercase; letter-spacing:.06em; color:var(--faint); margin:3px 0 7px}
  #tip .tb{color:#3a382f}

  footer{margin-top:34px; padding-top:12px; border-top:1px solid var(--rule); color:var(--faint);
         font-family:var(--mono); font-size:.66rem; line-height:1.7}
</style>
</head>
<body>
  <div class="legend">
    <span><i class="sw l-hydrie"></i> Hydrie (Dera Ismail Khan)</span>
    <span><i class="sw l-azam"></i> Azam (Hyderabad)</span>
    <span><i class="sw l-zaheer"></i> Zaheer (Lucknow)</span>
    <span><i class="sw l-russian"></i> Yershova (Russia)</span>
    <span><i class="sw l-unknown"></i> unknown</span>
  </div>

  <div class="scroller">
    <div id="stage">
      <svg id="wires" xmlns="http://www.w3.org/2000/svg"></svg>
    </div>
  </div>


<script>
/* ============================================================================
   DATA  — edit here to extend the tree.
   gen:  0 = Sasha, 1 = parents, 2 = grandparents, 3 = great-grandparents,
         4+ = apex ancestors (drawn further right / up the line).
   line: hydrie | azam | zaheer | russian | unknown   (sets the accent color)
   A "union" is a marriage/partnership with optional children (by person id).
   Collateral people (siblings/cousins) attach via `sibOf` (shares parents of
   that person) or are placed by hand with explicit gen + an offshoot wire.
   ========================================================================== */

  const PEOPLE = {
    // G0 — present
    sasha:  {gen:0, line:'hydrie',  name:'Sasha Hydrie',  d:'reference person', ref:true},
    karina: {gen:0, line:'hydrie',  name:'Karina Hydrie', r:'sister',  sibOf:'sasha'},
    zubin:  {gen:0, line:'hydrie',  name:'Zubin',         r:'cousin · paternal', collateral:true},
    masha:  {gen:0, line:'russian', name:'Masha',         r:'cousin · maternal', collateral:true},

    // G1 — parents (and their siblings)
    waris:  {gen:1, line:'hydrie',  name:'Waris Hydrie',  r:'father'},
    yelena: {gen:1, line:'russian', name:'Yelena A. Yershova', d:'PhD, U. Minnesota', r:'mother'},
    aamer:  {gen:1, line:'hydrie',  name:'Aamer Hydrie',  d:'Seattle', r:"father's brother", sibOf:'waris', collateral:true},
    olga:   {gen:1, line:'russian', name:'Olga "Ola"',    r:"mother's sister · Masha's parent", sibOf:'yelena', collateral:true},

    // G2 — grandparents (and Dadi's / collateral siblings)
    saeed:    {gen:2, line:'hydrie', name:'Saeed Hydrie "Dada"', d:'from Dera Ismail Khan', r:'grandfather'},
    firdausi: {gen:2, line:'azam',   name:'Firdausi "Dadi"', d:'née Azam · living', r:'grandmother'},
    anatoly:  {gen:2, line:'russian',name:'Anatoly Yershov', d:'army · b. Dec 11', r:'grandfather'},
    babushka: {gen:2, line:'russian',name:'Babushka', d:'name ? · poss. Margarita', r:'grandmother', unknown:true},
    nusayr:   {gen:2, line:'azam',   name:'S. Nusayr Azam', r:"Dadi's sister", sibOf:'firdausi', collateral:true},
    azam3:    {gen:2, line:'azam',   name:'+ 3 siblings', d:'names ?', r:"Dadi's siblings", sibOf:'firdausi', collateral:true, unknown:true},

    // G3 — great-grandparents (eight slots; many unknown)
    hyd_gf:  {gen:3, line:'hydrie', name:'? Hydrie', d:'Dera Ismail Khan', r:"Saeed's father", unknown:true},
    hyd_gm:  {gen:3, line:'hydrie', name:'?', d:'Dera Ismail Khan', r:"Saeed's mother", unknown:true},
    wasif:   {gen:3, line:'azam',   name:'Syed Wasif Azam', d:'d. 18 Mar 2008', r:"Firdausi's father"},
    nana:    {gen:3, line:'zaheer', name:'Nana', d:'name ? · Zaheer line', r:"Firdausi's mother", unknown:true},
    yer_gf:  {gen:3, line:'russian',name:'? Yershov', r:"Anatoly's father", unknown:true},
    yer_gm:  {gen:3, line:'russian',name:'?', r:"Anatoly's mother", unknown:true},
    bab_gf:  {gen:3, line:'russian',name:'?', r:"Babushka's father", unknown:true},
    bab_gm:  {gen:3, line:'russian',name:'?', r:"Babushka's mother", unknown:true},

    // G4+ — documented apex ancestors (extend up the line)
    mohammed: {gen:4, line:'azam',  name:'Syed Mohammed Azam', d:'"Nawab Azam Jung"\nVC, Osmania Univ. 1943–45', r:"Wasif's father"},
    akbar:    {gen:4, line:'azam',  name:'Akbar Azam', r:"Mohammed's son", sibOf:'wasif', collateral:true},
    // Nana descends from a daughter of Wazir Hasan -> via one of his daughters
    nanaMother:{gen:4, line:'zaheer', name:'?', d:'Nur Fatima or Nur Zehra', r:"Nana's mother — which? open", unknown:true},
    wazir:    {gen:5, line:'zaheer', name:'Sir Syed Wazir Hasan', d:'Knight Bachelor 1932\nChief Judge, Chief Court of Oudh', r:'apex · maternal'},
  };

  // Marriages / partnerships. children: ids whose parents are this couple.
  const UNIONS = [
    {a:'waris',   b:'yelena',   children:['sasha','karina']},
    {a:'saeed',   b:'firdausi', children:['waris']},          // (+ Aamer via sibOf)
    {a:'anatoly', b:'babushka', children:['yelena']},          // (+ Olga via sibOf)
    {a:'hyd_gf',  b:'hyd_gm',   children:['saeed']},
    {a:'wasif',   b:'nana',     children:['firdausi']},
    {a:'yer_gf',  b:'yer_gm',   children:['anatoly']},
    {a:'bab_gf',  b:'bab_gm',   children:['babushka']},
    {a:'mohammed',b:null,       children:['wasif']},           // single documented parent
    {a:'nanaMother', b:null,    children:['nana']},
    {a:'wazir',   b:null,       children:['nanaMother']},
    {a:'olga',    b:null,       children:['masha']},   // cousin, via known parent
    {a:'aamer',   b:null,       children:['zubin']},   // cousin (Aamer's child)
  ];

  // Zaheer collateral branch (relatives of Wazir Hasan, not direct ancestors).
  // Rendered as a self-contained mini-tree below the main fan.
  const ZAHEER = {
    title:'Zaheer collateral — descendants of Sir Wazir Hasan (relatives, not direct ancestors)',
    nodes:{
      z_wazir: {col:0, name:'Sir Syed Wazir Hasan', d:'1873–1947 · Knight Bachelor 1932', line:'zaheer'},
      z_ali:   {col:1, name:'Syed Ali Zaheer',   d:'1896–1983 · lawyer / minister', line:'zaheer'},
      z_husain:{col:1, name:'Syed Husain Zaheer',d:'1901–1975 · chemist, CSIR',     line:'zaheer'},
      z_sajjad:{col:1, name:'Sajjad Zaheer',     d:'1905–1973 · writer',            line:'zaheer'},
      z_nurf:  {col:1, name:'Nur Fatima', d:'daughter', line:'zaheer'},
      z_nurz:  {col:1, name:'Nur Zehra',  d:'daughter', line:'zaheer'},
      z_akbar: {col:2, name:'Akbar "Aks" Zaheer',d:'grandson · professor', line:'zaheer'},
      z_sri:   {col:2, name:'Srilata "Sri" Zaheer', d:'⚭ Akbar', line:'zaheer'},
      z_hashima:{col:2, name:'Dr. Hashima Hasan',d:'b.1950 · NASA · Dadi’s cousin', line:'zaheer'},
      z_sage:  {col:3, name:'Sajjad "Sage" Zaheer', d:'son of Akbar & Sri', line:'zaheer'},
      z_reese: {col:4, name:'Reese',  d:'child of Sage', line:'zaheer'},
      z_hudson:{col:4, name:'Hudson', d:'child of Sage', line:'zaheer'},
    },
    edges:[
      ['z_wazir','z_ali'],['z_wazir','z_husain'],['z_wazir','z_sajjad'],
      ['z_wazir','z_nurf'],['z_wazir','z_nurz'],
      ['z_wazir','z_akbar'],         // grandson (compressed link)
      ['z_wazir','z_hashima'],       // great-granddaughter (compressed link)
      ['z_akbar','z_sage'],['z_sri','z_sage'],
      ['z_sage','z_reese'],['z_sage','z_hudson'],
    ]
  };

  // Extra detail shown on hover (factual notes from the fuller record).
  const BIO = {
    sasha:`Reference person for this tree — son of Waris Hydrie and Yelena Yershova, where the Hydrie, Azam, Zaheer and Russian lines meet.`,
    karina:`Daughter of Waris and Yelena; Sasha's sister.`,
    zubin:`A Hydrie cousin of Sasha's generation, on the paternal side.`,
    masha:`Sasha's cousin on the maternal (Russian) side; daughter of Olga.`,
    waris:`Son of Saeed and Firdausi; carries the Hydrie line. Brother of Aamer.`,
    yelena:`Yelena Anatolyevna Yershova, from Russia. PhD, University of Minnesota; senior lecturer at the Carlson School of Management.`,
    aamer:`Waris's brother; lives in Seattle.`,
    olga:`Yelena's sister; Masha's mother.`,
    saeed:`"Dada." The Hydrie line, from Dera Ismail Khan in Khyber Pakhtunkhwa — Pathan. Married Firdausi Azam.`,
    firdausi:`"Dadi." Daughter of Syed Wasif Azam; granddaughter of Nawab Azam Jung, and great-granddaughter of Sir Wazir Hasan through her mother, Nana. The family's primary source for this record.`,
    anatoly:`Sasha's maternal grandfather; served in the army; birthday 11 December. Living.`,
    babushka:`Sasha's maternal grandmother; first name not yet confirmed (possibly Margarita).`,
    nusayr:`S. Nusayr Azam — Firdausi's sister, recorded as a daughter of Wasif in the Kokapet court case.`,
    azam3:`Wasif left four daughters and one son; three of Firdausi's siblings are not yet named.`,
    wasif:`Syed Wasif Azam. Son of Nawab Azam Jung; father of Firdausi and Nusayr. Died intestate, 18 March 2008; the Kokapet court record names four daughters and one son as heirs.`,
    nana:`Firdausi's mother — a granddaughter of Sir Wazir Hasan. Her own name is not yet known.`,
    hyd_gf:`Saeed's father; the Hydrie family of Dera Ismail Khan. Name not yet known.`,
    mohammed:`"Nawab Azam Jung." Vice-Chancellor of Osmania University, 1943–45; earlier Principal of Government City College (credited with its 1920 building). Held the family land at Banjara Hills and Kokapet. Sasha's great-great-grandfather.`,
    akbar:`Mohammed Azam's son and Wasif's brother; very likely the "Mohd Akbar Azam" on the Banjara Hills land record.`,
    nanaMother:`Nana's mother was one of Sir Wazir Hasan's two daughters — Nur Fatima or Nur Zehra. Which one is still open.`,
    wazir:`Sir Syed Wazir Hasan. Knight Bachelor (1932); Chief Judge of the Chief Court of Oudh at Lucknow; Secretary and 1936 President of the All-India Muslim League. Sasha's great-great-great-grandfather (maternal).`,
    z_wazir:`Sir Syed Wazir Hasan. Knight Bachelor (1932); Chief Judge of the Chief Court of Oudh at Lucknow; Secretary and 1936 President of the All-India Muslim League.`,
    z_ali:`Syed Ali Zaheer (1896–1983) — barrister, Union Law Minister, and India's Ambassador to Iran. Son of Wazir Hasan.`,
    z_husain:`Syed Husain Zaheer (1901–1975) — chemist and Director-General of the CSIR. Son of Wazir Hasan.`,
    z_sajjad:`Sajjad Zaheer (1905–1973) — writer, founder of the Progressive Writers' Movement, co-author of Angarey. Son of Wazir Hasan.`,
    z_nurf:`Nur Fatima — daughter of Wazir Hasan. Her son was the historian and Education Minister Saiyid Nurul Hasan.`,
    z_nurz:`Nur Zehra — daughter of Wazir Hasan.`,
    z_akbar:`Akbar "Aks" Zaheer — professor at the University of Minnesota (Carlson). Grandson of Wazir Hasan; Sasha's great-uncle once removed.`,
    z_sri:`Srilata "Sri" Zaheer — professor and former Dean of the Carlson School of Management; married to Aks.`,
    z_hashima:`Dr. Hashima Hasan (b. 1950) — NASA astrophysicist and Hubble Optical Telescope Assembly Scientist. Great-granddaughter of Wazir Hasan; Dadi's cousin.`,
    z_sage:`Sajjad "Sage" Zaheer — son of Aks and Sri.`,
    z_reese:`Child of Sage.`,
    z_hudson:`Child of Sage.`,
  };

  /* ============================================================================
     LAYOUT ENGINE
     ========================================================================== */
  const NS='http://www.w3.org/2000/svg';
  const W=176, H=52;                 // node box size
  const COL_GAP=84;                  // horizontal gap between generations
  const COL_W=W+COL_GAP;             // pitch
  const PAD_L=4, PAD_T=24;           // top padding leaves room for column headers
  const ROW=70;                      // vertical pitch for a node slot
  const stage=document.getElementById('stage');
  const svg=document.getElementById('wires');

  const COL_NAMES=['Sasha','Parents','Grandparents','Great-grandparents','Apex','Apex'];

  // ---- assign vertical positions ----------------------------------------------
  // Direct-line spine: place each generation's primary couples evenly, then
  // recurse parents to bracket around their child. We compute Y for each person.
  const Y={};      // person id -> center y (px)
  const maxGen=Math.max(...Object.values(PEOPLE).map(p=>p.gen));

  // Build child->parents map from unions
  const parentsOf={}; const unionByParent={};
  UNIONS.forEach(u=>{
    (u.children||[]).forEach(c=>{ parentsOf[c]=[u.a,u.b].filter(Boolean); });
    unionByParent[u.a]=u; if(u.b) unionByParent[u.b]=u;
  });

  // Recursive vertical layout over the ancestor binary-ish tree, anchored at sasha.
  // We give each ancestor a vertical band whose height halves each generation up.
  let cursor=0;
  const SPINE_GAP=ROW;             // base gap unit
  function placeAncestors(id, top, height){
    // center this person in [top, top+height]
    Y[id]=top+height/2;
    const ps=parentsOf[id];
    if(!ps||!ps.length) return;
    if(ps.length===1){
      placeAncestors(ps[0], top, height);
    }else{
      placeAncestors(ps[0], top, height/2);            // father upper half
      placeAncestors(ps[1], top+height/2, height/2);   // mother lower half
    }
  }
  // total vertical span: 8 great-grandparent slots -> give generous height
  const SPAN = 8*ROW*1.15;
  placeAncestors('sasha', PAD_T, SPAN);

  // siblings: stack just below their reference sibling, in same gen column
  // group siblings by the person they attach to
  const sibsByAnchor={};
  Object.entries(PEOPLE).forEach(([id,p])=>{
    if(p.sibOf){ (sibsByAnchor[p.sibOf]=sibsByAnchor[p.sibOf]||[]).push(id); }
  });
  // assign sibling Y as small offshoots below anchor; nudge to avoid the spine math.
  Object.entries(sibsByAnchor).forEach(([anchor,sibs])=>{
    let baseY=Y[anchor];
    sibs.forEach((sid,i)=>{ Y[sid]=baseY + (i+1)* (ROW*0.62); });
  });

  // place any remaining children that have a single known parent (e.g. cousins)
  // near that parent, so they don't pile up at the origin.
  UNIONS.forEach(u=>{ (u.children||[]).forEach(c=>{ if(Y[c]==null && Y[u.a]!=null) Y[c]=Y[u.a]; }); });

  // ---- emit nodes & compute extents ------------------------------------------
  function colX(gen){ return PAD_L + gen*COL_W; }
  let maxX=0, maxY=0;

  // column headers
  for(let g=0; g<=maxGen; g++){
    const x=colX(g);
    const h=document.createElement('div');
    h.className='colhdr'; h.style.left=x+'px'; h.style.top='0px';
    h.textContent='G'+(-g===0?'0':('-'+g))+' · '+(COL_NAMES[g]||'');
    stage.appendChild(h);
  }

  function makeNode(id,p){
    const x=colX(p.gen), y=(Y[id]??PAD_T)-H/2;
    const el=document.createElement('div');
    el.className='node e-'+(p.line||'unknown')
      + (p.ref?' ref':'') + (p.unknown?' unknown':'') + (p.collateral?' collateral':'');
    el.style.left=x+'px'; el.style.top=y+'px'; el.style.width=W+'px'; el.style.minHeight=H+'px';
    let html='<div class="n">'+esc(p.name)+'</div>';
    if(p.d) html+='<div class="d">'+esc(p.d).replace(/\n/g,'<br>')+'</div>';
    if(p.r) html+='<div class="r">'+esc(p.r)+'</div>';
    el.innerHTML=html;
    const bio=BIO[id];
    if(bio){ el.setAttribute('data-bio',bio); el.setAttribute('data-nm',p.name); if(p.r) el.setAttribute('data-rl',p.r); el.setAttribute('data-ln',p.line||'rule'); }
    stage.appendChild(el);
    maxX=Math.max(maxX, x+W); maxY=Math.max(maxY, y+Math.max(H, el.offsetHeight));
  }
  function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

  Object.entries(PEOPLE).forEach(([id,p])=>makeNode(id,p));

  // ---- draw wires (SVG, right-angle) -----------------------------------------
  // For each union with children: bracket the couple, then elbow to each child.
  function line(x1,y1,x2,y2,cls){
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1); l.setAttribute('y1',y1);
    l.setAttribute('x2',x2); l.setAttribute('y2',y2);
    l.setAttribute('stroke', cls||'var(--rule)');
    l.setAttribute('stroke-width','1.4');
    svg.appendChild(l);
  }
  function lineColor(line_){return 'var(--'+(line_||'rule')+')';}

  // child sits to the LEFT (lower gen), parents to the RIGHT (higher gen).
  UNIONS.forEach(u=>{
    const pa=PEOPLE[u.a], pb=u.b?PEOPLE[u.b]:null;
    const xPar=colX(pa.gen);                 // left edge of parent column
    const yA=Y[u.a], yB=pb?Y[u.b]:yA;
    const col=lineColor(pa.line);
    // marriage bracket: vertical bar just left of parents joining the couple
    const bx=xPar-18;
    const ymin=Math.min(yA,yB), ymax=Math.max(yA,yB), ymid=(yA+yB)/2;
    if(pb){
      line(xPar,yA,bx,yA,col);              // father stub
      line(xPar,yB,bx,yB,col);              // mother stub
      line(bx,ymin,bx,ymax,col);            // vertical join
    }else{
      line(xPar,yA,bx,yA,col);              // single parent stub
    }
    // from bracket midpoint, elbow left to each child's right edge
    (u.children||[]).forEach(c=>{
      const yc=Y[c]; const xcRight=colX(PEOPLE[c].gen)+W;
      const mx=(bx+xcRight)/2;              // mid x for the elbow
      line(bx,ymid,mx,ymid,col);           // out from bracket
      line(mx,ymid,mx,yc,col);             // vertical to child's row
      line(mx,yc,xcRight,yc,col);          // into child's right edge
    });
  });

  // sibling offshoots: connect each sibling to its anchor with a small elbow
  Object.entries(sibsByAnchor).forEach(([anchor,sibs])=>{
    const ga=PEOPLE[anchor].gen;
    const xRight=colX(ga)+W;
    const xa=colX(ga); // left edge of anchor
    sibs.forEach(sid=>{
      const col=lineColor(PEOPLE[sid].line);
      // small bracket off the anchor's left edge dropping to the sibling
      const bx=xa-9;
      line(xa,Y[anchor],bx,Y[anchor],col);
      line(bx,Y[anchor],bx,Y[sid],col);
      line(bx,Y[sid],xa,Y[sid],col);
    });
  });

  // size the svg + stage
  maxX=Math.max(maxX, colX(maxGen)+W)+30;
  maxY=maxY+30;
  svg.setAttribute('width',maxX); svg.setAttribute('height',maxY);
  svg.style.width=maxX+'px'; svg.style.height=maxY+'px';

  /* ============================================================================
     ZAHEER collateral mini-tree — rendered below the main fan, right-to-left (root on the right).
     ========================================================================== */
  const zWrap=document.createElement('div');
  zWrap.style.cssText='margin-top:46px; padding-top:18px; border-top:1px solid var(--rule);';
  const zTitle=document.createElement('div');
  zTitle.className='colhdr';
  zTitle.style.cssText='position:static; display:block; margin-bottom:14px;';
  zTitle.textContent=ZAHEER.title;
  zWrap.appendChild(zTitle);

  const zStage=document.createElement('div');
  zStage.style.cssText='position:relative;';
  const zSvg=document.createElementNS(NS,'svg');
  zSvg.style.cssText='position:absolute; top:0; left:0; pointer-events:none;';
  zStage.appendChild(zSvg);
  zWrap.appendChild(zStage);
  document.querySelector('.scroller').appendChild(zWrap);

  // simple column layout for zaheer: assign rows per column in declaration order
  const zCol={};   // col -> running row index
  const zPos={};   // id -> {x,y}
  const ZW=176, ZH=46, ZGAPX=70, ZGAPY=20;
  const zMaxCol=Math.max(...Object.values(ZAHEER.nodes).map(n=>n.col));
  Object.entries(ZAHEER.nodes).forEach(([id,n])=>{
    const c=n.col; const row=(zCol[c]=(zCol[c]??0)); zCol[c]=row+1;
    const x=4 + (zMaxCol-c)*(ZW+ZGAPX);   // mirror: col 0 (Wazir) on the right, descendants fan left
    const y=PAD_T + row*(ZH+ZGAPY);
    zPos[id]={x,y,cx:x,cy:y+ZH/2};
  });
  // center each parent vertically against its children (single pass, good enough)
  ZAHEER.edges.forEach(([p,ch])=>{ /* layout already reasonable */ });

  let zMaxX=0, zMaxY=0;
  Object.entries(ZAHEER.nodes).forEach(([id,n])=>{
    const pos=zPos[id];
    const el=document.createElement('div');
    el.className='node collateral e-'+(n.line||'unknown')+(n.unknown?' unknown':'');
    el.style.cssText='left:'+pos.x+'px; top:'+pos.y+'px; width:'+ZW+'px; min-height:'+ZH+'px;';
    let html='<div class="n">'+esc(n.name)+'</div>';
    if(n.d) html+='<div class="d">'+esc(n.d).replace(/\n/g,'<br>')+'</div>';
    el.innerHTML=html;
    const zb=BIO[id];
    if(zb){ el.setAttribute('data-bio',zb); el.setAttribute('data-nm',n.name); el.setAttribute('data-ln',n.line||'rule'); }
    zStage.appendChild(el);
    zMaxX=Math.max(zMaxX,pos.x+ZW); zMaxY=Math.max(zMaxY,pos.y+Math.max(ZH,el.offsetHeight));
  });
  function zline(x1,y1,x2,y2){
    const l=document.createElementNS(NS,'line');
    l.setAttribute('x1',x1);l.setAttribute('y1',y1);l.setAttribute('x2',x2);l.setAttribute('y2',y2);
    l.setAttribute('stroke','var(--zaheer)');l.setAttribute('stroke-width','1.4');
    zSvg.appendChild(l);
  }
  ZAHEER.edges.forEach(([p,c])=>{
    const P=zPos[p], C=zPos[c];
    const x1=P.x,    y1=P.cy;        // parent LEFT edge (parent now sits on the right)
    const x2=C.x+ZW, y2=C.cy;        // child RIGHT edge (descendants fan left)
    const mx=(x1+x2)/2;
    zline(x1,y1,mx,y1); zline(mx,y1,mx,y2); zline(mx,y2,x2,y2);
  });
  zMaxX+=30; zMaxY+=20;
  zSvg.setAttribute('width',zMaxX); zSvg.setAttribute('height',zMaxY);
  zSvg.style.width=zMaxX+'px'; zSvg.style.height=zMaxY+'px';
  zStage.style.height=zMaxY+'px';

  // final stage sizing
  stage.style.width=maxX+'px';
  stage.style.height=maxY+'px';

  // ---- hover tooltips: reveal fuller detail ----------------------------------
  const tip=document.createElement('div'); tip.id='tip'; document.body.appendChild(tip);
  function moveTip(e){
    const pad=14, w=tip.offsetWidth, h=tip.offsetHeight;
    let x=e.clientX+pad, y=e.clientY+pad;
    if(x+w>window.innerWidth-8) x=e.clientX-w-pad;
    if(y+h>window.innerHeight-8) y=window.innerHeight-h-8;
    if(x<8) x=8; if(y<8) y=8;
    tip.style.left=x+'px'; tip.style.top=y+'px';
  }
  document.addEventListener('mouseover',e=>{
    const n=e.target.closest('.node[data-bio]'); if(!n) return;
    const nm=n.getAttribute('data-nm')||'', rl=n.getAttribute('data-rl')||'', ln=n.getAttribute('data-ln')||'rule';
    tip.style.setProperty('--tc','var(--'+ln+')');
    tip.innerHTML='<div class="tn">'+esc(nm)+'</div>'+(rl?'<div class="tr">'+esc(rl)+'</div>':'')+'<div class="tb">'+esc(n.getAttribute('data-bio'))+'</div>';
    tip.classList.add('show'); moveTip(e);
  });
  document.addEventListener('mousemove',e=>{ if(tip.classList.contains('show')) moveTip(e); });
  document.addEventListener('mouseout',e=>{ const n=e.target.closest('.node[data-bio]'); if(n && !n.contains(e.relatedTarget)) tip.classList.remove('show'); });
</script>
</body>
</html>
